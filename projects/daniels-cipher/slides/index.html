      S.step({ say: 'Why does a cut of the Discard Pile do this? I don’t know yet. I observed it; I did not derive it. It’s the most interesting open question this work leaves.' });
      S.beat(0.45, (s) => cap(s, 'Why? Not yet known: observed, not derived',
        'Only the Discard Pile cut changed, yet the whole cycle structure moved.\nWhy is the deepest open question this work leaves.'));
      S.beat(0.6, (s) => { s.rotBx.o = 1; });
      S.beat(0.6, (s) => { s.why.o = 1; });
      S.hold(0.3);
    };
  }

  // ---- analysis
  // The rotation analysis grows out of the rotation slide's last frame (Scott, 2026-10-05): the four rotation labels
  // become the four cards' titles, the largest-cycle shares leave their bars and the shortest-cycle values their column
  // for the cards, and the typical periods join them. The next click marks rotation 5, the recommendation; the weak
  // keys are left for Part 4.
  function buildAnalysis(S) {
    const { CONFIGS } = S.grid, I = 2, CW = 417, CY = 30, CH = 660, CX = [0, 1, 2, 3].map((j) => 72 + j * (CW + 36));
    const LY = [220, 350, 480], VY = [262, 392, 522], LBL = ['Typical period (rounds)', 'Largest cycle holds', 'Shortest reachable cycle'];
    const PERIOD = ['649 million', '518 million', '769 million', '1,038 million'], RV = ['0', '1', '3', '5'];
    const mid = (j) => CX[j] + CW / 2 + 20;      // a card's title and badge, centred right of its corner index
    for (let j = 0; j < 4; j++) {
      const red = j % 2 === 1, col = red ? RED : INK, x = CX[j];
      S.add('anC' + j, 'rect', {}, { x, y: CY, w: CW, h: CH, rx: 16, fill: '#FFFFFF', stroke: '#CFCFCF', sw: 2, o: 0, z: 1 });
      S.add('anR' + j, 'text', { size: 34, weight: 700, family: root.Anim.SERIF }, { x: x + 22, y: CY + 52, content: RV[j], fill: col, o: 0, z: 3 });
      S.add('anS' + j, 'text', { size: 28, family: 'Segoe UI Symbol, Arial' }, { x: x + 23, y: CY + 88, content: red ? '♥' : '♠', fill: col, o: 0, z: 3 });
      LBL.forEach((t, m) => S.add(`anL${j}${m}`, 'text', { size: 22 }, { x: x + 32, y: CY + LY[m], content: t, fill: GREY, o: 0, z: 3 }));
      S.add('anP' + j, 'text', { size: 32, weight: 700 }, { x: x + 32, y: CY + VY[0], content: PERIOD[j], o: 0, z: 3 });
      S.add('anG' + j, 'text', { size: 32, weight: 700 }, { x: x + 32, y: CY + VY[1], content: `${(CONFIGS[I].cells[j][0] * 100).toFixed(1)}%`, o: 0, z: 3 });
    }
    S.add('anB', 'rect', {}, { x: mid(3) - 150, y: CY + 94, w: 300, h: 52, rx: 10, fill: RED, sw: 0, o: 0, z: 3 });
    S.add('anBT', 'text', { size: 26, weight: 700, anchor: 'middle' }, { x: mid(3), y: CY + 129, content: 'Recommended', fill: '#FFFFFF', o: 0, z: 4 });
    // what the rotation slide leaves on screen that the cards don't keep
    const gone = ['rotBx', 'why', 'rHead', 'kH'];
    for (let j = 0; j < 4; j++) {
      gone.push('rg' + j, `z2${j}n`, `z2${j}c`);
      for (let k = 0; k < 4; k++) { gone.push(`z2${j}a${k}`, `rr${j}${k}`); if (k) gone.push(`rr${j}${k}t`); }
    }
    const byCard = (id) => { const m = id.match(/^(?:an[A-Z]|zCol|kV|rr)(\d)/); if (!m) return null; const a = +m[1] * 0.08; return { w: [a, a + 0.72] }; };
    return () => {
      // ---- step 0: the rotation slide's four rows turn into four cards
      S.step({ say: 'Putting it together at eight cards. Here are the four rotations side by side: the typical period, which is how long a typical stream runs before it repeats; the share of all states in the largest cycle; and the shortest cycle a real key can reach.' });
      S.beat(0.45, (s) => cap(s, 'The four analyzed rotations, side by side',
        'At 8 cards: how long until a typical stream repeats, how big the largest cycle is, and the shortest cycle a real key reaches.\nFour of the 8 possible rotations; this says nothing about randomness or about 26 cards.'));
      S.beat(0.6, (s) => {
        gone.forEach((k) => { if (s[k]) s[k].o = 0; });
        for (let j = 0; j < 4; j++) s[`rr${j}0t`].fill = INK;     // off its red bar, the share turns dark
      });
      S.beat(1.4, (s) => {
        for (let j = 0; j < 4; j++) {
          ['anC', 'anR', 'anS'].forEach((p) => { s[p + j].o = 1; });
          for (let m = 0; m < 3; m++) s[`anL${j}${m}`].o = 1;
          Object.assign(s['zCol' + j], { x: mid(j), y: CY + 64, content: `Rotation ${RV[j]}`, s: 1.33, z: 4 });
          Object.assign(s[`rr${j}0t`], { x: CX[j] + 32 + 43, y: CY + VY[1], s: 1.333, z: 6 });
          Object.assign(s['kV' + j], { x: CX[j] + 32, y: CY + VY[2], z: 4 });
        }
      }, byCard);
      S.beat(0.25, (s) => { for (let j = 0; j < 4; j++) { s[`rr${j}0t`].o = 0; s['anG' + j].o = 1; } });   // the same number, left-aligned
      S.beat(0.6, (s) => { for (let j = 0; j < 4; j++) s['anP' + j].o = 1; }, byCard);
      S.hold(0.3);

      // ---- step 1: the recommendation
      S.step({ say: 'Rotation 5 is the one I recommend: the biggest dominant cycle, 78 percent of all states; the longest typical period, about a billion rounds; and the highest floor. Rotations 0 and 3 each let a real key onto a four-round cycle. Three honest limits. It is the best of four tested, out of eight possible at this size. It is a finding for eight cards: at six cards, rotation 5 still has the biggest cycle and the longest typical period, but a real key there reaches an 11-round cycle, so the criteria disagree. And it says nothing about randomness, or about the full 26-card deck.' });
      S.beat(0.45, (s) => cap(s, 'Rotation 5: the one I recommend',
        'The biggest cycle, 78.4% of all states; the longest typical period; and no real key reaches a cycle under 289 rounds.\nAt 6 cards rotation 5 still has the biggest cycle, but a real key there reaches an 11-round cycle: this is a finding for 8 cards.'));
      S.beat(0.7, (s) => { Object.assign(s.anC3, { fill: '#F3F3F3', stroke: RED, sw: 4 }); s.anB.o = 1; s.anBT.o = 1; });
      S.hold(0.4);
    };
  }

  // ================================================================ keys
  // The key slide and the 256-keys slide are one animation, sliced in two (Scott, 2026-10-05), so the 256-keys slide
  // opens exactly where the key slide stops: BAAD and ABBA on the mini map. Each part adds its objects and returns its
  // steps; S.keyPart carries what the second part needs from the first.
  function buildKeys(S) {
    const X0 = 420, P = 136, Y = { drive: 236, search: 486 };
    const sx = (i) => X0 + i * P;
    const L = loopData();

    const KEY1 = 'BAAD', KEY2 = 'ABBA';
    const ks1 = C.keySchedule(START_DRIVE, START_SEARCH, KEY1, '');
    const fr1 = C.fullRound(ks1.drive, ks1.search, ROT);
    const ks2 = C.keySchedule(START_DRIVE, START_SEARCH, KEY2, '');
    const fr2 = C.fullRound(ks2.drive, ks2.search, ROT);
    const c1 = C.stateCode(fr1.drive, fr1.search), c2 = C.stateCode(fr2.drive, fr2.search);

    S.add('keyLbl', 'text', { size: 27, weight: 700, ls: 1.5 }, { x: 72, y: 96, content: 'KEY' });
    S.add('keySub', 'text', { size: 21 }, { x: 72, y: 128, content: 'letters convert to numbers', fill: GREY });
    for (let i = 0; i < 4; i++) {
      S.add('kt' + i, 'rect', {}, { x: sx(i) + 8, y: 38, w: 100, h: 92, rx: 12, fill: '#FFFFFF', stroke: CHAR, sw: 2.5 });
      S.add('kl' + i, 'text', { size: 54, weight: 700, anchor: 'middle', family: root.Anim.SERIF }, { x: sx(i) + 58, y: 104, content: KEY1[i] });
      S.add('kv' + i, 'text', { size: 23, anchor: 'middle' }, { x: sx(i) + 58, y: 162, content: '= ' + (KEY1.charCodeAt(i) - 65), fill: GREY });
    }
    S.add('kLegend', 'text', { size: 22 }, { x: 1000, y: 96, content: ['A = 0', 'B = 1', 'C = 2', 'D = 3'].join(GAP), fill: GREY, z: 60 });
    const rowLabel = (key, title, sub, y) => {
      S.add(key + 'T', 'text', { size: 27, weight: 700, ls: 1.5 }, { x: 72, y, content: title });
      S.add(key + 'S', 'text', { size: 21 }, { x: 72, y: y + 32, content: sub, fill: GREY });
    };
    rowLabel('lblDrive', 'DRIVE DECK', 'starts as A 2 3 4', Y.drive + 70);
    rowLabel('lblSearch', 'SEARCH DECK', 'starts as A 2 3 4', Y.search + 70);

    // right panel: the four moves each letter makes
    const OX = 1080;
    S.add('opsT', 'text', { size: 25, weight: 700 }, { x: OX, y: 252, content: 'Each letter drives four cuts' });
    const opY = [306, 360, 414, 468];
    for (let j = 0; j < 4; j++) {
      S.add('hl' + j, 'rect', {}, { x: OX - 14, y: opY[j] - 34, w: 800, h: 48, rx: 10, fill: GOLD, fo: 0.45, sw: 0, o: 0, z: -1 });
      S.add('op' + j, 'text', { size: 25 }, { x: OX, y: opY[j], content: '' });
    }
    const opText = (o) => [
      `1. Drive Deck: Count Cut by this letter (${o.face})`,
      `2. Drive Deck: Search Cut for the next letter (${o.next})`,
      `3. Search Deck: Search Cut for this letter (${o.face})`,
      `4. Search Deck: Count Cut by the next letter (${o.next})`];
    S.add('stageLbl', 'text', { size: 25, weight: 700, ls: 1 }, { x: 72, y: 690, content: '', fill: RED });

    // mini loop map
    const MR = [{ cx: 1280, cy: 440, r: 150 }, { cx: 1545, cy: 440, r: 68 }, { cx: 1715, cy: 370, r: 26 }, { cx: 1715, cy: 510, r: 26 }];
    MR.forEach((m, i) => {
      S.add('mr' + i, 'ring', {}, { x: m.cx, y: m.cy, r: m.r, stroke: LOOP_COL[i], sw: i < 2 ? 7 : 5, draw: 0, o: 0 });
      // numbered by size, largest first, over its number of states: inside the two big rings, under the small ones
      // (a key's marker label sits beside a small ring)
      const big = i < 2, y = big ? m.cy + [0, -2][i] : m.cy + m.r + 24;
      S.add('mrl' + i, 'text', { size: [30, 22, 20, 20][i], weight: 700, anchor: 'middle' },
        { x: m.cx, y, content: `Cycle #${i + 1}`, fill: LOOP_COL[i], o: 0 });
      S.add('mrs' + i, 'text', { size: [22, 17, 16, 16][i], anchor: 'middle' },
        { x: m.cx, y: y + [32, 23, 20, 20][i], content: `${L.cyc[i].length} States`, fill: GREY, o: 0 });
    });
    S.add('mrT', 'text', { size: 25, weight: 700 }, { x: OX, y: 252, content: 'The four cycles from earlier', o: 0, z: 60 });
    const mpos = (code) => { const w = L.where[code], m = MR[w.ci], a = -Math.PI / 2 + (2 * Math.PI * w.k) / L.cyc[w.ci].length; return { x: m.cx + m.r * Math.cos(a), y: m.cy + m.r * Math.sin(a), ci: w.ci, a }; };
    const p1 = mpos(c1), p2 = mpos(c2), ARC1 = 125, ARC2 = 120;     // high enough to clear the tiles
    // Each key's marker comes out of the key itself (Scott, 2026-10-05): it starts as a gold frame around the key.
    const KC = { x: (sx(1) + sx(2)) / 2 + 58, y: 84 }, KTOP = 22;
    const FRAME = { x: sx(0) - 6, y: 29, w: sx(3) - sx(0) + 128, h: 110, rx: 20, fill: GOLD, fo: 0, stroke: GOLD_D, sw: 5 };
    const dotAt = (x, y) => ({ x: x - 14, y: y - 14, w: 28, h: 28, rx: 14 });
    S.add('mk1', 'rect', {}, Object.assign({}, FRAME, { o: 0, z: 50 }));
    S.add('mk1L', 'text', { size: 27, weight: 700, anchor: Math.cos(p1.a) >= 0 ? 'start' : 'end', family: root.Anim.SERIF },
      { x: p1.x + 34 * Math.cos(p1.a), y: p1.y + 34 * Math.sin(p1.a) + 9, content: KEY1, o: 0, z: 50 });
    S.add('mk2', 'rect', {}, Object.assign({}, FRAME, { o: 0, z: 50 }));
    S.add('mk2L', 'text', { size: 27, weight: 700, anchor: 'start', family: root.Anim.SERIF }, { x: MR[p2.ci].cx + 40, y: MR[p2.ci].cy + 10, content: KEY2, o: 0, z: 50 });   // level with the ring, clear of its label below

    START_DRIVE.forEach((id, i) => S.add(id, 'card', { suit: 'S', v: C.val(id), w: CARD_W, h: CARD_H }, { x: sx(i), y: Y.drive, z: 10 }));
    START_SEARCH.forEach((id, i) => S.add(id, 'card', { suit: 'H', v: C.val(id), w: CARD_W, h: CARD_H }, { x: sx(i), y: Y.search, z: 10 }));

    // move each card of a row to its new index; rightward movers arc up, leftward dip down
    function morph(from, to, row, dur) {
      S.beat(dur, (s) => to.forEach((id, i) => { s[id].x = sx(i); s[id].y = Y[row]; s[id].z = 10 + i; }),
        (id) => { const a = from.indexOf(id), b = to.indexOf(id); return a < 0 || b < 0 || a === b ? null : { arc: b > a ? 38 : -38 }; });
    }
    function letter(o, fast) {
      const d = fast ? 0.42 : 0.85, gap = fast ? 0.08 : 0.3;
      S.beat(fast ? 0.25 : 0.45, (s) => {
        for (let i = 0; i < 4; i++) { s['kt' + i].fill = '#FFFFFF'; s['kt' + i].sw = 2.5; s['kt' + i].stroke = CHAR; }
        s['kt' + o.i].fill = GOLD;     // only the letter in use is lit, as in the ABBA replay (Scott, 2026-10-05)
        opText(o).forEach((t, j) => { s['op' + j].content = t; s['hl' + j].o = 0; });
      });
      const seq = [['drive', o.drive[0], o.drive[1]], ['drive', o.drive[1], o.drive[2]],
        ['search', o.search[0], o.search[1]], ['search', o.search[1], o.search[2]]];
      seq.forEach(([row, a, b], j) => {
        S.beat(0.15, (s) => { for (let q = 0; q < 4; q++) s['hl' + q].o = q === j ? 1 : 0; });
        morph(a, b, row, d); S.hold(gap);
      });
    }
    const resetKeyTiles = (s) => { for (let i = 0; i < 4; i++) { s['kt' + i].fill = '#FFFFFF'; s['kt' + i].sw = 2.5; s['kt' + i].stroke = CHAR; s['hl' + i].o = 0; } };
    // the whole key lit, as one letter is lit during the schedule
    const lightKey = (s) => { for (let i = 0; i < 4; i++) { s['kt' + i].fill = GOLD; s['kt' + i].sw = 2.5; s['kt' + i].stroke = CHAR; } };
    // The key lights up inside its frame, the frame condenses into the key's dot between the middle letters, and the dot
    // rises out of the key and flies to its state's place on the map.
    function keyDot(mk, p, arc, fly) {
      S.beat(0.45, (s) => { lightKey(s); s[mk].o = 1; });
      S.beat(0.55, (s) => Object.assign(s[mk], dotAt(KC.x, KC.y), { stroke: INK, sw: 3 }));
      S.beat(0.3, (s) => Object.assign(s[mk], { y: KTOP - 14, fo: 1 }));
      S.beat(fly, (s) => Object.assign(s[mk], { x: p.x - 14, y: p.y - 14 }), (id) => (id === mk ? { arc } : null));
    }

    // what the 256-keys slide clears away, and where the two keys sit on the mini map
    S.keyPart = { KEY1, KEY2, ui: ['keyLbl', 'keySub', 'kLegend', 'lblDriveT', 'lblDriveS', 'lblSearchT', 'lblSearchS', 'opsT', 'stageLbl', 'mrT']
      .concat([0, 1, 2, 3].flatMap((i) => ['kt' + i, 'kl' + i, 'kv' + i, 'op' + i, 'hl' + i, 'mrl' + i, 'mrs' + i]), START_DRIVE, START_SEARCH) };
    return () => {
      // ---- step 0
      S.step({ say: 'So where does a starting arrangement come from? From the key. A key is just a word, here B-A-A-D, and each letter converts to a number. Both decks start in order.' });
      S.beat(0.45, (s) => cap(s, 'A key is a word; each letter converts to a number',
        'The key here is BAAD. With 4 cards per deck the letters are A to D, worth 0 to 3, and every run starts from both decks in order.\nThe key never names a state directly: it shuffles its way to a starting arrangement, using the same two cuts.'));
      S.hold(0.6);

      // ---- step 1: first letter, slowly
      S.step({ say: 'Each letter drives four of the same cuts you just saw: two on the Drive Deck, two on the Search Deck, using this letter and the next one. Here is the first letter, B, worth one.' });
      S.beat(0.45, (s) => cap(s, 'Letter 1: B (worth 1), with the next letter A (worth 0)',
        'Each letter drives four cuts, two on each deck, using this letter and the next one.\nThese are the same Count Cut and Search Cut as the worked example, just driven by the key instead of the cards.'));
      letter(ks1.ops[0], false);

      // ---- step 2: the remaining letters, quickly
      S.step({ say: 'The other three letters do the same thing, quickly. The last letter wraps around and uses the first letter as its partner.' });
      S.beat(0.45, (s) => cap(s, 'Letters 2 to 4: the same four cuts each',
        'The last letter wraps around and pairs with the first. When the letters run out, the decks hold this key’s starting arrangement.'));
      for (let i = 1; i < 4; i++) letter(ks1.ops[i], true);
      S.beat(0.4, (s) => { resetKeyTiles(s); s.stageLbl.content = 'STARTING ARRANGEMENT'; });
      S.hold(0.4);

      // ---- step 3: one round, then onto the loop map
      S.step({ say: 'Then one round, exactly like the worked example, gives this key its first state. And that state sits on one of our four cycles: for BAAD, the big one. Everything about this key, including how long before its stream repeats, is decided right here, by which cycle it lands on.' });
      S.beat(0.45, (s) => cap(s, 'One round gives the key’s first state, which sits on one cycle',
        'BAAD lands on Cycle #1, the largest, with 381 states. Everything about this key, including how long its secret stream\nruns before repeating, is decided by which cycle its first state sits on.'));
      S.beat(0.4, (s) => { s.stageLbl.content = 'ONE ROUND →'; s.opsT.o = 0; for (let j = 0; j < 4; j++) { s['op' + j].o = 0; } });
      S.beat(1.1, (s) => {
        fr1.drive.forEach((id, i) => { s[id].x = sx(i); s[id].y = Y.drive; });
        fr1.search.forEach((id, i) => { s[id].x = sx(i); s[id].y = Y.search; });
      });
      S.beat(0.4, (s) => { s.stageLbl.content = 'FIRST STATE OF KEY BAAD'; });
      S.beat(0.9, (s) => { s.mrT.o = 1; MR.forEach((m, i) => { s['mr' + i].o = 1; s['mr' + i].draw = 1; s['mrl' + i].o = 1; s['mrs' + i].o = 1; }); });
      keyDot('mk1', p1, ARC1, 1.2);
      S.beat(0.4, (s) => { s.mk1L.o = 1; });
      S.hold(0.3);

      // ---- step 4: ABBA, the weak key
      S.step({ say: 'Now a different key: ABBA. Same procedure, start to finish. And ABBA lands on one of the tiny cycles: its stream repeats after only 11 rounds. Nothing about the letters warns you. That is the problem weak keys pose, and it is why a deployed version would need a way to check a key before using it.' });
      S.beat(0.45, (s) => {
        cap(s, `A different key, ABBA, lands on Cycle #${L.where[c2].ci + 1}: only 11 states`,
          'Same schedule, same round, different word. ABBA’s secret stream would repeat after just 11 rounds.\nNothing about the letters warns you: a weak key is weak because of where it lands, not how it looks.');
        for (let i = 0; i < 4; i++) { s['kl' + i].content = KEY2[i]; s['kv' + i].content = '= ' + (KEY2.charCodeAt(i) - 65); }
        resetKeyTiles(s);
        s.stageLbl.content = 'BACK TO THE START';
      });
      S.beat(0.8, (s) => { START_DRIVE.forEach((id, i) => { s[id].x = sx(i); s[id].y = Y.drive; }); START_SEARCH.forEach((id, i) => { s[id].x = sx(i); s[id].y = Y.search; }); });
      S.beat(0.2, (s) => { s.stageLbl.content = 'KEY SCHEDULE: ABBA'; s.opsT.o = 0; for (let j = 0; j < 4; j++) s['op' + j].o = 0; });
      // replay at a glance: one combined move per deck per letter
      ks2.ops.forEach((o) => {
        S.beat(0.15, (s) => { resetKeyTiles(s); s['kt' + o.i].fill = GOLD; });
        S.beat(0.6, (s) => {
          o.drive[2].forEach((id, i) => { s[id].x = sx(i); s[id].y = Y.drive; });
          o.search[2].forEach((id, i) => { s[id].x = sx(i); s[id].y = Y.search; });
        }, (id) => {
          const deck = id[0] === 'S' ? o.drive : o.search, a = deck[0].indexOf(id), b = deck[2].indexOf(id);
          return a < 0 || a === b ? null : { arc: b > a ? 38 : -38 };
        });
      });
      S.beat(0.3, (s) => { resetKeyTiles(s); s.stageLbl.content = 'ONE ROUND →'; });
      S.beat(1.0, (s) => {
        fr2.drive.forEach((id, i) => { s[id].x = sx(i); s[id].y = Y.drive; });
        fr2.search.forEach((id, i) => { s[id].x = sx(i); s[id].y = Y.search; });
      });
      S.beat(0.3, (s) => { s.stageLbl.content = 'FIRST STATE OF KEY ABBA'; });
      keyDot('mk2', p2, ARC2, 1.3);
      S.beat(0.4, (s) => { s.mk2L.o = 1; s.mr2.sw = 9; });
      S.hold(0.4);
    };
  }

  // ================================================================ land
  // Everything here starts hidden: the key slide's last frame is this slide's first.
  function buildLand(S) {
    const L = loopData(), geo = ringGeo(L.cyc), total = L.nxt.length, KP = S.keyPart;

    geo.forEach((g, i) => S.add('guide' + i, 'ring', {}, { x: g.cx, y: g.cy, r: g.r, stroke: LIGHT, sw: 2, o: 0 }));
    for (let code = 0; code < total; code++) {
      const w = L.where[code], p = geo[w.ci].at(w.k);
      S.add('d' + code, 'dot', {}, { x: p.x, y: p.y, r: w.ci < 2 ? 3.6 : 4.2, fill: LOOP_COL[w.ci], z: 2, o: 0 });
    }
    const counts = [0, 0, 0, 0];
    L.keys.forEach((k) => { counts[L.where[k.code].ci]++; });
    // BAAD and ABBA, followed on the key slide, are on the map from the start: gold, with their names
    const iB = L.keys.findIndex((k) => k.key === KP.KEY1), iA = L.keys.findIndex((k) => k.key === KP.KEY2), OURS = [iB, iA];
    const ciB = L.where[L.keys[iB].code].ci, ciA = L.where[L.keys[iA].code].ci;
    const pct = (x, of) => ((100 * x) / of).toFixed(1) + '%';
    const lens = L.cyc.map((c) => c.length);

    // labels: state share (static) and key tallies (count up)
    // each cycle numbered by size, largest first, over its number of states; key tallies and shares below
    const LBL = [{ x: 560, y: 360, a: 'middle' }, { x: 1180, y: 372, a: 'middle' }, { x: 1502, y: 292, a: 'start' }, { x: 1502, y: 474, a: 'start' }];
    LBL.forEach((p, i) => {
      const big = i === 0;
      S.add('st' + i, 'text', { size: big ? 34 : 27, weight: 700, anchor: p.a }, { x: p.x, y: p.y, content: `Cycle #${i + 1}`, fill: LOOP_COL[i], o: 0 });
      S.add('sn' + i, 'text', { size: big ? 26 : 21, anchor: p.a }, { x: p.x, y: p.y + (big ? 36 : 28), content: `${lens[i]} States`, fill: GREY, o: 0 });
      // the tallies start from the two keys already on the map
      S.add('kc' + i, 'text', { size: big ? 30 : 24, anchor: p.a, fmt: '{n} keys' }, { x: p.x, y: p.y + (big ? 80 : 60), num: [ciB, ciA].filter((c) => c === i).length, fill: INK, o: 0 });
      S.add('sp' + i, 'text', { size: big ? 24 : 20, anchor: p.a }, { x: p.x, y: p.y + (big ? 118 : 88),
        content: i === 0 ? `${pct(lens[i], total)} of states · ${pct(counts[i], 256)} of keys` : `${pct(lens[i], total)} of states\n${pct(counts[i], 256)} of keys`, fill: GREY, o: 0 });
    });

    // key bank: 16 x 16 grid of keys, then each flies to its first state
    const BX = 1610, BY = 150, BS = 17;
    S.add('bankT', 'text', { size: 25, weight: 700 }, { x: BX, y: 110, content: 'The other 254 keys', o: 0 });
    // Keys that share a state stack outward from it, each dot clear of the ring and of the dot below it. The spacing
    // allows for each dot at its largest: BAAD and ABBA, and the weak keys once they grow on the last click (Scott's
    // father, 2026-10-05: ABBA's bigger dot hid the key stacked on its state, and the grown weak keys ran together).
    const OUR = { r: 7, fill: GOLD, stroke: INK, sw: 2 }, WEAK_R = 6, nth = {}, outer = {};
    const reach = (i, ci) => (OURS.includes(i) ? OUR.r + 1 : ci >= 2 ? WEAK_R + 0.75 : 5.35);   // drawn radius at its largest
    L.keys.forEach((k, i) => {
      const w = L.where[k.code], rr = reach(i, w.ci), n = (nth[k.code] = (nth[k.code] || 0) + 1) - 1;
      const from = outer[k.code] == null ? (w.ci < 2 ? 3.6 : 4.2) + 2.4 : outer[k.code] - 0.7;   // past the ring's dot, or the dot below
      k.ci = w.ci; k.dest = geo[w.ci].at(w.k, from + rr);
      outer[k.code] = from + 2 * rr;
      S.add('k' + i, 'dot', {}, OURS.includes(i) ? Object.assign({ x: k.dest.x, y: k.dest.y, o: 0, z: 30 }, OUR)
        : { x: BX + (i % 16) * BS, y: BY + Math.floor(i / 16) * BS, r: 5.5, fill: INK, stroke: '#FFFFFF', sw: 1.5, o: 0, z: 10 + n });
    });
    // where the key slide's names go: beyond the stack on the big cycle, above the ring on a small one
    const nameAt = (i) => {
      const k = L.keys[i], w = L.where[k.code], g = geo[w.ci];
      if (w.ci >= 2) return { x: g.cx - 34, y: g.cy - g.r - 64 };
      const p = g.at(w.k, outer[k.code] + 25);
      return { x: p.x, y: p.y + 9 };
    };
    const ourAt = (i) => ({ x: L.keys[i].dest.x - 7, y: L.keys[i].dest.y - 7, w: 14, h: 14, rx: 7, sw: 2 });

    // right panel text for the later steps
    S.add('rp1', 'text', { size: 27, weight: 700 }, { x: 1100, y: 640, content: 'At 8 cards per deck', o: 0 });
    S.add('rp2', 'text', { size: 25, lh: 1.35 }, { x: 1100, y: 680, content: 'the largest cycle holds 78.40% of the states\nand catches 78.40% of the keys.', o: 0 });
    S.add('weakLbl', 'text', { size: 27, weight: 700 }, { x: 1100, y: 640, content: `${counts[2] + counts[3]} weak keys (${pct(counts[2] + counts[3], 256)})`, fill: GOLD_D, o: 0 });
    S.add('weakSub', 'text', { size: 24, lh: 1.35 }, { x: 1100, y: 680, content: 'on cycles under 4! = 24:\nthey repeat every 11 rounds', fill: INK, o: 0 });
    S.add('rw1', 'text', { size: 27, weight: 700 }, { x: 1520, y: 640, content: 'At 8 cards per deck', o: 0 });

<script>
/* content.js: every slide of the defense, written once, rendered twice.
 *
 *   deck/build_deck.js           -> PowerPoint (pptxgenjs)
 *   presentation/present.js      -> the all-in-one HTML presentation
 *
 * buildSlides(api) needs api.pres (addSection, addSlide, shapes, charts), api.C
 * (scheme colour names), api.RAMP (the validated cycle-share ramp), api.images
 * (each picture in deck/assets, in the form that renderer's addImage takes) and
 * api.animation(name, budget, helpers), which each renderer implements its own way.
 * Slide objects need addText, addShape, addTable, addChart, addImage and addNotes.
 * (The body below is deliberately not indented inside buildSlides: the speaker
 * notes are multi-line template literals.)
 */
(function (root) {
'use strict';
function buildSlides(api) {
const { pres, C, RAMP } = api;
const IMG = api.images || {};

// ------------------------------------------------------------------ timing + slide helpers
let clock = 0, section = '';
const mmss = (s) => { const t = Math.round(s); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
function slide(master, title, secs, notes) {
  const s = pres.addSlide({ masterName: master, sectionTitle: section });
  if (title) s.addText(title, { placeholder: 'title' });
  clock += secs;
  const cue = secs ? `[${mmss(secs)} on this slide · end at ${mmss(clock)}]` : '[backup: only if asked]';
  s.addNotes(`${cue}\n\n${notes.trim()}`);
  return s;
}
function newSection(title) { section = title; pres.addSection({ title }); }
const shadow = () => ({ type: 'outer', color: '000000', opacity: 0.14, blur: 5, offset: 2, angle: 90 });
const SUITS = { S: '♠', H: '♥', D: '♦', C: '♣' };
const suitColor = (k) => (k === 'H' || k === 'D' ? C.accent1 : C.text1);

// A playing-card panel: rounded white card with a rank/suit index in the top-left corner.
// Without a rank or suit it is a plain panel (for things that aren't cards, like a cipher's
// name); a dashed outline marks work not yet done.
function card(s, { x, y, w, h, rank, suit, fill, line, dash, name, shadowOn = true }) {
  const onDark = fill === C.accent1;
  s.addShape(pres.shapes.ROUNDED_RECTANGLE, { x, y, w, h, rectRadius: 0.1, fill: { color: fill || C.background1 },
    line: { color: line || 'CFCFCF', width: dash ? 1.5 : 1, dashType: dash ? 'dash' : undefined }, shadow: shadowOn ? shadow() : undefined, objectName: name || 'card' });
  if (rank || suit) {

Three ancestors matter.

Solitaire, by Bruce Schneier, from the novel Cryptonomicon. A 54-card deck whose order is the key. Paul Crowley ran ten million outputs and found that consecutive outputs repeat about one time in 22 and a half, instead of one in 26: a bias, found by sampling. Its steps also can't all be undone, which turns out to matter.

Mirdek, Crowley's own fix for Solitaire. It gave us the two card moves this cipher uses, the Count Cut and the Search Cut. Here is why it was pulled. To encrypt a letter, Mirdek does a Count Cut, then searches the deck for the plaintext letter itself, and the ciphertext letter comes from where that card turns up. So the message chooses every search, and every search reshuffles the deck: the state follows the message, and there is no keystream apart from it. Crowley thought that feedback would make the cipher harder to analyze. In January 2000 he withdrew it himself, writing that it is "not secure" and "terrifically weak against a chosen plaintext attack." He never published the attack, so I can only point at the lever: an attacker who picks the plaintext picks which card each search finds, and each ciphertext letter then reports where that card sat. That's the lesson this cipher takes: its state evolves from the key alone, never from the message.

RC4, the software cipher that secured much of the web for twenty years. Its state is basically a shuffled deck of 256 values, about 2 to the 1700 possible states. Nobody has ever determined its period. It was banned from web encryption in 2015: small biases in its output, found one after another from 2001 on, became a practical attack on encrypted web traffic in 2013.

  const s = slide('CONTENT', 'Daniels’ Cipher: Overview', 60, `
Dr. Daniels' cipher uses two decks and a Discard Pile. The Drive Deck supplies the numbers: each turn it gives up its bottom card and its top card. The Search Deck gets shuffled, and its top card gives the next value of the keystream; in the next round it becomes the Drive Deck. Spent drive cards go to the bottom of the Discard Pile, so the first one spent stays on top, and in the next round the Discard Pile becomes the Search Deck.

There are only two moves. A Count Cut just cuts the Search Deck: the bottom card of the Drive Deck gives a value c, and the top c cards move to the bottom. A Search Cut takes its target value from the top card of the Drive Deck, deals cards off the top of the Search Deck onto two piles, alternating, until a card of that value shows up, then rebuilds the deck in a fixed order. That's where the real mixing happens.

One Count Cut plus one Search Cut is a turn, and it adds one value to the keystream. A round is n over two turns, n being the deck size: when the Drive Deck runs out, the Discard Pile gets cut by a fixed amount, the rotation setting, and then the decks move up. Dr. Daniels' code calls these a round and a full round; I say turn and round so that the unit everything is counted in gets the plain name.

And one design choice makes this whole project possible: the stream depends only on the key, never on the message. That's the lesson from Mirdek. It means the cipher is a fixed machine, and a fixed machine can be traced completely. Rather than read pseudocode, let's watch it run.`);

If asked how 1.6 billion states fit on a laptop:

The problem: the usual way stores, for every state, where it goes next. At eight cards that map is about 28 gigabytes, and my laptop had about 1.8 usable.

The idea: store no map at all. Keep one checkbox per state, a single bit: have I visited this one yet? And when I need to know where a state goes next, I just run the shuffle again instead of looking it up.

The result: under 400 megabytes, about seventy times less memory, and all 1.6 billion states sorted in roughly fifteen minutes per rotation setting. Every state is still visited exactly once, so the trade costs a little time and saves a lot of memory. That trade is what made eight cards possible on an ordinary laptop.

      catLines[ci].forEach((ln, li) => sv(doc, 'text', { x: labelW - 16, y: cy + cp * 0.35 + (li - (catLines[ci].length - 1) / 2) * cp * 1.15,
        'text-anchor': 'end', 'font-family': fam, 'font-size': cp, fill: color(o.catAxisLabelColor) || COLORS.tx1 }, svg, ln));
      const g = sv(doc, 'g', {}, svg);
      if (stacked) {
        const vals = data.map((s) => s.values[ci]), sum = vals.reduce((a, b) => a + b, 0);
        const clipId = `clip${Math.random().toString(36).slice(2)}`;
        const cp2 = sv(doc, 'clipPath', { id: clipId }, svg);
        sv(doc, 'rect', { x: plotX, y: y0, width: plotW, height: thick, rx: 4 }, cp2);
        g.setAttribute('clip-path', `url(#${clipId})`);
        let x = plotX;
        vals.forEach((v, k) => {
          const w = (plotW * v) / sum;
          const r = sv(doc, 'rect', { x: x + (k ? 1 : 0), y: y0, width: Math.max(0, w - (k ? 1 : 0) - (k < vals.length - 1 ? 1 : 0)), height: thick, fill: colors[k % colors.length] }, g);
          sv(doc, 'title', {}, r, `${c} · ${data[k].name}: ${(v * 100).toFixed(2)}%`);
          const lab = fmtValue(v, code);
          if (lab) {
            const ink = data[k].name === 'All other cycles' ? COLORS.tx1 : (color(o.dataLabelColor) || '#FFFFFF');
            sv(doc, 'text', { x: x + w / 2, y: cy + dp * 0.35, 'text-anchor': 'middle', 'font-family': fam, 'font-size': dp, 'font-weight': o.dataLabelFontBold ? 700 : 400, fill: ink, 'pointer-events': 'none' }, svg, lab);
          }
          x += w;
        });
      } else {
        const v = data[0].values[ci], max = o.valAxisMaxVal || Math.max(...data[0].values);
        const w = (plotW * v) / max;
        const r = sv(doc, 'rect', { x: plotX, y: y0, width: w, height: thick, rx: 4, fill: colors[ci % colors.length] }, g);
        sv(doc, 'title', {}, r, `${c}: ${fmtValue(v, code)}`);
        sv(doc, 'text', { x: plotX + w + 10, y: cy + dp * 0.35, 'font-family': fam, 'font-size': dp, 'font-weight': o.dataLabelFontBold ? 700 : 400, fill: color(o.dataLabelColor) || COLORS.tx1 }, svg, fmtValue(v, code));
      }
    });
    host.appendChild(svg);
  }

  // ---------------------------------------------------------------- layouts
  const LAYOUT = {
    TITLE: { bg: COLORS.accent1, title: { x: 0.6, y: 1.55, w: 7.4, h: 1.9, size: 44, color: '#FFFFFF', valign: 'bottom' },
      subtitle: { x: 0.6, y: 3.6, w: 7.4, h: 0.9, size: 24, color: '#FFFFFF', valign: 'top', body: true } },
    // the title and tag sit 0.4 in higher since each divider gained a line on what its part is about (2026-10-05)
    SECTION: { bg: COLORS.accent1, title: { x: 4.2, y: 2.35, w: 8.4, h: 1.3, size: 42, color: '#FFFFFF', valign: 'middle' },
      tag: { x: 4.2, y: 3.7, w: 8.4, h: 0.6, size: 22, color: COLORS.accent2, valign: 'top', body: true, bold: true } },
    CONTENT: { bg: '#FFFFFF', title: { x: 0.5, y: 0.3, w: 12.333, h: 0.7, size: 34, color: COLORS.tx2, valign: 'middle' }, number: true },
    ANIMATION: { bg: '#FFFFFF', title: { x: 0.5, y: 0.3, w: 12.333, h: 0.7, size: 34, color: COLORS.tx2, valign: 'middle' } },
    CLOSING: { bg: COLORS.accent1, title: { x: 0.8, y: 1.2, w: 9.2, h: 2.2, size: 60, color: '#FFFFFF', valign: 'bottom' } },   // a short title, set large
  };

  // Draw one recorded slide into host (a 1920 x 1080 box). Returns the animation
  // stage's <svg> for animation slides, so the caller can attach a player to it.
  function renderSlide(spec, host, opts) {
    const doc = host.ownerDocument, L = LAYOUT[spec.master] || LAYOUT.CONTENT;
    host.style.background = L.bg;
    const ph = (key) => {
      const p = L[key];
      if (!p || !spec[key]) return;
      let text = spec[key], size = p.size;
      // A long divider title ("Daniels’ Cipher: Cycle Structure") breaks after its colon, a little smaller, so its
      // two lines fit the box; one without a colon ("Summary of Creative Component") is just set a little smaller. The
      // slide keeps its one-line title everywhere else (section bar, slide list).
      if (spec.master === 'SECTION' && key === 'title' && typeof text === 'string' && text.length > 26) {
        const at = text.indexOf(': ');
        if (at > 0) text = [{ text: text.slice(0, at + 1), options: { breakLine: true } }, { text: text.slice(at + 2), options: {} }];
        size = 38;
      }
      renderText(doc, host, { text, opts: { x: p.x, y: p.y, w: p.w, h: p.h, margin: 0, valign: p.valign, align: 'left',
        fontFace: p.body ? 'Calibri' : 'Cambria', fontSize: size, bold: p.body ? !!p.bold : true, color: p.color, balance: spec.master === 'SECTION' } });
    };
    ['title', 'subtitle', 'tag'].forEach(ph);
    spec.items.forEach((it) => {
      if (it.k === 'text') renderText(doc, host, it);
      else if (it.k === 'shape') renderShape(doc, host, it);
      else if (it.k === 'table') renderTable(doc, host, it);
      else if (it.k === 'chart') renderChart(doc, host, it);
      else if (it.k === 'image') renderImage(doc, host, it);
    });
    if (L.number && opts && opts.number) {
      renderText(doc, host, { text: String(opts.number), opts: { x: 12.23, y: 7.02, w: 0.6, h: 0.3, margin: 0, align: 'right', fontSize: 12, color: COLORS.accent6 } });
    }
    if (spec.anim) {
      const s = doc.createElementNS(SVGNS, 'svg');
      s.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      s.style.cssText = 'position:absolute;left:0;top:153px;width:1920px;height:920px;display:block;';
      host.appendChild(s);
      return s;
    }
    return null;
  }

  root.DeckRender = { C, COLORS, FONTS, makePres, renderSlide, PX };
})(this);

</script>
<script>
/* present.js: runs the all-in-one presentation.
 *
 * Slides come from deck/content.js (drawn by render.js); the five animations come
 * from animation/scenes.js and play in place, one step per click, so the whole
 * talk is a single sequence of clicks with nothing to switch to.
 */
(function () {
  'use strict';
  const R = window.DeckRender;
  const params = new URLSearchParams(location.search);

  // ---------------------------------------------------------------- the deck
  const scenes = {};
  function scene(name) {
    if (!scenes[name]) {
      const def = Scenes.list.find((s) => s.name === name);
      scenes[name] = { def, sc: def.build() };
    }
    return scenes[name];
  }
  const pres = R.makePres();
  DeckContent.buildSlides({
    pres, C: R.C, RAMP: ['7A0A1C', 'C8102E', 'E5596B', 'EE97A1'], images: window.DeckAssets || {},
    animation(name, budget, h) {
      const { def, sc } = scene(name);
      const lines = sc.steps.map((st, i) => `${i + 1}. ${st.meta.say || ''}`).join('\n\n');
      const s = h.slide('ANIMATION', def.title, budget, `${sc.steps.length} clicks. Each click plays the next step; after the last step, the next click moves on.\n\n${lines}`);
      s.anim = name;
    },
  });
  const slides = pres.slides;
  // Split each slide's notes into its timing cue and its script.
  const toSec = (t) => { const [m, s] = t.split(':').map(Number); return m * 60 + s; };
  slides.forEach((s) => {
    const m = s.notes.match(/^\[(\d+:\d+) on this slide · end at (\d+:\d+)\]\s*/);
    s.budget = m ? toSec(m[1]) : 0;
    s.endAt = m ? toSec(m[2]) : null;
    s.script = s.notes.replace(/^\[[^\]]*\]\s*/, '');
    s.backup = s.section === 'Backup';
  });
  const lastMain = slides.reduce((a, s, i) => (s.backup ? a : i), 0);
  const mmss = (t) => { t = Math.max(0, Math.round(t)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
  const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

  // The parts of the talk, numbered as on the roadmap slide: section 'Keys (Ch 5)' is
  // part 4, named after its divider slide, "Keys, fair and weak".
  const parts = [];
  slides.forEach((s, i) => {
    const last = parts[parts.length - 1];
    if (last && last.name === s.section) { last.slides.push(i); return; }
    const m = s.section.match(/^(.*?)\s*\(Ch ([^)]*)\)$/);
    parts.push({ name: s.section, short: m ? m[1] : s.section, slides: [i],
      chapters: m ? (m[2].includes('-') ? 'Chapters ' : 'Chapter ') + m[2].replace('-', '–') : '' });
  });
  let partNo = 0;
  for (const p of parts) {
    const d = p.slides.find((i) => slides[i].master === 'SECTION');
    p.long = d == null ? p.short : slides[d].title;
    p.num = p.chapters ? ++partNo : 0;
  }
  const partOf = (i) => parts.findIndex((p) => p.slides.includes(i));
  // A slide's title as listed under its part, without the part's name ("Backup: beyond 8 cards").
  function titleIn(p, i) {
    const t = slides[i].title || '(untitled)', pre = p.name + ': ';
    return t.startsWith(pre) ? t.charAt(pre.length).toUpperCase() + t.slice(pre.length + 1) : t;
  }

  if (params.has('script')) { printableScript(); return; }

  // ---------------------------------------------------------------- stage
  const frame = document.getElementById('frame');
  const BAR_H = 52;   // the section bar's height (.dcbar in present.html)
  const nav = document.getElementById('nav');
  function fit() {
    const top = document.body.classList.contains('bar-docked') ? BAR_H : 0;   // a docked bar keeps the slide below it
    const k = Math.min(innerWidth / 1920, (innerHeight - top) / 1080);
    frame.style.top = `${top + (innerHeight - top) / 2}px`;
    frame.style.transform = `translate(-50%, -50%) scale(${k})`;
    // Previous/Next sit in the slide's own bottom-right corner, just above the progress strips (slide y 1063),
    // and shrink a little with the slide on small screens.
    const left = (innerWidth - 1920 * k) / 2, ftop = top + (innerHeight - top - 1080 * k) / 2;
    nav.style.right = `${Math.max(6, innerWidth - (left + 1904 * k))}px`;
    nav.style.bottom = `${Math.max(6, innerHeight - (ftop + 1057 * k))}px`;
    nav.style.fontSize = `${Math.max(11, Math.min(16, 16 * k / 0.95))}px`;
  }
  addEventListener('resize', fit); fit();

  let idx = 0, step = 0, player = null, stepsStrip = null, playing = false, raf = 0, t0 = 0;
  let timerStart = null, timerAcc = 0;

  function stepsOf(i) { return slides[i].anim ? scene(slides[i].anim).sc.steps.length : 1; }

  // Progress strips (laid out in present.html): along the bottom of every slide, one segment per
  // slide of the current part; on an animation slide, one per step just above it. Filled segments
  // are done, the playing step fills as it plays, and empty ones are still to come.
  function makeStrip(host, n, kind) {
    const doc = host.ownerDocument, el = doc.createElement('div');
    el.className = 'strip ' + kind;
    el.setAttribute('aria-hidden', 'true');
    for (let k = 0; k < n; k++) el.appendChild(doc.createElement('i')).appendChild(doc.createElement('b'));
    host.appendChild(el);
    return el;
  }
  function paintStrip(el, s, frac) {
    if (el) el.querySelectorAll('b').forEach((b, k) => { b.style.width = k < s ? '100%' : k === s ? `${frac * 100}%` : '0'; });
  }
  const RED = new Set(['TITLE', 'SECTION', 'CLOSING']);   // the layouts with a cardinal background
  function partStrip(host, i) {
    const p = parts[partOf(i)];
    const el = makeStrip(host, p.slides.length, RED.has(slides[i].master) ? 'part dark' : 'part');
    el.querySelectorAll('i').forEach((seg, k) => seg.classList.toggle('anim', !!slides[p.slides[k]].anim));   // animation slides stand out
    paintStrip(el, p.slides.indexOf(i), 1);
  }

  // Moving between slides of the same part cross-fades: the old slide is copied as it stands and faded out over the
  // new one, whose animation has already begun. Next or Previous into another part gets the section transition instead,
  // a cue to the room that a new part begins (Scott, 2026-10-05): a cardinal band with gold edges and the four suits
  // sweeps across, and the slide changes behind it. A jump into another part (bar, slide number) cuts straight there.
  const FADE_MS = 400, SWEEP_MS = 1900, calm = matchMedia('(prefers-reduced-motion: reduce)');
  function sectionSweep(ghost, dir) {
    const band = document.createElement('div');
    band.className = 'sweep';
    band.setAttribute('aria-hidden', 'true');
    band.innerHTML = '<i></i><b><span>♠ ♥ ♣ ♦</span></b><i></i>';
    frame.parentNode.appendChild(band);
    const at = (k) => `translateX(${k * 135}%) skewX(-14deg)`;
    band.animate([{ transform: at(-dir), offset: 0, easing: 'cubic-bezier(.25, .7, .35, 1)' }, { transform: at(0), offset: 0.42 },
      { transform: at(0), offset: 0.58, easing: 'cubic-bezier(.65, 0, .75, .3)' }, { transform: at(dir), offset: 1 }], { duration: SWEEP_MS }).onfinish = () => band.remove();
    setTimeout(() => ghost.remove(), SWEEP_MS / 2);   // while the band covers the screen
  }
  function show(i, mode) {
    cancelAnimationFrame(raf); playing = false;
    const from = idx;
    idx = Math.max(0, Math.min(slides.length - 1, i));
    document.querySelectorAll('.ghost, .sweep').forEach((g) => g.remove());
    const moving = frame.firstChild && from !== idx && !calm.matches;
    const fade = moving && partOf(from) === partOf(idx), sweep = moving && !fade && Math.abs(idx - from) === 1;
    const ghost = fade || sweep ? frame.cloneNode(true) : null;
    const spec = slides[idx];
    getSelection().removeAllRanges();   // a leftover selection would land at the new slide's first word
    frame.innerHTML = '';
    const svg = R.renderSlide(spec, frame, {});   // no slide number on the stage: the bar shows it, and Next/Previous sit in that corner
    partStrip(frame, idx);
    player = null; stepsStrip = null; step = 0;
    if (spec.anim) {
      player = new Anim.Player(svg, scene(spec.anim).sc);
      stepsStrip = makeStrip(frame, stepsOf(idx), 'steps');
      if (mode === 'end') { step = stepsOf(idx) - 1; player.renderEnd(step); paintStrip(stepsStrip, step, 1); }
      else play(typeof mode === 'number' ? Math.max(0, Math.min(stepsOf(idx) - 1, mode)) : 0);   // a number plays that step
    }
    if (ghost) {
      ghost.removeAttribute('id'); ghost.className = 'ghost'; ghost.setAttribute('aria-hidden', 'true');
      frame.after(ghost);
      if (fade) ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: FADE_MS, easing: 'ease-in-out' }).onfinish = () => ghost.remove();
      else sectionSweep(ghost, idx > from ? 1 : -1);
    }
    try { history.replaceState(null, '', '#' + (idx + 1)); } catch (e) { /* file:// may refuse */ }
    sync();
  }
  function play(k) {
    const sc = scene(slides[idx].anim).sc;
    step = k; playing = true; t0 = performance.now();
    const dur = sc.duration(k);
    paintStrip(stepsStrip, k, 0);
    const tick = (now) => {
      const t = (now - t0) / 1000;
      if (t >= dur) { player.renderEnd(step); paintStrip(stepsStrip, step, 1); playing = false; return; }
      player.render(step, t); paintStrip(stepsStrip, step, t / dur); raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  function finish() { cancelAnimationFrame(raf); playing = false; if (player) player.renderEnd(step); paintStrip(stepsStrip, step, 1); }
  function startTimer() { if (timerStart === null) timerStart = performance.now(); }
  function elapsed() { return timerAcc + (timerStart === null ? 0 : (performance.now() - timerStart) / 1000); }

  function next() {
    startTimer();
    if (slides[idx].anim) {
      if (playing) { finish(); sync(); return; }
      if (step < stepsOf(idx) - 1) { play(step + 1); sync(); return; }
    }
    if (idx < slides.length - 1) show(idx + 1, 'start');
  }
  function prev() {
    startTimer();
    if (slides[idx].anim) {
      if (playing) finish();
      if (step > 0) { step--; player.renderEnd(step); paintStrip(stepsStrip, step, 1); sync(); return; }
    }
    if (idx > 0) show(idx - 1, 'end');
  }
  function restart() { if (slides[idx].anim) { finish(); play(0); sync(); } }

  // ---------------------------------------------------------------- overlays
  const body = document.body;
  const $ = (id) => document.getElementById(id);
  function blank(kind) { body.classList.remove('blank-black', 'blank-white'); body.classList.add('blank-' + kind); }
  function unblank() { body.classList.remove('blank-black', 'blank-white'); }
  const isBlank = () => body.classList.contains('blank-black') || body.classList.contains('blank-white');

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    else document.exitFullscreen().catch(() => {});
  }
  function openOverlay(html) { $('overlay').innerHTML = html; body.classList.add('overlay'); }
  function closeOverlay() { body.classList.remove('overlay'); $('overlay').innerHTML = ''; }
  const overlayOpen = () => body.classList.contains('overlay');

  function toggleHelp() {
    if (overlayOpen()) { closeOverlay(); return; }
    const row = (k, d) => `<tr><td class="k">${k}</td><td>${d}</td></tr>`;
    openOverlay(`<div class="panel"><h2>Controls</h2><table>
      ${row('Next (bottom right) &middot; click &middot; &rarr; &middot; Page Down &middot; Space &middot; N', 'Next step or slide')}
      ${row('Previous (bottom right) &middot; right-click &middot; &larr; &middot; Page Up &middot; P', 'Back')}
      ${row('Section bar', 'Click a part to go to its first slide; point at it to pick any of its slides. Point at an animation (&rsaquo;) to pick any of its steps')}
      ${row('M', 'Hide the section bar, or bring it back. While hidden, it drops down when the mouse nears the top')}
      ${row('F &middot; F5', 'Full screen on/off (Esc also leaves)')}
      ${row('S', 'Speaker view in a second window: notes, timer, next slide')}
      ${row('number, then Enter', 'Go to that slide (backup slides start at ' + (lastMain + 2) + ')')}
      ${row('O', 'Slide list')}
      ${row('B &middot; W', 'Black or white screen; any key returns')}
      ${row('R', 'Replay the current animation from the start')}
      ${row('T', 'Notes along the bottom of this screen (rehearsal only)')}
      ${row('Home &middot; End', 'First slide &middot; closing slide')}
      ${row('H &middot; ?', 'This help')}
      </table><p><a href="?script" target="_blank" rel="noopener">Open the printable script</a> &middot; Esc to close</p></div>`);
  }
  function toggleList() {
    if (overlayOpen()) { closeOverlay(); return; }
    let html = '<div class="panel list"><h2>Slides</h2>';
    for (const p of parts) {
      html += `<h3>${p.num ? p.num + ' &middot; ' : ''}${esc(p.long)}${p.chapters ? ` <em>${p.chapters}</em>` : ''}</h3><ol start="${p.slides[0] + 1}">`;
      html += p.slides.map((i) => `<li><a href="#" data-go="${i}">${esc(titleIn(p, i))}${slides[i].anim ? ' <em>(animation)</em>' : ''}</a></li>`).join('') + '</ol>';
    }
    openOverlay(html + '<p>Esc to close</p></div>');
    $('overlay').querySelectorAll('[data-go]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); closeOverlay(); jump(+a.dataset.go); }));
  }
  function toggleNotes() { body.classList.toggle('notes'); sync(); }

  let typed = '', typedTimer = 0;
  function showTyped() {
    $('jump').textContent = typed ? `Go to slide ${typed}` : '';
    clearTimeout(typedTimer);
    if (typed) typedTimer = setTimeout(() => { typed = ''; $('jump').textContent = ''; }, 4000);
  }

  // ---------------------------------------------------------------- section bar
  // The parts of the talk as tabs along the top. A tab goes to the first slide of its part;
  // pointing at one lists that part's slides. The bar stays up, with the slide fitted below it,
  // in a window and in full screen alike. M hides it (it then drops down when the mouse nears
  // the top edge). The speaker view carries the same tabs, out of the audience's sight.
  let bars = [], peekTimer = 0, peekHold = false;
  function jump(i, k) { show(i, k == null ? 'start' : k); }   // k: an animation step to play
  // Each animation step's label for the bar: its caption heading, plus the scene's status line where it
  // has one (the worked example's round and turn), since several steps share a heading.
  const stepLabelCache = {};
  function stepLabels(i) {
    const name = slides[i].anim;
    if (stepLabelCache[name]) return stepLabelCache[name];
    const sc = scene(name).sc;
    const txt = (snap, id) => (snap[id] && snap[id].content ? String(snap[id].content).replace(/\*\*/g, '') : '');
    return (stepLabelCache[name] = sc.steps.map((st, k) => {
      const snap = sc.stepEnd(k), s1 = txt(snap, 'stat1'), turn = txt(snap, 'stat2').match(/^turn (\d+) of \d+$/);
      return { head: txt(snap, 'capHead') || `Step ${k + 1}`, hint: s1 ? s1.charAt(0) + s1.slice(1).toLowerCase() + (turn ? ` · turn ${turn[1]}` : '') : '' };
    }));
  }
  // Button faces: a label on wide screens, an icon on narrow ones.
  const ICONS = {
    speaker: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 8h6M7 11h10"/>',
    full: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
    unfull: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',
    hide: '<path d="M6 15l6-6 6 6"/>',
    pin: '<path d="M6 9l6 6 6-6"/>',
  };
  const face = (icon, label) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[icon]}</svg><span class="bl">${label}</span>`;
  function buildBar(doc, main) {
    const bar = doc.createElement('nav');
    bar.className = 'dcbar';
    bar.setAttribute('aria-label', 'Parts of the talk');
    const item = (p, i) => {
      const entry = `<button data-go="${i}"><span>${i + 1}</span>${esc(titleIn(p, i))}${slides[i].anim ? '<em>animation</em><i class="more" aria-hidden="true">&rsaquo;</i>' : ''}</button>`;
      if (!slides[i].anim) return entry;
      const steps = stepLabels(i);
      return `<div class="it">${entry}<div class="sub"><div class="mh">${steps.length} steps &middot; click one to play it</div>` +
        steps.map((l, k) => `<button data-go="${i}" data-step="${k}"><span>${k + 1}</span>${esc(l.head)}${l.hint ? `<em>${esc(l.hint)}</em>` : ''}</button>`).join('') + '</div></div>';
    };
    const head = (p) => `${p.chapters || (p.name === 'Backup' ? 'Only if asked' : p.name)} &middot; slides ${p.slides[0] + 1}&ndash;${p.slides[p.slides.length - 1] + 1}`;
    const tab = (p) => `<div class="tab"><button class="tb" data-go="${p.slides[0]}" title="${esc(p.long)}">${p.num ? `<b>${p.num}</b>` : ''}` +
      `<span class="lg">${esc(p.long)}</span><span class="sh${p.num ? ' n' : ''}">${esc(p.short)}</span><i></i></button>` +
      `<div class="menu"><div class="mh">${head(p)}</div>${p.slides.map((i) => item(p, i)).join('')}</div></div>`;
    bar.innerHTML = `<div class="tabs">${parts.map(tab).join('')}</div>` +
      (main ? '<button data-act="list" class="cnt" title="All slides (O)"></button>' +
        `<button data-act="speaker" title="Speaker view: notes, timer and next slide in a second window (S)">${face('speaker', 'Speaker view')}</button>` +
        '<button data-act="full" class="fs" title="Full screen on or off (F)"></button><button data-act="help" title="Help (H)">?</button>' +
        '<button data-act="pin" class="pin" title="Keep this bar up, or hide it (M)"></button>' : '');
    const act = { prev, next, list: toggleList, speaker: openSpeaker, full: toggleFullscreen, help: toggleHelp, pin: toggleBar };
    bar.addEventListener('mousedown', (e) => e.preventDefault());   // nothing here takes focus, so the keys keep driving the talk
    bar.addEventListener('contextmenu', (e) => e.preventDefault());
    bar.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.go == null) { act[b.dataset.act](); return; }
      b.closest('.tab').classList.add('shut');   // the list folds away until the mouse leaves the tab
      jump(+b.dataset.go, b.dataset.step == null ? null : +b.dataset.step);
      if (main && body.classList.contains('bar-peek')) { body.classList.remove('bar-peek'); peekHold = true; }
    });
    bar.querySelectorAll('.tab').forEach((t) => t.addEventListener('mouseleave', () => t.classList.remove('shut')));
    // A flyout opens level with its entry, to the right, or to the left if the window is too narrow. Near the bottom of
    // the window it moves up just enough to fit, so it still spans its entry and the mouse can cross straight into it.
    // It scrolls to the current step.
    bar.querySelectorAll('.it').forEach((it) => it.addEventListener('mouseenter', () => {
      const sub = it.querySelector('.sub'), cur = sub.querySelector('.cur'), win = doc.defaultView;
      sub.classList.remove('flip');
      sub.style.top = '';
      const r = sub.getBoundingClientRect();
      if (r.right > win.innerWidth - 4) sub.classList.add('flip');
      const lift = Math.min(r.bottom - (win.innerHeight - 6), r.top - 6);
      if (lift > 0) sub.style.top = `${-lift}px`;
      if (cur && (cur.offsetTop < sub.scrollTop || cur.offsetTop + cur.offsetHeight > sub.scrollTop + sub.clientHeight)) sub.scrollTop = cur.offsetTop - sub.clientHeight / 2;
    }));
    bars.push(bar);
    return bar;
  }
  function updateBars() {
    const p = partOf(idx);
    bars = bars.filter((b) => { const w = b.ownerDocument.defaultView; return w && !w.closed; });
    for (const b of bars) {
      b.querySelectorAll('.tab').forEach((t, k) => {
        t.classList.toggle('cur', k === p);
        t.querySelector('i').style.width = k === p ? `${(100 * (parts[k].slides.indexOf(idx) + 1)) / parts[k].slides.length}%` : '0';
      });
      b.querySelectorAll('.menu button[data-go]').forEach((m) => m.classList.toggle('cur', +m.dataset.go === idx && (m.dataset.step == null || +m.dataset.step === step)));
      const c = b.querySelector('.cnt');
      if (c) c.textContent = `${idx + 1} / ${slides.length}`;
    }
  }
  const mainBar = buildBar(document, true);
  mainBar.id = 'bar';
  body.prepend(mainBar);
  function toggleBar() { body.classList.toggle('bar-docked'); body.classList.remove('bar-peek'); peekHold = true; fit(); barLabels(); }
  function barLabels() {
    mainBar.querySelector('.pin').innerHTML = body.classList.contains('bar-docked') ? face('hide', 'Hide bar') : face('pin', 'Pin bar');
    mainBar.querySelector('.fs').innerHTML = document.fullscreenElement ? face('unfull', 'Exit full screen') : face('full', 'Full screen');
  }
  // Switching between a window and full screen (F, or the browser's own F11) always brings the
  // bar back, so a bar hidden with M can't stay hidden by accident. Not every browser reports F11,
  // so the geometry decides too: the window fills the screen and nothing sits above the page.
  // Window and screen sizes don't change with page zoom.
  function isFull() {
    if (document.fullscreenElement || matchMedia('(display-mode: fullscreen)').matches) return true;
    const zoom = outerWidth / innerWidth;   // the page spans the window's full width
    return outerWidth >= screen.width - 2 && outerHeight >= screen.height - 2 && Math.abs(outerHeight - innerHeight * zoom) < 10;
  }
  let wasFull = null;
  function barMode() {
    const full = isFull();
    if (full !== wasFull) { wasFull = full; body.classList.add('bar-docked'); body.classList.remove('bar-peek'); fit(); }
    barLabels();
  }
  addEventListener('resize', () => { barMode(); setTimeout(barMode, 300); });   // and again once the switch has settled
  document.addEventListener('fullscreenchange', barMode);
  matchMedia('(display-mode: fullscreen)').addEventListener('change', barMode);
  barMode();
  // Hidden, the bar drops down while the mouse is near the top edge or over the bar and its lists.
  addEventListener('mousemove', (e) => {
    if (body.classList.contains('bar-docked')) return;
    const near = e.clientY <= 80 || mainBar.contains(e.target);
    if (peekHold) { if (!near) peekHold = false; return; }   // just used or just hidden: wait for the mouse to leave
    clearTimeout(peekTimer);
    if (near) body.classList.add('bar-peek');
    else if (body.classList.contains('bar-peek')) peekTimer = setTimeout(() => body.classList.remove('bar-peek'), 400);
  });

  // ---------------------------------------------------------------- input
  function onKey(e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const k = e.key;
    hideHint();
    if (isBlank()) { e.preventDefault(); unblank(); return; }
    if (overlayOpen()) { if (k === 'Escape' || k === 'h' || k === 'H' || k === '?' || k === 'o' || k === 'O') { e.preventDefault(); closeOverlay(); } return; }
    if (/^[0-9]$/.test(k)) { typed += k; showTyped(); e.preventDefault(); return; }
    if (k === 'Enter' && typed) { const n = +typed; typed = ''; showTyped(); if (n >= 1 && n <= slides.length) jump(n - 1); e.preventDefault(); return; }
    if (k === 'Escape' && typed) { typed = ''; showTyped(); return; }
    let handled = true;
    switch (k) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': case 'Enter': case 'n': case 'N': next(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': case 'p': case 'P': prev(); break;
      case 'Home': jump(0); break;
      case 'End': jump(lastMain); break;
      case 'm': case 'M': toggleBar(); break;
      case 'b': case 'B': case '.': blank('black'); break;
      case 'w': case 'W': case ',': blank('white'); break;
      case 'f': case 'F': case 'F5': toggleFullscreen(); break;
      case 's': case 'S': openSpeaker(); break;
      case 'o': case 'O': toggleList(); break;
      case 'r': case 'R': restart(); break;
      case 't': case 'T': toggleNotes(); break;
      case 'h': case 'H': case '?': toggleHelp(); break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  }
  document.addEventListener('keydown', onKey);
  // A click only drives the talk. Left alone, it would also drop a text cursor where it
  // lands (drawn when Edge or Chrome has caret browsing, F7, turned on) or highlight a word.
  $('viewport').addEventListener('mousedown', (e) => e.preventDefault());
  $('viewport').addEventListener('click', (e) => { if (e.button === 0 && !e.target.closest('a')) { hideHint(); next(); } });   // a link on a slide opens, and the talk stays put
  $('viewport').addEventListener('contextmenu', (e) => { e.preventDefault(); prev(); });
  // Previous and Next, bottom right. Like the bar, they take no focus, so the keys keep driving the talk.
  $('nav').addEventListener('mousedown', (e) => e.preventDefault());
  $('nav').addEventListener('contextmenu', (e) => e.preventDefault());
  $('navPrev').addEventListener('click', () => { hideHint(); prev(); });
  $('navNext').addEventListener('click', () => { hideHint(); next(); });
  $('blank').addEventListener('click', unblank);
  $('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeOverlay(); });
  let idleTimer = 0;
  addEventListener('mousemove', () => { body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(goIdle, 2500); });
  function goIdle() { body.classList.add('idle'); if (!mainBar.matches(':hover')) body.classList.remove('bar-peek'); }
  function hideHint() { body.classList.add('hint-off'); }
  setTimeout(hideHint, 8000);

  // ---------------------------------------------------------------- notes text
  function notesFor(i, s) {
    const spec = slides[i];
    if (!spec.anim) return { head: '', text: spec.script };
    const sc = scene(spec.anim).sc, n = sc.steps.length;
    return { head: `Animation step ${s + 1} of ${n}`, text: sc.steps[s].meta.say || '', after: s < n - 1 ? sc.steps[s + 1].meta.say : '' };
  }
  function sync() {
    const n = notesFor(idx, step);
    $('notesPanel').textContent = (n.head ? n.head + ': ' : '') + n.text;
    updateBars();
    updateSpeaker();
  }

  // ---------------------------------------------------------------- speaker view
  // A second window, opened by this page, so this page can draw into it directly:
  // the script, a timer against the planned pace, and previews of now and next.
  let spk = null;
  const SPEAKER_CSS = `
    *{box-sizing:border-box} body{margin:0;background:#1d1d1f;color:#f2f2f2;font-family:${R.FONTS.body};height:100vh;display:flex;flex-direction:column;user-select:none;caret-color:transparent}
    .top{display:flex;align-items:center;gap:22px;padding:10px 16px;background:#2a2a2d;font-size:20px;flex-wrap:wrap}
    .top b{font-size:22px} .clock{font-size:34px;font-variant-numeric:tabular-nums;font-weight:700} .plan{color:#bdbdbd} .over{color:#ff8a8a} .ahead{color:#9fe0a8}
    .top .sp{flex:1} button{font:inherit;font-size:16px;background:#3a3a3e;color:#fff;border:1px solid #555;border-radius:8px;padding:6px 12px;cursor:pointer} button:hover{background:#4a4a4f}
    .main{flex:1;display:flex;min-height:0}
    .left{width:46%;padding:14px;display:flex;flex-direction:column;gap:10px}
    .right{flex:1;padding:14px 22px;overflow:auto}
    .pv{position:relative;overflow:hidden;background:#000;border-radius:6px} .pv>div{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
    .lab{font-size:16px;color:#bdbdbd;text-transform:uppercase;letter-spacing:.06em}
    .stephead{font-size:20px;color:#F1BE48;font-weight:700;margin-bottom:8px}
    .notes{font-size:27px;line-height:1.42;white-space:pre-wrap}
    .after{margin-top:18px;font-size:19px;color:#bdbdbd;white-space:pre-wrap}
    .dcbar{background:#202023;flex:none}`;
  function openSpeaker() {
    if (spk && !spk.closed) { spk.focus(); return; }
    spk = window.open('', 'dcSpeakerView', 'width=1400,height=860');
    if (!spk) { alert('The browser blocked the speaker window. Allow pop-ups for this file, then press S again.'); return; }
    const d = spk.document;
    d.open();
    d.write('<!doctype html><html><head><meta charset="utf-8"><title>Speaker view</title></head><body></body></html>');
    d.close();
    if ($('fontcss')) d.head.appendChild(d.importNode($('fontcss'), true));   // the deck's own fonts, for computers without Calibri
    d.head.appendChild(d.importNode($('sharedcss'), true));   // the section bar's and progress strips' styles, ahead of this view's own
    const st = d.createElement('style'); st.textContent = SPEAKER_CSS; d.head.appendChild(st);
    d.body.innerHTML = `<div class="top"><b id="pos"></b><span id="step"></span><span class="sp"></span>
        <span class="clock" id="clock">0:00</span><span id="plan" class="plan"></span>
        <button id="bPrev">&#9664; Back</button><button id="bNext">Next &#9654;</button><button id="bReplay">Replay animation</button>
        <button id="bBlack">Black screen</button><button id="bReset">Reset timer</button></div>
      <div class="main"><div class="left"><div class="lab">Now</div><div class="pv" id="pvNow"></div>
        <div class="lab" id="nextLab">Next</div><div class="pv" id="pvNext"></div></div>
        <div class="right"><div class="stephead" id="stephead"></div><div class="notes" id="notes"></div><div class="after" id="after"></div></div></div>`;
    d.body.insertBefore(buildBar(d, false), d.querySelector('.main'));
    const on = (id, f) => d.getElementById(id).addEventListener('click', f);
    on('bPrev', prev); on('bNext', next); on('bReplay', restart);
    on('bBlack', () => (isBlank() ? unblank() : blank('black')));
    on('bReset', () => { timerAcc = 0; timerStart = performance.now(); updateSpeaker(); });
    d.addEventListener('keydown', onKey);
    spk.addEventListener('resize', updateSpeaker);
    addEventListener('beforeunload', () => { try { spk.close(); } catch (e) { /* gone */ } });
    updateBars();
    updateSpeaker();
  }
  function preview(host, i, s, width) {
    host.innerHTML = '';
    host.style.width = width + 'px'; host.style.height = (width * 1080) / 1920 + 'px';
    if (i == null) return;
    const inner = host.ownerDocument.createElement('div');
    inner.style.transform = `scale(${width / 1920})`;
    host.appendChild(inner);
    const svg = R.renderSlide(slides[i], inner, { number: i + 1 });
    partStrip(inner, i);
    if (slides[i].anim && svg) { new Anim.Player(svg, scene(slides[i].anim).sc).renderEnd(s); paintStrip(makeStrip(inner, stepsOf(i), 'steps'), s, 1); }
  }
  let lastPreviewKey = '';
  function updateSpeaker() {
    if (!spk || spk.closed) return;
    const d = spk.document, g = (id) => d.getElementById(id);
    if (!g('pos')) return;
    const spec = slides[idx], n = notesFor(idx, step);
    g('pos').textContent = `Slide ${idx + 1} of ${slides.length}${spec.backup ? ' (backup)' : ''}`;
    g('step').textContent = spec.anim ? `step ${step + 1} of ${stepsOf(idx)}` : '';
    const el = elapsed();
    g('clock').textContent = mmss(el);
    if (spec.endAt != null) {
      const per = spec.anim ? spec.budget / stepsOf(idx) : spec.budget;
      const planEnd = spec.endAt - (spec.anim ? per * (stepsOf(idx) - 1 - step) : 0);
      const diff = el - planEnd;
      g('plan').innerHTML = `planned end of this ${spec.anim ? 'step' : 'slide'}: ${mmss(planEnd)} &middot; ` + (diff > 0 ? `<span class="over">${mmss(diff)} behind</span>` : `<span class="ahead">${mmss(-diff)} ahead</span>`);
    } else g('plan').textContent = spec.backup ? 'backup slide' : '';
    g('stephead').textContent = n.head;
    g('notes').textContent = n.text;
    g('after').textContent = n.after ? 'Next step: ' + n.after : '';
    const key = `${idx}:${step}:${spk.innerWidth}`;
    if (key !== lastPreviewKey) {
      lastPreviewKey = key;
      const wNow = Math.max(320, Math.min(spk.innerWidth * 0.43, 760));
      preview(g('pvNow'), idx, step, wNow);
      let ni = idx, ns = step + 1;
      if (!spec.anim || step >= stepsOf(idx) - 1) { ni = idx + 1 < slides.length ? idx + 1 : null; ns = 0; }
      g('nextLab').textContent = ni == null ? 'End of deck' : ni === idx ? `Next: step ${ns + 1}` : `Next: slide ${ni + 1}`;
      preview(g('pvNext'), ni, ns, wNow * 0.62);
    }
  }
  setInterval(updateSpeaker, 500);

  // ---------------------------------------------------------------- printable script
  function printableScript() {
    document.title = 'Script: ' + document.title;
    document.body.className = 'script';      // runs before the stage code below defines `body`
    const out = document.getElementById('script');
    out.innerHTML = '<h1>Speaker script</h1><p class="sub">One block per slide: what is on screen, the timing cue, and what to say. Print with background graphics on to keep the slide thumbnails.</p>';
    slides.forEach((s, i) => {
      const blk = document.createElement('section');
      const cue = s.endAt != null ? `${mmss(s.budget)} on this slide &middot; end at ${mmss(s.endAt)}` : 'backup: only if asked';
      blk.innerHTML = `<h2>${i + 1}. ${(s.title || '').replace(/</g, '&lt;')}</h2><div class="cue">${cue}</div>`;
      const th = document.createElement('div'); th.className = 'thumb';
      const inner = document.createElement('div'); inner.style.transform = 'scale(0.2)'; th.appendChild(inner);
      blk.appendChild(th);
      const svg = R.renderSlide(s, inner, { number: i + 1 });
      if (s.anim && svg) new Anim.Player(svg, scene(s.anim).sc).renderEnd(stepsOf(i) - 1);
      const tx = document.createElement('div'); tx.className = 'say'; tx.textContent = s.script;
      blk.appendChild(tx);
      out.appendChild(blk);
    });
  }

  // ---------------------------------------------------------------- go
  const start = parseInt((location.hash || '').slice(1), 10);
  show(Number.isFinite(start) && start >= 1 ? start - 1 : 0, 'start');
  window.__deck = { slides, parts, show, jump, next, prev, get state() { return { idx, step, playing }; }, openSpeaker, get speaker() { return spk; } };
})();

</script>
</body>
</html>
