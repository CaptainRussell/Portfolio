<style>
  :root {
    --cardinal: #C8102E; --gold: #F1BE48; --ink: #1A1A1A; --grey: #6B6B6B; --line: #D9D9D9;
    --body: Calibri, "Deck Sans", "Segoe UI", Arial, sans-serif; --head: Cambria, "Deck Serif", Georgia, "Times New Roman", serif;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  #frame, .ghost { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; overflow: hidden; background: #fff;
    transform-origin: center center; -webkit-font-smoothing: antialiased; }
  .ghost { pointer-events: none; }   /* the slide being left, fading out over the new one (present.js, show) */
  /* the section transition (present.js, sectionSweep): a cardinal band with gold edges and the four suits sweeps across */
  .sweep { position: absolute; top: -12%; bottom: -12%; left: -20%; width: 140%; z-index: 20; display: flex; pointer-events: none; will-change: transform; }
  .sweep i { flex: 0 0 34px; background: #F1BE48; }
  .sweep b { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #C8102E; }
  .sweep b span { transform: skewX(14deg); font: 20vh/1 "Segoe UI Symbol", Arial, sans-serif; letter-spacing: .3em; color: rgba(255, 255, 255, .18); white-space: nowrap; }
  #frame sup, #frame sub, .ghost sup, .ghost sub { position: relative; vertical-align: baseline; }
  #frame sup, .ghost sup { top: -0.55em; } #frame sub, .ghost sub { top: 0.25em; }
  /* nothing on screen takes a text cursor or a highlight (caret browsing, F7, would draw one) */
  body:not(.script) { -webkit-user-select: none; user-select: none; caret-color: transparent; }

  #blank { position: fixed; inset: 0; display: none; z-index: 40; }
  body.blank-black #blank { display: block; background: #000; }
  body.blank-white #blank { display: block; background: #fff; }

  #overlay { position: fixed; inset: 0; display: none; z-index: 30; background: rgba(0, 0, 0, .55); align-items: center; justify-content: center; }
  body.overlay #overlay { display: flex; }
  .panel { background: #fff; color: var(--ink); font-family: var(--body); font-size: 18px; border-radius: 14px; padding: 22px 30px;
    max-width: min(1150px, 92vw); max-height: 86vh; overflow: auto; box-shadow: 0 12px 40px rgba(0, 0, 0, .4); }
  .panel h2 { font-family: var(--head); color: var(--cardinal); margin: 0 0 12px; font-size: 30px; }
  .panel h3 { margin: 14px 0 4px; font-size: 18px; color: var(--grey); }
  .panel table { border-collapse: collapse; } .panel td { padding: 5px 0; vertical-align: top; }
  .panel td.k { font-weight: 700; padding-right: 26px; white-space: nowrap; }
  .panel a { color: var(--cardinal); }
  .list ol { columns: 2; column-gap: 40px; margin: 0; padding-left: 2.2em; }
  .list li { padding: 2px 0; break-inside: avoid; } .list a { text-decoration: none; } .list a:hover { text-decoration: underline; }
  .list em { color: var(--grey); font-style: normal; font-size: 15px; }

  #notesPanel { display: none; position: fixed; left: 0; right: 0; bottom: 0; max-height: 32vh; overflow: auto; z-index: 15;
    background: rgba(18, 18, 18, .93); color: #fff; font-family: var(--body); font-size: 21px; line-height: 1.4; padding: 12px 20px; white-space: pre-wrap; }
  body.notes #notesPanel { display: block; }
  #jump { position: fixed; left: 16px; bottom: 14px; z-index: 35; color: #fff; background: rgba(0, 0, 0, .7); font: 18px var(--body); padding: 5px 12px; border-radius: 6px; }
  #jump:empty { display: none; }
  #hint { position: fixed; right: 16px; bottom: 78px; z-index: 36; background: rgba(0, 0, 0, .75); color: #fff; font: 17px var(--body);
    padding: 8px 14px; border-radius: 8px; transition: opacity .6s; }
  body.hint-off #hint { opacity: 0; pointer-events: none; }
  body.idle, body.idle * { cursor: none !important; }
  /* Previous and Next, bottom right, just above the progress strips and over the corner where a slide's own
     number would sit (the bar carries the number). Always there, quiet until pointed at. */
  #nav { position: fixed; right: 16px; bottom: 22px; z-index: 28; display: flex; gap: .25em; padding: .25em; border-radius: 999px;
    font-size: 16px; background: rgba(20, 20, 20, .6); -webkit-user-select: none; user-select: none; }   /* placed and sized by fit() */
  #nav button { display: flex; align-items: center; gap: .38em; font: 600 1em/1 var(--body); color: #fff; background: none; border: 0;
    border-radius: 999px; padding: .56em .94em; cursor: pointer; }
  #nav button:hover { background: rgba(255, 255, 255, .18); }
  #nav svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  body.script #nav { display: none; }

  /* the section bar: docked above the slide; once hidden with M, it drops down on demand */
  #bar { position: fixed; left: 0; right: 0; top: 0; z-index: 25; transform: translateY(-100%); transition: transform .16s ease-out; }
  body.bar-docked #bar, body.bar-peek #bar { transform: none; }
  body.bar-peek #bar { box-shadow: 0 3px 16px rgba(0, 0, 0, .45); }

  /* the printable script (?script) */
  #script { display: none; }
  body.script { overflow: auto; background: #fff; height: auto; }
  body.script #viewport, body.script #hint, body.script #jump, body.script #notesPanel { display: none; }
  body.script #script { display: block; max-width: 1020px; margin: 0 auto; padding: 24px 20px 60px; font-family: var(--body); color: var(--ink); }
  #script h1 { font-family: var(--head); color: var(--cardinal); margin: 0 0 6px; }
  #script .sub { color: var(--grey); margin: 0 0 18px; }
  #script section { display: grid; grid-template-columns: 384px 1fr; gap: 4px 22px; padding: 16px 0; border-top: 1px solid var(--line); break-inside: avoid; }
  #script h2 { grid-column: 1 / -1; margin: 0; font-size: 20px; font-family: var(--head); }
  #script .cue { grid-column: 1 / -1; color: var(--grey); font-size: 15px; margin-bottom: 6px; }
  #script .thumb { position: relative; width: 384px; height: 216px; overflow: hidden; border: 1px solid var(--line); }
  #script .thumb > div { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #script .say { white-space: pre-wrap; font-size: 15.5px; line-height: 1.45; }
  @media print {
    body.script #script { padding: 0; max-width: none; }
    #script .thumb, #script .thumb * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<style id="sharedcss">
  /* Shared by this window and the speaker view (present.js copies this block there). */

  /* Progress strips, in the band every slide keeps clear below y 1059 (where an animation's
     caption box ends). The part strip runs along the very bottom, one segment per slide of the
     current part; on an animation slide the step strip sits just above it, one segment per step.
     Filled is done, empty is still to come; the empty grey is dark enough to survive a projector. */
  .strip { position: absolute; left: 72px; width: 1776px; height: 5px; display: flex; gap: 8px; }
  .strip i { flex: 1; border-radius: 3px; background: #C6C6C6; overflow: hidden; }
  .strip b { display: block; width: 0; height: 100%; }
  .strip.part { top: 1072px; }
  .strip.part b { background: #404040; }
  .strip.part.dark i { background: rgba(255, 255, 255, .3); }   /* on the red slides */
  .strip.part.dark b { background: #FFFFFF; }
  /* An animation slide's segment is dotted gold while still to come and solid gold once reached.
     One gold on white and red slides alike, so a segment never changes colour from one slide to
     the next; deeper than ISU gold so it holds up on white. Dots, not a paler tint, because
     displays and projectors flatten pale tints into the grey of an ordinary segment, and not
     solid, because a solid segment ahead reads as already done. */
  .strip.part i.anim, .strip.part.dark i.anim { background: repeating-linear-gradient(90deg, #E0A526 0 10px, transparent 10px 16px); }
  .strip.part i.anim b, .strip.part.dark i.anim b { background: #E0A526; }
  .strip.steps { top: 1063px; }
  .strip.steps b { background: #C8102E; }

  /* The section bar. Its height is BAR_H in present.js. */
  .dcbar { display: flex; align-items: stretch; gap: 4px; height: 52px; padding: 0 10px; box-sizing: border-box;
    background: #161616; color: #f2f2f2; font: 16px/1.2 Calibri, "Deck Sans", "Segoe UI", Arial, sans-serif; -webkit-user-select: none; user-select: none; }
  .dcbar button { font: inherit; color: inherit; background: none; border: 0; border-radius: 7px; margin: 8px 0; padding: 0 11px;
    cursor: pointer; white-space: nowrap; }
  .dcbar button:hover { background: rgba(255, 255, 255, .13); }
  .dcbar [hidden] { display: none !important; }
  .dcbar .tabs { display: flex; flex: 1; min-width: 0; gap: 2px; margin: 0 10px; }
  .dcbar .tab { position: relative; display: flex; min-width: 0; }
  .dcbar .tb { position: relative; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .dcbar .tb b { display: inline-block; min-width: 1.4em; margin-right: 7px; border-radius: 4px; background: rgba(255, 255, 255, .15); text-align: center; }
  .dcbar .tb .sh { display: none; }
  .dcbar .tb i { position: absolute; left: 0; bottom: 0; width: 0; height: 3px; background: #F1BE48; }   /* how far into this part */
  .dcbar .tab.cur .tb { background: #C8102E; }
  .dcbar .tab.cur .tb b { background: rgba(0, 0, 0, .28); }
  .dcbar .menu { display: none; position: absolute; top: 100%; left: 0; z-index: 2; width: max-content; min-width: 340px; max-width: min(600px, 92vw);
    padding: 6px; background: #232323; border-radius: 0 0 10px 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, .5); }
  .dcbar .tab:hover .menu { display: block; }
  .dcbar .tab.shut .menu { display: none; }
  .dcbar .tab:last-child .menu { left: auto; right: 0; }
  .dcbar .mh { padding: 8px 10px 6px; color: #F1BE48; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; }

<script>
/* cipher.js: The Daniels' Cipher, traced step by step for animation.
 *
 * Mirrors Appendix/weird_port.py (itself validated against weirdleh-exp.c).
 * Cards are ids like "S3" (suit letter + value) so the animation can track
 * physical cards; every comparison the cipher makes uses the value only.
 * verify_cipher.py cross-checks this file against weird_port.py.
 */
(function (root) {
  'use strict';

  const val = (id) => (typeof id === 'number' ? id : +id.slice(1));

  function factorial(n) { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; }

  function lehmer(perm) {
    const n = perm.length; let rad = factorial(n - 1), code = 0;
    for (let i = 0; i < n; i++) {
      let c = 0;
      for (let j = i + 1; j < n; j++) if (perm[j] < perm[i]) c++;
      code += c * rad;
      if (n - i - 1 > 0) rad /= (n - i - 1);
    }
    return code;
  }

  function codeToPerm(code, n) {
    const avail = []; for (let i = 0; i < n; i++) avail.push(i);
    const out = [];
    for (let i = 0; i < n; i++) {
      const w = factorial(n - 1 - i);
      out.push(avail.splice(Math.floor(code / w), 1)[0]);
      code %= w;
    }
    return out;
  }

  // Move the top c cards to the bottom, keeping their order.
  function countcut(deck, c) {
    const n = deck.length; c %= n;
    return deck.slice(c).concat(deck.slice(0, c));
  }

  // Deal alternately onto two piles until the target value is dealt; the pile
  // holding the target goes on top of the other, both beneath the undealt cards.
  function searchcut(deck, target) {
    const piles = [[], []], deals = [];
    let wh = 0, top = 0;
    while (top < deck.length && val(deck[top]) !== target) {
      piles[wh].push(deck[top]); deals.push({ card: deck[top], pile: wh, target: false });
      wh = 1 - wh; top++;
    }
    if (top < deck.length) {
      piles[wh].push(deck[top]); deals.push({ card: deck[top], pile: wh, target: true });
    }
    top++;
    const undealt = deck.slice(top);
    const result = undealt.concat(piles[wh].slice().reverse(), piles[1 - wh].slice().reverse());
    return { deals, piles, foundPile: wh, undealt, result };
  }

  const stateCode = (drive, search) =>
    lehmer(search.map(val)) * factorial(drive.length) + lehmer(drive.map(val));

  // One round (n/2 turns; the original code's "full round") from a boundary state, with every operation recorded.
  function fullRound(drive, search, r) {
    const n = drive.length, ops = [], discard = [];
    let front = 0, end = n - 1;
    while (end >= front) {
      const c = drive[end--]; discard.push(c);
      const cBefore = search; search = countcut(search, val(c));
      ops.push({ type: 'count', card: c, count: val(c), before: cBefore, after: search, discard: discard.slice() });
      const t = drive[front++]; discard.push(t);
      const sc = searchcut(search, val(t));
      ops.push({ type: 'search', card: t, target: val(t), before: search, deals: sc.deals,
        piles: sc.piles, foundPile: sc.foundPile, undealt: sc.undealt, after: sc.result,
        output: sc.result[0], discard: discard.slice() });
      search = sc.result;
    }
    const rotated = countcut(discard, r % n);
    return { ops, discard, rotated, drive: search, search: rotated };
  }

  // Key schedule (iv + key + iv), every operation recorded.
  function keySchedule(drive, search, key, iv) {
    iv = iv || '';
    const full = iv + key + iv, n = drive.length, ops = [];
    for (let i = 0; i < full.length; i++) {
      const face = (full.charCodeAt(i) - 65) % n;
      const next = (full.charCodeAt((i + 1) % full.length) - 65) % n;
      const d1 = countcut(drive, face);
      const d2 = searchcut(d1, next).result;
      const s1 = searchcut(search, face).result;
      const s2 = countcut(s1, next);
      ops.push({ i, letter: full[i], nextLetter: full[(i + 1) % full.length], face, next,
        drive: [drive, d1, d2], search: [search, s1, s2] });
      drive = d2; search = s2;
    }
    return { ops, drive, search };
  }

  // Successor of every state code under one round (values only).
  function successorMap(n, r) {
    const np = factorial(n), perms = [];
    for (let c = 0; c < np; c++) perms.push(codeToPerm(c, n));
    const nxt = new Array(np * np);
    for (let code = 0; code < np * np; code++) {
      const s = perms[Math.floor(code / np)], d = perms[code % np];
      const fr = fullRound(d, s, r);
      nxt[code] = stateCode(fr.drive, fr.search);
    }
    return nxt;
  }

  // Cycles as ordered lists of codes, longest first.
  function cycles(nxt) {
    const seen = new Uint8Array(nxt.length), out = [];
    for (let s = 0; s < nxt.length; s++) {
      if (seen[s]) continue;
      const cyc = []; let c = s;
      while (!seen[c]) { seen[c] = 1; cyc.push(c); c = nxt[c]; }
      out.push(cyc);
    }
    return out.sort((a, b) => b.length - a.length);
  }

  function allKeys(n) {
    const keys = [], total = Math.pow(n, n);
    for (let k = 0; k < total; k++) {
      let s = '', x = k;
      for (let i = 0; i < n; i++) { s = String.fromCharCode(65 + (x % n)) + s; x = Math.floor(x / n); }
      keys.push(s);
    }
    return keys;
  }

  // Code of a key's first boundary state C1 (key schedule, then one round).
  function firstBoundaryCode(key, n, r) {
    const init = []; for (let i = 0; i < n; i++) init.push(i);
    const ks = keySchedule(init.slice(), init.slice(), key, '');
    const fr = fullRound(ks.drive, ks.search, r);
    return stateCode(fr.drive, fr.search);
  }

  const api = { val, factorial, lehmer, codeToPerm, countcut, searchcut, stateCode,
    fullRound, keySchedule, successorMap, cycles, allKeys, firstBoundaryCode };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Cipher = api;
})(this);

<script>
/* engine.js: keyframe timeline and SVG renderer for the defense animations.
 *
 * A Scene is a set of objects plus a list of steps. A step is one presenter
 * click; it plays one or more beats in sequence. A beat is a full snapshot of
 * every object's properties and a duration; rendering interpolates from the
 * previous snapshot to the beat's snapshot. Because every frame is a pure
 * function of (step, time), the same scene plays live in the browser and is
 * captured frame by frame for the slide deck.
 */
(function (root) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  // Calibri matches the deck's body font; it runs small, so sizes are scaled up a touch. Deck Sans and Deck Serif are
  // the deck's own copies with the same letter widths, for computers without Calibri and Cambria (presentation/fonts.css).
  const FONT = 'Calibri, "Deck Sans", "Segoe UI", Arial, sans-serif', SERIF = 'Cambria, "Deck Serif", Georgia, "Times New Roman", serif', FONT_SCALE = 1.08;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

  const isColor = (v) => typeof v === 'string' && (v[0] === '#' || v.startsWith('rgb'));
  function lerpColor(a, b, t) {

    if (t >= 1) return b;

      el('text', { x: W / 2 + 4, y: H / 2 + 44, 'text-anchor': 'middle', 'font-family': 'Segoe UI Symbol, Arial', 'font-size': 84, fill: col }, inner).textContent = s;
      const dim = el('rect', { x: 0, y: 0, width: W, height: H, rx: 12, fill: '#FFFFFF', opacity: 0 }, inner);
      const glow = el('rect', { x: -6, y: -6, width: W + 12, height: H + 12, rx: 16, fill: 'none', stroke: '#F1BE48', 'stroke-width': 8, opacity: 0 }, root);

    defaults: { content: '', fill: '#1A1A1A', num: 0, rot: 0 },
    create(g, cfg) {

      } else {
        setA(h.a, 'opacity', '0');
        setA(h.b, 'opacity', p.o.toFixed(3));
      }
    },
  };

  KINDS.rect = {
    defaults: { w: 100, h: 100, rx: 8, fill: '#FFFFFF', fo: 1, stroke: '#1A1A1A', sw: 0, draw: 1 },
    create(g, cfg) {

    },

      setA(r, 'stroke', p.stroke); setA(r, 'stroke-width', p.sw);

  KINDS.dot = {
    defaults: { r: 4, fill: '#1A1A1A', stroke: '#FFFFFF', sw: 0 },
    create(g) { return { c: el('circle', {}, g) }; },
    update(h, p) {

    },
  };

  // Miniature state: both decks as two rows of small cards, with a caption above.
  KINDS.tile = {
    defaults: { glow: 0 },
    create(g, cfg) {
      const root = el('g', {}, g);
      const cw = 46, ch = 62, gap = 8, pad = 18, lab = 92;
      const W = pad * 2 + lab + 4 * cw + 3 * gap, H = pad * 2 + 2 * ch + 16;
      el('rect', { x: 0, y: 0, width: W, height: H, rx: 14, fill: '#FFFFFF', stroke: '#BDBDBD', 'stroke-width': 2 }, root);
      const glow = el('rect', { x: -5, y: -5, width: W + 10, height: H + 10, rx: 18, fill: 'none', stroke: '#F1BE48', 'stroke-width': 7, opacity: 0 }, root);
      [['drive', cfg.drive], ['search', cfg.search]].forEach(([name, deck], r) => {
        const y = pad + r * (ch + 16);
        el('text', { x: pad, y: y + ch / 2 + 8, 'font-family': FONT, 'font-size': 22, fill: '#6B6B6B' }, root).textContent = name;
        deck.forEach((id, i) => {
          const x = pad + lab + i * (cw + gap), red = id[0] === 'H';
          el('rect', { x, y, width: cw, height: ch, rx: 6, fill: '#FFFFFF', stroke: '#9A9A9A', 'stroke-width': 1.2 }, root);
          el('text', { x: x + cw / 2, y: y + 30, 'text-anchor': 'middle', 'font-family': SERIF, 'font-size': 25, 'font-weight': 700,
            fill: red ? '#C8102E' : '#1A1A1A' }, root).textContent = RANKS[+id.slice(1)];
          el('text', { x: x + cw / 2, y: y + 54, 'text-anchor': 'middle', 'font-family': 'Segoe UI Symbol, Arial', 'font-size': 20,
            fill: red ? '#C8102E' : '#1A1A1A' }, root).textContent = SUIT[id[0]];
        });
      });
      if (cfg.label) {
        el('text', { x: 0, y: -14, 'font-family': FONT, 'font-size': 29, 'font-weight': 700, fill: '#1A1A1A' }, root).textContent = cfg.label;
      }
      return { root, glow, W, H };
    },
    update(h, p) {
      setA(h.root, 'transform', `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) scale(${p.s.toFixed(4)})`);
      setA(h.root, 'opacity', p.o.toFixed(3));
      setA(h.glow, 'opacity', p.glow.toFixed(3));
    },
  };

  // ---------------------------------------------------------------- scene
  const cloneSnap = (s) => { const o = {}; for (const k in s) o[k] = Object.assign({}, s[k]); return o; };

  class Scene {
    constructor(name, title, w, h) {
      this.name = name; this.title = title; this.w = w || 1920; this.h = h || 920;
      this.objs = []; this.byId = {}; this.snap = {}; this.steps = []; this.base = null;
    }
    add(id, kind, cfg, props) {
      if (this.byId[id]) throw new Error('duplicate id ' + id);
      // Steps already recorded would not know a later object, and replaying them would fail.
      if (this.steps.length) throw new Error(`${this.name}: add '${id}' before the first step`);
      const o = { id, kind, cfg: cfg || {}, idx: this.objs.length };
      this.objs.push(o); this.byId[id] = o;
      this.snap[id] = Object.assign({ x: 0, y: 0, o: 1, s: 1, z: 0 }, KINDS[kind].defaults, props || {});
      if (this.base) this.base[id] = Object.assign({}, this.snap[id]);
      return id;
    }
    // Start a new presenter step. meta carries notes for the deck (title, script).
    step(meta) {
      if (!this.base) this.base = cloneSnap(this.snap);
      this.steps.push({ meta: meta || {}, beats: [] });
      return this;
    }
    // Append a beat: clone the current snapshot, let mut() edit it, play over dur seconds
    // (stretched by the scene's pace, if it sets one: 1.3 plays 30% slower).
    // timing(id) may return {w: [a, b], arc: px} to stagger or arc individual objects.
    beat(dur, mut, timing) {
      const s = cloneSnap(this.snap);
      if (mut) mut(s);
      this.steps[this.steps.length - 1].beats.push({ dur: dur * (this.pace || 1), snap: s, timing: timing || null });
      this.snap = s;
      return this;
    }
    hold(dur) { return this.beat(dur, null); }
    stepStart(i) { return i === 0 ? this.base : this.steps[i - 1].beats[this.steps[i - 1].beats.length - 1].snap; }
    stepEnd(i) { const b = this.steps[i].beats; return b.length ? b[b.length - 1].snap : this.stepStart(i); }
    duration(i) { return this.steps[i].beats.reduce((a, b) => a + b.dur, 0); }
  }

  // ---------------------------------------------------------------- player
  class Player {
    constructor(svg, scene) {
      this.svg = svg; this.scene = scene;
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      svg.setAttribute('viewBox', `0 0 ${scene.w} ${scene.h}`);
      el('rect', { x: 0, y: 0, width: scene.w, height: scene.h, fill: '#FFFFFF' }, svg);
      this.layer = el('g', {}, svg);
      this.h = {};
      scene.objs.forEach((o) => { this.h[o.id] = KINDS[o.kind].create(this.layer, o.cfg); this.h[o.id]._node = this._rootOf(this.h[o.id]); });
      this.orderKey = '';
    }
    _rootOf(h) { return h.root || h.r || h.c || h.p; }

    // Render step i at time t seconds into that step.
    render(i, t) {
      const sc = this.scene, step = sc.steps[i];
      let prev = sc.stepStart(i), cur = prev, p = 1, timing = null, acc = 0;
      for (let j = 0; j < step.beats.length; j++) {
        const b = step.beats[j];
        if (t < acc + b.dur || j === step.beats.length - 1) {
          prev = j === 0 ? sc.stepStart(i) : step.beats[j - 1].snap;
          cur = b.snap; timing = b.timing;
          p = b.dur > 0 ? clamp((t - acc) / b.dur, 0, 1) : 1;
          break;
        }
        acc += b.dur;
      }
      if (!step.beats.length) { prev = cur = sc.stepStart(i); p = 1; }
      this._draw(prev, cur, p, timing);
    }
    renderEnd(i) { const s = this.scene.stepEnd(i); this._draw(s, s, 1, null); }

    _draw(A, B, p, timing) {
      const sc = this.scene, zs = [];
      for (const o of sc.objs) {
        const a = A[o.id], b = B[o.id];
        let lp = p, arc = 0;
        if (timing) {
          const tm = timing(o.id);
          if (tm) {
            if (tm.w) lp = clamp((p - tm.w[0]) / Math.max(1e-6, tm.w[1] - tm.w[0]), 0, 1);
            if (tm.arc) arc = tm.arc;
          }
        }
        const e = easeInOut(lp), q = {};
        for (const k in b) {
          const va = a[k], vb = b[k];
          if (typeof vb === 'number' && typeof va === 'number') q[k] = lerp(va, vb, e);
          else if (isColor(vb) && isColor(va)) q[k] = lerpColor(va, vb, e);
          else q[k] = e < 0.5 ? va : vb;
        }
        if (arc) q.y += -arc * Math.sin(Math.PI * e);
        KINDS[o.kind].update(this.h[o.id], q, a, b, e);
        zs.push([q.z, o.idx, o.id]);
      }
      zs.sort((u, v) => u[0] - v[0] || u[1] - v[1]);
      const key = zs.map((z) => z[1]).join(',');
      if (key !== this.orderKey) {
        this.orderKey = key;
        zs.forEach((z) => this.layer.appendChild(this.h[z[2]]._node));
      }
    }
  }

  root.Anim = { Scene, Player, KINDS, el, easeInOut, fmtNum, FONT, SERIF };
})(this);

<script>
/* scenes.js: the defense animations; all but the first are built from cipher.js traces.
 *
 *   stream : what a stream cipher does: message, secret stream, what is sent, and back
 *   worked : the paper's worked example (deck 4, rotation 3, two rounds), shown as four
 *            slides: worked1 (setup and round 1), worked2 (round 2), states (the two states those rounds
 *            reached, side by side) and worked3 (encrypt, send, decrypt)
 *   cycles : one continuous animation shown as five slides, each starting where the last stopped:
 *            loops (every state sits on exactly one cycle, deck 4, rotation 3, opening on the breakdown's
 *            State 1), scope (the zoom-out to the grid of the 11 configurations analyzed), growth (how fast the state
 *            space grows, from the example's 576 states to 10 cards), shares (the giant cycles: the grid's
 *            rotation-0 column unrolls into bars, then rolls back) and rotation (the 8-card row unrolls)
 *   keys   : the key schedule turns a word into a starting arrangement, which sits on one cycle
 *   land   : where all 256 deck-4 keys land, and the weak ones
 *
 * Each step's meta.say is the presenter's line for that click; the deck copies it into the speaker notes.
 */
(function (root) {
  'use strict';
  const { Scene } = root.Anim;
  const C = root.Cipher;

  const RED = '#C8102E', GOLD = '#F1BE48', GOLD_D = '#C99400', INK = '#1A1A1A', GREY = '#6B6B6B',
    MID = '#9A9A9A', LIGHT = '#D9D9D9', CHAR = '#4A4A4A';
  const LOOP_COL = [RED, CHAR, GOLD_D, GOLD_D];
  const RANK = ['A', '2', '3', '4', '5', '6', '7', '8'];
  const nm = (id) => RANK[C.val(id)] + (id[0] === 'S' ? '♠' : '♥');
  const N = 4, ROT = 3;
  const START_DRIVE = ['S0', 'S1', 'S2', 'S3'], START_SEARCH = ['H0', 'H1', 'H2', 'H3'];
  const CARD_W = 116, CARD_H = 162;
  // Shared with the deck: each animation slide carries the same title.
  const TITLES = {
    stream: 'A Simple Animation of a Stream Cipher',
    worked: 'Daniels’ Cipher: Breakdown',            // the whole example; the deck shows it as the three parts below
    // the first two name the deck size (Scott's father, 2026-10-06); the states slide is his too
    worked1: 'Daniels’ Cipher Breakdown at 4 Deck Size: First Round',
    worked2: 'Daniels’ Cipher Breakdown at 4 Deck Size: Second Round',
    states: 'Daniels’ Cipher Breakdown: Two Rounds, Two States',
    worked3: 'Daniels’ Cipher Breakdown: Encryption and Decryption',
    loops: 'Each State Lands in a Cycle',
    scope: '11 of 18 Configurations Analyzed',      // 18 = the 4 + 6 + 8 possible rotations (Scott's father, 2026-10-06)
    growth: 'States per Deck Size – Explosive Growth',
    shares: 'A few giant cycles hold almost every state',
    rotation: 'Rotation’s Impact on Cycle Size',
    analysis: 'Rotation Analysis at 8 Deck Size',
    keys: 'How a Key Picks Its Cycle',
    land: 'Where all 256 keys land',
    weak: 'Weak keys: rare, but the worst case is catastrophic',
  };
  const GAP = '    ';           // SVG collapses ordinary runs of spaces

  // ------------------------------------------------------------ shared pieces
  function chrome(S) {
    S.add('capBar', 'rect', {}, { x: 72, y: 752, w: 1776, h: 154, rx: 14, fill: '#F3F3F3', sw: 0, z: -5 });
    S.add('capHead', 'text', { size: 31, weight: 700 }, { x: 106, y: 800, z: 5 });
    S.add('capBody', 'text', { size: 26, lh: 1.32 }, { x: 106, y: 843, fill: '#333333', z: 5 });
  }
  function cap(s, head, body) { s.capHead.content = head; s.capBody.content = body || ''; }
  // Which configuration a slide shows, top right. The cycles slide's tag, also on the two key slides, whose four
  // cycles are the same 4-card example (Scott, 2026-10-05).
  function cfgTag(S) {
    S.add('cfgTag', 'rect', {}, { x: 1394, y: 18, w: 454, h: 52, rx: 26, fill: '#F3F3F3', sw: 0 });
    S.add('cfgTxt', 'text', { size: 22, weight: 700, anchor: 'middle' }, { x: 1621, y: 53, content: `${N} cards per deck · rotation r = ${ROT}` });
  }

  // Cycle data for deck 4, rotation 3. The largest loop starts at the worked
  // example's first boundary state (code 254) so "State 1" sits at 12 o'clock.
  let _loops = null;
  function loopData() {
    if (_loops) return _loops;
    const nxt = C.successorMap(N, ROT);
    const cyc = C.cycles(nxt);
    const i254 = cyc[0].indexOf(254);
    cyc[0] = cyc[0].slice(i254).concat(cyc[0].slice(0, i254));
    const where = {};
    cyc.forEach((c, ci) => c.forEach((code, k) => { where[code] = { ci, k }; }));
    const keys = C.allKeys(N).map((key) => ({ key, code: C.firstBoundaryCode(key, N, ROT) }));
    _loops = { nxt, cyc, where, keys };
    return _loops;
  }

  // Ring geometry shared by the loops and keys-landing scenes.
  const RING_SPEC = [{ cx: 560, cy: 392 }, { cx: 1180, cy: 392 }, { cx: 1420, cy: 300 }, { cx: 1420, cy: 482 }];
  function ringGeo(cyc, spacing) {
    return cyc.map((c, i) => {
      const r = Math.max(28, (c.length * (spacing || 5.2)) / (2 * Math.PI));
      const { cx, cy } = RING_SPEC[i];
      return { cx, cy, r, len: c.length,
        at: (k, extra) => {
          const a = -Math.PI / 2 + (2 * Math.PI * k) / c.length, rr = r + (extra || 0);
          return { x: cx + rr * Math.cos(a), y: cy + rr * Math.sin(a), a };
        } };
    });
  }

  // Two small decks of four, stacked as at the start of the worked example (top card in front, the rest peeking out
  // up and to the right): spades on the left, hearts on the right, centred on (cx, cy). Returns the card ids.
  function miniDecks(S, pre, cx, cy, sc) {
    const d = 6, span = CARD_W * sc + 3 * d, ids = [];
    ['S', 'H'].forEach((su, j) => {
      const mx = cx + (j ? 1 : -1) * (span + 36) / 2;                  // the middle of this stack
      for (let k = 0; k < 4; k++) {
        const x = mx + (k - 1.5) * d, y = cy - (k - 1.5) * d;           // card k's centre; k = 0 is the top card
        S.add(pre + su + k, 'card', { suit: su, v: k, w: CARD_W, h: CARD_H }, { x: x - CARD_W / 2, y: y - CARD_H / 2, s: sc, o: 0, z: 6 - k });
        ids.push(pre + su + k);
      }
    });
    return ids;
  }

  // ---- Agent Alice and Agent Bob as people: a white face with a black outline; Agent Alice with hair to her shoulders
  // and a cardinal top, Agent Bob with short hair and a charcoal top. The wire draws them full size above their panels.
  const AGENT_BODY = 'M -46 64 C -46 27 -26 15 0 15 C 26 15 46 27 46 64 Z';
  const AGENT_HAIR = { long: 'M -31 -12 C -33 -62 33 -62 31 -12 L 33 22 C 20 29 -20 29 -33 22 Z',
    short: 'M -25 -15 C -27 -50 27 -50 25 -15 C 19 -28 -11 -33 -25 -15 Z' };
  // The same people, small, beside the message rows of slides 6 and 12 (Scott, 2026-10-06): Agent Alice ('A') by "what
  // Agent Alice wants to say", Agent Bob ('B') by "what reaches Agent Bob". Centred on cx, shoulders ending at foot,
  // scaled by sc; added hidden. Returns the ids.
  const BADGE = { cx: 100, sc: 0.6, indent: 67 };   // the row's words move right by indent to clear the figure
  function agentBadge(S, pre, who, foot) {
    const long = who === 'A', sc = BADGE.sc, cy = foot - 64 * sc, ids = [];
    const add = (k, kind, cfg, st) => { ids.push(pre + k); S.add(pre + k, kind, cfg, Object.assign({ x: BADGE.cx, y: cy, s: sc, o: 0 }, st)); };
    if (long) add('Hair', 'path', { d: AGENT_HAIR.long }, { fill: INK, sw: 0 });
    add('Body', 'path', { d: AGENT_BODY }, { fill: long ? RED : CHAR, sw: 0 });
    add('Face', 'dot', {}, { y: cy + (long ? -13 : -15) * sc, r: long ? 20 : 23, fill: '#FFFFFF', stroke: INK, sw: 3 * sc });
    if (!long) add('Hair', 'path', { d: AGENT_HAIR.short }, { fill: INK, sw: 0 });
    return ids;
  }

  // ---- the packet on the wire, shared by the stream-cipher slide and the end of the worked example so the two
  // pictures match: Agent Alice sends, Agent Bob receives, and Eve, the eavesdropper tapping the line, keeps a useless copy.
  // Adds every object (ids start with pre), so call it before the scene's first step; returns the ids and play(hide),
  // which appends the beats. hide(s) clears the caller's own picture in the beat where the agents and the wire appear.
  function wire(S, pre, letters, copy, received) {
    const WHITE = '#FFFFFF', ids = [];
    const add = (k, kind, cfg, st) => { ids.push(pre + k); S.add(pre + k, kind, cfg, st); };
    // Each agent is drawn as a person above their panel, level with Eve's eye and in its style (white face, black
    // outline): Agent Alice with hair to her shoulders and a cardinal top, Agent Bob with short hair and a charcoal one.
    const BODY = AGENT_BODY, HAIR = AGENT_HAIR;
    const person = (k, cx, cy, col, long) => {
      if (long) add(k + 'Hair', 'path', { d: HAIR.long }, { x: cx, y: cy, fill: INK, sw: 0, o: 0 });
      add(k + 'Body', 'path', { d: BODY }, { x: cx, y: cy, fill: col, sw: 0, o: 0 });
      add(k + 'Face', 'dot', {}, { x: cx, y: cy + (long ? -13 : -15), r: long ? 20 : 23, fill: WHITE, stroke: INK, sw: 3, o: 0 });
      if (!long) add(k + 'Hair', 'path', { d: HAIR.short }, { x: cx, y: cy, fill: INK, sw: 0, o: 0 });
    };
    const agent = (k, x, title, sub, col, long) => {
      person(k, x + 150, 170, col, long);
      add(k + 'P', 'rect', {}, { x, y: 250, w: 300, h: 230, rx: 18, fill: '#F3F3F3', sw: 0, o: 0 });
      add(k + 'T', 'text', { size: 28, weight: 700, anchor: 'middle', ls: 2 }, { x: x + 150, y: 300, content: title, o: 0 });
      add(k + 'S', 'text', { size: 21, anchor: 'middle' }, { x: x + 150, y: 332, content: sub, fill: GREY, o: 0 });
      ids.push(...miniDecks(S, pre + k + 'd', x + 150, 412, 0.4));      // the two decks, arranged by the key
    };
    agent('A', 110, 'AGENT ALICE', 'sends · holds the key', RED, true);
    agent('B', 1510, 'AGENT BOB', 'receives · same key', CHAR, false);
    add('Line', 'rect', {}, { x: 410, y: 357, w: 1100, h: 6, rx: 3, fill: CHAR, sw: 0, o: 0, z: 1 });
    add('LineS', 'text', { size: 21, anchor: 'middle' }, { x: 960, y: 422, content: 'the wire: radio, courier, any channel', fill: GREY, o: 0 });
    const setting = ids.slice();                                        // the two agents and the wire
    add('EyeT', 'text', { size: 24, weight: 700, anchor: 'middle', ls: 1.5 }, { x: 960, y: 88, content: 'EVE', o: 0 });
    add('EyeS', 'text', { size: 20, anchor: 'middle' }, { x: 960, y: 116, content: 'eavesdropper · tapping the line', fill: GREY, o: 0 });
    add('EyeO', 'path', { d: 'M -64 0 Q 0 -50 64 0 Q 0 50 -64 0 Z' }, { x: 960, y: 182, stroke: INK, sw: 4, fill: WHITE, o: 0 });
    add('EyeI', 'dot', {}, { x: 960, y: 192, r: 22, fill: INK, o: 0 });
    add('EyeP', 'dot', {}, { x: 953, y: 185, r: 6, fill: WHITE, o: 0 });
    add('Tap', 'path', { d: 'M 0 0 L 0 118', dash: '7 6' }, { x: 960, y: 236, stroke: GREY, sw: 3, o: 0 });
    const eye = ids.slice(setting.length);
    const PK = { w: 60 + 40 * letters.length, h: 64 }, label = letters.split('').join(' ');
    const LBL = { size: 36, weight: 700, anchor: 'middle', family: root.Anim.SERIF, ls: 4 };
    add('Gh', 'rect', {}, { x: 960 - PK.w / 2, y: 360 - PK.h / 2, w: PK.w, h: PK.h, rx: 12, fill: '#8A8A8A', sw: 0, o: 0, z: 9 });
    add('GhL', 'text', LBL, { x: 960, y: 373, content: label, fill: WHITE, o: 0, z: 9 });
    add('GhS', 'text', { size: 20, italic: true, anchor: 'middle' }, { x: 1205, y: 246, content: copy, fill: GREY, o: 0 });
    add('Pk', 'rect', {}, { x: 570 - PK.w / 2, y: 360 - PK.h / 2, w: PK.w, h: PK.h, rx: 12, fill: INK, sw: 0, o: 0, z: 10 });
    add('PkL', 'text', LBL, { x: 570, y: 373, content: label, fill: WHITE, o: 0, z: 10 });
    add('Rcv', 'text', { size: 22, anchor: 'middle' }, { x: 1660, y: 522, content: received, o: 0 });
    const to = (s, k, cx, cy) => { s[pre + k].x = cx - PK.w / 2; s[pre + k].y = cy - PK.h / 2; s[pre + k + 'L'].x = cx; s[pre + k + 'L'].y = cy + 13; };
    const show = (s, keys) => keys.forEach((k) => { s[pre + k].o = 1; });
    return {
      ids,
      play(hide) {
        S.beat(0.7, (s) => { hide(s); setting.forEach((k) => { s[k].o = 1; }); });
        S.beat(0.5, (s) => { eye.forEach((k) => { s[k].o = 1; }); });
        S.beat(0.4, (s) => show(s, ['Pk', 'PkL']));
        S.beat(1.3, (s) => to(s, 'Pk', 960, 360));                                        // along the wire to the tap
        S.beat(0.8, (s) => { to(s, 'Gh', 1205, 182); show(s, ['Gh', 'GhL', 'GhS']); });   // Eve's copy
        S.beat(0.45, (s) => {                                                             // and she turns to look at it
          Object.assign(s[pre + 'EyeI'], { x: 978, y: 182 }); Object.assign(s[pre + 'EyeP'], { x: 971, y: 175 });
        });
        S.beat(1.3, (s) => to(s, 'Pk', 1350, 360));                                       // on to Agent Bob
        S.beat(0.4, (s) => show(s, ['Rcv']));
      },
    };
  }

  // A run of a scene's steps as a scene of its own, sharing its objects, so one animation can span several slides:
  // each slice starts exactly where the one before it stopped.
  function sliceScene(full, name, title, from, to) {
    const S = new Scene(name, title, full.w, full.h);
    Object.assign(S, { objs: full.objs, byId: full.byId, pace: full.pace, base: full.stepStart(from), steps: full.steps.slice(from, to) });
    S.snap = S.stepEnd(S.steps.length - 1);
    return S;
  }

  // ================================================================ stream
  // What a stream cipher does, before any cards, told through Agent Alice and Agent Bob: Alice's message, the
  // secret stream, what is sent (all Eve, the eavesdropper, sees), the trip across the wire, and back to the message at
  // Bob; then the critical detail. Each shift is shown as the letter counting forward (or back), so wrapping past Z is visible.
  function stream() {
    const S = new Scene('stream', TITLES.stream);
    chrome(S);
    const SERIF = root.Anim.SERIF, WHITE = '#FFFFFF', EDGE = '#CFCFCF', PANEL = '#F3F3F3';
    const MSG = 'ATTACK', KS = [3, 14, 7, 0, 21, 9];
    const letter = (k) => String.fromCharCode(65 + (((k % 26) + 26) % 26));
    const num = (ch) => ch.charCodeAt(0) - 65;
    const CT = MSG.split('').map((m, i) => letter(num(m) + KS[i]));       // D H A A X T
    const TW = 104, TX = 470, RY = { a: 64, b: 254, c: 444 };
    const tx = (i) => TX + i * 124;
    const MX = 1400, MY = 330;                                            // numbers leave from inside the machine

    const rowLabel = (key, y, title, sub, indent) => {
      S.add(key + 'T', 'text', { size: 27, weight: 700, ls: 1.5 }, { x: 72 + (indent || 0), y: y + 50, content: title, o: 0 });
      S.add(key + 'S', 'text', { size: 21 }, { x: 72 + (indent || 0), y: y + 82, content: sub, fill: GREY, o: 0 });
    };
    rowLabel('rowA', RY.a, 'MESSAGE', 'what Agent Alice wants to say', BADGE.indent);
    // Agent Alice beside her message; Agent Bob takes her place when the row becomes what reaches him
    const AV_A = agentBadge(S, 'avA', 'A', RY.a + 87), AV_B = agentBadge(S, 'avB', 'B', RY.a + 87);
    rowLabel('rowB', RY.b, '+ SECRET STREAM', 'example numbers, one per letter');   // made up, not the cipher's (2026-10-05)
    rowLabel('rowC', RY.c, '= WHAT IS SENT', 'each letter shifted forward');

    // a: the message · b: the stream · c: what is sent (later moves up as what arrives) · d: recovered
    const LETTER = { size: 54, weight: 700, anchor: 'middle', family: SERIF };
    for (let i = 0; i < 6; i++) {
      const cx = tx(i) + TW / 2;
      S.add('aT' + i, 'rect', {}, { x: tx(i), y: RY.a, w: TW, h: TW, rx: 12, fill: WHITE, stroke: EDGE, sw: 2, o: 0 });
      S.add('aL' + i, 'text', LETTER, { x: cx, y: RY.a + 72, content: MSG[i], o: 0 });
      S.add('bT' + i, 'rect', {}, { x: tx(i), y: RY.b, w: TW, h: TW, rx: 12, fill: PANEL, stroke: EDGE, sw: 2, o: 0 });
      S.add('bN' + i, 'text', { size: 46, weight: 700, anchor: 'middle', family: SERIF }, { x: MX, y: MY, content: String(KS[i]), fill: RED, o: 0, z: 20 });
      S.add('cT' + i, 'rect', {}, { x: tx(i), y: RY.c, w: TW, h: TW, rx: 12, fill: WHITE, stroke: GOLD, sw: 4, o: 0, z: 1 });
      S.add('cL' + i, 'text', LETTER, { x: cx, y: RY.c + 72, content: MSG[i], o: 0, z: 2 });
      S.add('dT' + i, 'rect', {}, { x: tx(i), y: RY.c, w: TW, h: TW, rx: 12, fill: WHITE, stroke: GOLD, sw: 4, o: 0 });
      S.add('dL' + i, 'text', LETTER, { x: cx, y: RY.c + 72, content: CT[i], o: 0 });
    }

    // the key and the stream cipher (in this project, two decks of cards)
    S.add('keyT', 'rect', {}, { x: 1470, y: 64, w: 100, h: 72, rx: 12, fill: GOLD, sw: 0, o: 0 });
    S.add('keyL', 'text', { size: 28, weight: 700, anchor: 'middle', ls: 2 }, { x: 1520, y: 111, content: 'KEY', o: 0 });
    S.add('keyS', 'text', { size: 21 }, { x: 1592, y: 108, content: 'shared in advance', fill: GREY, o: 0 });
    S.add('keyA', 'arrow', {}, { x: 1520, y: 142, x2: 1520, y2: 208, draw: 0, stroke: CHAR, sw: 4, head: 16 });
    S.add('machGlow', 'rect', {}, { x: 1322, y: 206, w: 396, h: 200, rx: 22, fill: WHITE, fo: 0, stroke: GOLD, sw: 8, o: 0, z: -1 });
    S.add('mach', 'rect', {}, { x: 1330, y: 214, w: 380, h: 184, rx: 18, fill: WHITE, stroke: CHAR, sw: 3, o: 0 });
    S.add('machT', 'text', { size: 25, weight: 700, anchor: 'middle', ls: 2 }, { x: 1520, y: 258, content: 'STREAM CIPHER', o: 0 });
    const MC = miniDecks(S, 'mc', 1520, 314, 0.42);                       // two decks of four, stacked
    S.add('machS', 'text', { size: 20, anchor: 'middle' }, { x: 1520, y: 384, content: 'here: two decks of cards', fill: GREY, o: 0 });
    S.add('outA', 'arrow', {}, { x: 1324, y: 306, x2: 1210, y2: 306, draw: 0, stroke: CHAR, sw: 4, head: 16 });
    const MACHINE = ['keyT', 'keyL', 'keyS', 'keyA', 'mach', 'machT', 'machS', 'outA'].concat(MC);

    // Eve, the eavesdropper
    const EX = 1400, EY = RY.c + 52;
    S.add('eyeO', 'path', { d: 'M -64 0 Q 0 -50 64 0 Q 0 50 -64 0 Z' }, { x: EX, y: EY, stroke: INK, sw: 4, fill: WHITE, o: 0 });
    S.add('eyeI', 'dot', {}, { x: EX - 8, y: EY, r: 22, fill: INK, o: 0 });
    S.add('eyeP', 'dot', {}, { x: EX - 15, y: EY - 7, r: 6, fill: WHITE, o: 0 });
    S.add('eyeA', 'arrow', {}, { x: EX - 76, y: EY, x2: 1212, y2: EY, draw: 0, stroke: GOLD_D, sw: 4, head: 16 });
    S.add('eyeT', 'text', { size: 25, weight: 700, ls: 1.5 }, { x: EX + 84, y: EY - 8, content: 'EVE', o: 0 });
    S.add('eyeS', 'text', { size: 21 }, { x: EX + 84, y: EY + 24, content: 'eavesdropper · sees only these letters', fill: GREY, o: 0 });
    const EYE = ['eyeO', 'eyeI', 'eyeP', 'eyeA', 'eyeT', 'eyeS'];

    S.add('okL', 'text', { size: 27, weight: 700 }, { x: 1226, y: RY.c + 62, content: '✓ the message, exactly', fill: RED, o: 0 });

    // the packet on the wire between Agent Alice and Agent Bob
    const net = wire(S, 'w', CT.join(''), 'Eve’s copy: unreadable without the stream', 'received: the same six letters');

    // the critical detail
    S.add('ruleP', 'rect', {}, { x: 1280, y: 64, w: 568, h: 484, rx: 18, fill: PANEL, sw: 0, o: 0, z: 5 });
    S.add('ruleH', 'text', { size: 24, weight: 700, ls: 2 }, { x: 1320, y: 124, content: 'CRITICAL DETAIL', fill: RED, o: 0, z: 6 });
    S.add('ruleB', 'text', { size: 46, weight: 700, lh: 1.12 }, { x: 1320, y: 196, content: 'The stream must\nnever repeat in use.', o: 0, z: 6 });
    S.add('ruleS', 'text', { size: 24, lh: 1.3 }, { x: 1320, y: 334, content: 'If two messages ever share a\nstretch of stream, lining them up\ncancels the stream out.', fill: '#333333', o: 0, z: 6 });
    S.add('ruleQ', 'text', { size: 24, weight: 700, lh: 1.3 }, { x: 1320, y: 476, content: 'So: how long does this cipher’s\nstream run before it repeats?', fill: RED, o: 0, z: 6 });

    // Shift column i forward (dir 1, into row c) or back (dir -1, into the recovered row): light
    // the letter and its number, count the letter along one alphabet step per hop, then settle it.
    function shift(i, dir, hop, fast) {
      const enc = dir > 0, src = enc ? 'aT' + i : 'cT' + i, from = enc ? MSG[i] : CT[i];
      const T = (enc ? 'cT' : 'dT') + i, L = (enc ? 'cL' : 'dL') + i;
      S.beat(fast ? 0.12 : 0.3, (s) => {
        s[src].stroke = GOLD; s[src].sw = 5; s['bT' + i].stroke = GOLD; s['bT' + i].sw = 5;
        s[T].o = 1; s[L].o = 1; s[L].content = from;
      });
      for (let k = 1; k <= KS[i]; k++) S.beat(hop, (s) => { s[L].content = letter(num(from) + dir * k); });
      if (!KS[i]) S.hold(fast ? 0.3 : 0.5);
      S.beat(fast ? 0.2 : 0.35, (s) => {
        if (enc) { s[T].fill = INK; s[T].stroke = INK; s[T].sw = 2; s[L].fill = WHITE; } else { s[T].stroke = EDGE; s[T].sw = 2; }
        if (enc) { s[src].stroke = EDGE; s[src].sw = 2; } else { s[src].stroke = INK; s[src].sw = 2; }
        s['bT' + i].stroke = EDGE; s['bT' + i].sw = 2;
      });
    }
    // The stream's numbers fly out of the machine to their tiles, in stream order.
    function emit(dur) {
      S.beat(dur, (s) => { for (let i = 0; i < 6; i++) { s['bN' + i].x = tx(i) + TW / 2; s['bN' + i].y = RY.b + 70; s['bN' + i].o = 1; } },
        (id) => { const m = id.match(/^bN(\d)$/); if (!m) return null; const a = +m[1] * 0.12; return { w: [a, a + 0.4], arc: 50 }; });
    }

    // ---- step 0: the message
    S.step({ say: 'Here is all the cryptography you need for this talk, in one picture. Two agents need to talk in secret: Agent Alice and Agent Bob. Agent Alice starts with a message: ATTACK.' });
    S.beat(0.45, (s) => { cap(s, 'Agent Alice starts with a message', 'This is what Agent Alice wants to tell Agent Bob, and what nobody else should be able to read.'); s.rowAT.o = 1; s.rowAS.o = 1; AV_A.forEach((k) => { s[k].o = 1; }); });
    S.beat(1.0, (s) => { for (let i = 0; i < 6; i++) { s['aT' + i].o = 1; s['aL' + i].o = 1; } },
      (id) => { const m = id.match(/^a[TL](\d)$/); return m ? { w: [+m[1] * 0.1, +m[1] * 0.1 + 0.5] } : null; });
    S.hold(0.3);

    // ---- step 1: the key makes the stream
    S.step({ say: 'A stream cipher turns a short key into a long stream of secret numbers, one for each letter. These six are just an example; in this project the numbers come from shuffling two decks of cards, as part two shows. Agent Alice and Agent Bob hold the same key, so both can make the same stream.' });
    S.beat(0.45, (s) => cap(s, 'The key makes a secret stream of numbers',
      'A stream cipher turns a short key into a long stream of secret numbers, one per letter. These six are an example.\nIn this project they come from shuffling two decks of cards. Agent Alice and Agent Bob hold the same key, so both make the same stream.'));
    S.beat(0.6, (s) => { MACHINE.forEach((k) => { if (k !== 'keyA' && k !== 'outA') s[k].o = 1; }); });
    S.beat(0.45, (s) => { s.keyA.draw = 1; });
    S.beat(0.35, (s) => { s.machGlow.o = 1; s.outA.draw = 1; s.rowBT.o = 1; s.rowBS.o = 1; for (let i = 0; i < 6; i++) s['bT' + i].o = 1; });
    emit(2.2);
    S.beat(0.3, (s) => { s.machGlow.o = 0; });

    // ---- step 2: encrypt the first letter, slowly
    S.step({ say: 'To encrypt, Agent Alice shifts each letter forward by its number. A, shifted forward three: B, C, D. So A becomes D.' });
    S.beat(0.45, (s) => { cap(s, 'Agent Alice encrypts: shift each letter forward by its number', 'A shifted forward 3 letters: B, C, D. So A becomes D.'); s.rowCT.o = 1; s.rowCS.o = 1; });
    shift(0, 1, 0.42, false);
    S.hold(0.3);

    // ---- step 3: the rest, with the wrap past Z
    S.step({ say: 'T, shifted forward fourteen, runs off the end of the alphabet, so it wraps from Z back around to A and lands on H. The rest work the same way, each with its own number.' });
    S.beat(0.45, (s) => cap(s, 'Every letter shifts by its own number, wrapping Z back to A',
      'T + 14: U V W X Y Z A B C D E F G H, so T becomes H.\nThen T + 7 = A, A + 0 = A, C + 21 = X and K + 9 = T.'));
    shift(1, 1, 0.13, false);
    for (let i = 2; i < 6; i++) shift(i, 1, 0.05, true);
    S.hold(0.3);

    // ---- step 4: Eve, the eavesdropper, sees only what Agent Alice sends
    S.step({ say: 'This is what Agent Alice actually sends, and all that Eve, the eavesdropper, ever sees: D, H, A, A, X, T. Without the stream it means nothing. Notice the two Ts in ATTACK came out as different letters, so even a repeated letter leaves no pattern.' });
    S.beat(0.45, (s) => cap(s, 'Eve, the eavesdropper, sees only what Agent Alice sends',
      'Without the stream, DHAAXT says nothing. The two Ts in ATTACK became different letters, H and A,\nso even a repeated letter leaves no pattern to work from.'));
    S.beat(0.7, (s) => {
      for (let i = 0; i < 6; i++) { s['aT' + i].o = 0.2; s['aL' + i].o = 0.2; s['bT' + i].o = 0.2; s['bN' + i].o = 0.2; }
      ['rowAT', 'rowAS', 'rowBT', 'rowBS'].concat(MACHINE, AV_A).forEach((k) => { s[k].o = 0.2; });
    });
    S.beat(0.5, (s) => { s.eyeO.o = 1; s.eyeI.o = 1; s.eyeP.o = 1; });
    S.beat(0.5, (s) => { s.eyeA.draw = 1; s.eyeT.o = 1; s.eyeS.o = 1; for (let i = 0; i < 6; i++) { s['cT' + i].stroke = GOLD; s['cT' + i].sw = 5; } });
    S.hold(0.3);

    // ---- step 5: the packet crosses the wire between the two agents
    S.step({ say: 'Now follow those six letters from Agent Alice to Agent Bob, across a wire, a radio or a courier: any channel. Eve, tapping the line, can copy every letter, but without the secret stream, D H A A X T says nothing. Agent Bob receives exactly the same six letters.' });
    S.beat(0.45, (s) => cap(s, 'The packet crosses the wire from Agent Alice to Agent Bob',
      'Agent Alice sends only DHAAXT. Eve, tapping the line, can copy it, but without the stream it says nothing.\nAgent Bob receives exactly the same six letters.'));
    net.play((s) => {
      ['rowAT', 'rowAS', 'rowBT', 'rowBS', 'rowCT', 'rowCS'].concat(MACHINE, EYE, AV_A).forEach((k) => { s[k].o = 0; });
      for (let i = 0; i < 6; i++) ['aT', 'aL', 'bT', 'bN', 'cT', 'cL'].forEach((p) => { s[p + i].o = 0; });
    });
    S.hold(0.3);

    // ---- step 6: Agent Bob makes the same stream
    S.step({ say: 'At the other end, Agent Bob has the same key, so they can make exactly the same stream of numbers.' });
    S.beat(0.45, (s) => cap(s, 'Agent Bob has the same key, so they make the same stream',
      'Only the letters travel. Agent Bob runs the same stream cipher from the same key and gets the same numbers: 3 14 7 0 21 9.'));
    S.beat(0.6, (s) => {
      EYE.concat(net.ids).forEach((k) => { s[k].o = 0; });
      for (let i = 0; i < 6; i++) { s['aT' + i].o = 0; s['aL' + i].o = 0; s['bN' + i].o = 0; s['cT' + i].stroke = INK; s['cT' + i].sw = 2; }
      ['rowAT', 'rowAS', 'rowBT', 'rowBS', 'rowCT', 'rowCS'].forEach((k) => { s[k].o = 0; });
    });
    S.beat(0.9, (s) => {                                    // what arrives takes the top row
      for (let i = 0; i < 6; i++) { s['cT' + i].y = RY.a; s['cL' + i].y = RY.a + 72; s['cT' + i].o = 1; s['cL' + i].o = 1; }
      s.rowAT.content = 'RECEIVED'; s.rowAS.content = 'what reaches Agent Bob'; s.rowAT.o = 1; s.rowAS.o = 1;
      AV_B.forEach((k) => { s[k].o = 1; });
    });
    S.beat(0.02, (s) => { for (let i = 0; i < 6; i++) { s['bN' + i].x = MX; s['bN' + i].y = MY; } });   // back inside, unseen
    S.beat(0.5, (s) => {
      MACHINE.forEach((k) => { s[k].o = 1; });
      s.keyS.content = 'the same key'; s.machGlow.o = 1;
      s.rowBT.content = '− SAME STREAM'; s.rowBS.content = 'from the same key'; s.rowBT.o = 1; s.rowBS.o = 1;
      for (let i = 0; i < 6; i++) s['bT' + i].o = 1;
    });
    emit(2.0);
    S.beat(0.3, (s) => { s.machGlow.o = 0; });

    // ---- step 7: shift back, and the message returns
    S.step({ say: 'Then Agent Bob shifts each letter back by its number. D back three: C, B, A. H back fourteen wraps from A around to Z and lands on T. Every letter comes back, and so does the message: ATTACK.' });
    S.beat(0.45, (s) => {
      cap(s, 'Agent Bob decrypts: shift each letter back by the same number',
        'D back 3: C, B, A. H back 14: G F E D C B A Z Y X W V U T, wrapping from A around to Z.\nEvery letter comes back, so the message comes back exactly.');
      s.rowCT.content = '= MESSAGE'; s.rowCS.content = 'each letter shifted back'; s.rowCT.o = 1; s.rowCS.o = 1;
    });
    shift(0, -1, 0.3, false);
    shift(1, -1, 0.1, false);
    for (let i = 2; i < 6; i++) shift(i, -1, 0.04, true);
    S.beat(0.5, (s) => { s.okL.o = 1; });
    S.hold(0.3);

    // ---- step 8: the critical detail
    S.step({ say: 'There is one critical detail that matters for everything after this: the stream must never repeat while it is in use. If two messages are ever encrypted with the same stretch of stream, Eve can line them up and the stream cancels out. A machine with a limited number of arrangements has to repeat eventually, so the question this whole project answers is: how long does this cipher’s stream run before it repeats, and are there keys for which it repeats early?' });
    S.beat(0.45, (s) => cap(s, 'Critical Detail: the secret stream must never repeat in use',
      'A repeated stretch lets Eve line two messages up and cancel the stream out.\nSo: how long does this cipher’s stream run before it repeats, and for which keys does it repeat early?'));
    S.beat(0.6, (s) => { MACHINE.concat(['okL']).forEach((k) => { s[k].o = 0; }); });
    S.beat(0.6, (s) => { s.ruleP.o = 1; s.ruleH.o = 1; });
    S.beat(0.6, (s) => { s.ruleB.o = 1; for (let i = 0; i < 6; i++) { s['bT' + i].stroke = RED; s['bT' + i].sw = 4; } });
    S.beat(0.6, (s) => { s.ruleS.o = 1; s.ruleQ.o = 1; });
    S.hold(0.3);
    return S;
  }

  // ================================================================ worked
  function worked() {
    const S = new Scene('worked', TITLES.worked);
    S.pace = 1.3;                 // one click per movement, played a little slower, so each can be talked through
    S.cuts = [];                  // where the second and third slides begin (see workedPart)
    const X0 = 420, P = 136, Y = { drive: 50, search: 292, discard: 530 };
    const sx = (i) => X0 + i * P;
    const PILE_X = [1062, 1212];

    // ---- trace first, so every object exists before the timeline starts
    const rounds = [];
    let drive = START_DRIVE.slice(), search = START_SEARCH.slice();
    for (let f = 0; f < 2; f++) {
      const fr = C.fullRound(drive, search, ROT);
      rounds.push({ fr, driveIn: drive, searchIn: search });
      drive = fr.drive; search = fr.search;
    }
    const outputs = [];
    rounds.forEach((r) => r.fr.ops.filter((o) => o.type === 'search').forEach((o) => outputs.push(o.output)));

    // ---- static layout
    chrome(S);
    const rowLabel = (key, title, sub, y) => {
      S.add(key + 'T', 'text', { size: 27, weight: 700, ls: 1.5 }, { x: 72, y, content: title });
      S.add(key + 'S', 'text', { size: 21 }, { x: 72, y: y + 32, content: sub, fill: GREY });
    };
    rowLabel('lblDrive', 'DRIVE DECK', 'spends two cards each turn', Y.drive + 70);
    rowLabel('lblSearch', 'SEARCH DECK', 'gets shuffled; gives the values', Y.search + 70);
    rowLabel('lblDiscard', 'DISCARD PILE', 'spent cards, first one on top', Y.discard + 70);
    ['drive', 'search', 'discard'].forEach((row) => {
      for (let i = 0; i < N; i++) {
        S.add(`slot_${row}${i}`, 'rect', { dash: '9 7' }, { x: sx(i), y: Y[row], w: CARD_W, h: CARD_H, rx: 12,
          fill: '#FFFFFF', fo: 0, stroke: LIGHT, sw: 2, z: -2 });
      }
    });
    // Every deck is a stack fanned out left to right, top card on the left, the same
    // top-to-bottom order the paper writes decks in.
    const ends = { drive: ['top', 'bottom'], search: ['top', 'bottom'], discard: ['top', 'bottom'] };
    Object.keys(ends).forEach((row) => {
      S.add(`end_${row}0`, 'text', { size: 19, anchor: 'middle' }, { x: sx(0) + CARD_W / 2, y: Y[row] + CARD_H + 22, content: ends[row][0], fill: MID });
      S.add(`end_${row}1`, 'text', { size: 19, anchor: 'middle' }, { x: sx(N - 1) + CARD_W / 2, y: Y[row] + CARD_H + 22, content: ends[row][1], fill: MID });
    });
    S.add('opSearch', 'text', { size: 24, weight: 700, ls: 1 }, { x: 72, y: Y.search + 140, content: '', fill: RED });
    S.add('opDiscard', 'text', { size: 24, weight: 700, ls: 1 }, { x: 72, y: Y.discard + 140, content: '', fill: RED });
    S.add('pile0', 'text', { size: 20, anchor: 'middle' }, { x: PILE_X[0] + CARD_W / 2, y: Y.search - 14, content: 'pile 1', fill: GREY, o: 0 });
    S.add('pile1', 'text', { size: 20, anchor: 'middle' }, { x: PILE_X[1] + CARD_W / 2, y: Y.search - 14, content: 'pile 2', fill: GREY, o: 0 });
    // the cards a cut moves: framed in gold and numbered, to match the count card's badge (or the rotation setting)
    S.add('cutBox', 'rect', {}, { x: sx(0) - 9, y: Y.search - 9, w: CARD_W + 18, h: CARD_H + 18, rx: 18, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, o: 0, z: 41 });
    S.add('cutBadge', 'dot', {}, { x: sx(0), y: Y.search, r: 25, fill: GOLD, stroke: '#FFFFFF', sw: 3, o: 0, z: 42 });
    S.add('cutNum', 'text', { size: 30, weight: 700, anchor: 'middle' }, { x: sx(0), y: Y.search + 11, content: '', o: 0, z: 43 });

    // right-hand panel: keystream, progress, card values, rotation
    const KX = 1440, KP = 104, KY = 118, KS = 0.62;
    S.add('ksT', 'text', { size: 26, weight: 700, ls: 2 }, { x: KX, y: 70, content: 'KEYSTREAM' });
    S.add('ksS', 'text', { size: 21 }, { x: KX, y: 100, content: 'the secret number stream', fill: GREY });
    // Each turn's card flies into its slot and becomes its value (Scott, 2026-10-05: values, not outputs): a grey tile
    // holding the number, drawn like the values that later fly down to encrypt HACK.
    const KV = outputs.map((id) => C.val(id));                                     // values 1 2 1 3
    for (let i = 0; i < 4; i++) {
      S.add('ksSlot' + i, 'rect', { dash: '7 6' }, { x: KX + i * KP, y: KY, w: CARD_W * KS, h: CARD_H * KS, rx: 8, fill: '#FFFFFF', fo: 0, stroke: LIGHT, sw: 2, z: -2 });
      S.add('ksTile' + i, 'rect', {}, { x: KX + i * KP, y: KY, w: CARD_W * KS, h: CARD_H * KS, rx: 8, fill: '#F3F3F3', stroke: '#CFCFCF', sw: 2, o: 0, z: -1 });
      S.add('ksN' + i, 'text', { size: 52, weight: 700, anchor: 'middle', family: root.Anim.SERIF },
        { x: KX + i * KP + (CARD_W * KS) / 2, y: KY + 68, content: String(KV[i]), fill: RED, s: 0.5, o: 0, z: 3 });
    }
    S.add('stat1', 'text', { size: 32, weight: 700, ls: 1 }, { x: KX, y: 290, content: '' });
    S.add('stat2', 'text', { size: 25 }, { x: KX, y: 328, content: '', fill: GREY });
    // The card values, counted from zero, one row per rank (Scott, 2026-10-05: "Card values (Zero Indexing)"). A row is
    // framed in gold while a card becomes its value, until the next click.
    const VNAME = ['Ace', 'Two', 'Three', 'Four'], LEG_Y = 452, LEG_P = 36;
    S.add('legT', 'text', { size: 22, weight: 700 }, { x: KX, y: 406, content: 'Card values (Zero Indexing)' });
    for (let v = 0; v < N; v++) {
      S.add('legRow' + v, 'text', { size: 24 }, { x: KX, y: LEG_Y + v * LEG_P, content: `${VNAME[v]} of a suit = ${v}` });
      S.add('legBox' + v, 'rect', {}, { x: KX - 12, y: LEG_Y + v * LEG_P - 27, w: 272, h: 36, rx: 8, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 4, o: 0, z: -1 });
    }
    const legOff = (s) => { for (let v = 0; v < N; v++) s['legBox' + v].o = 0; };
    S.add('rotT', 'text', { size: 22, weight: 700 }, { x: KX, y: 630, content: 'Rotation setting' });
    S.add('rotV', 'text', { size: 24 }, { x: KX, y: 666, content: 'r = 3' });
    // lit in gold at each round's end, to show where the rotation's 3 comes from
    S.add('rotBox', 'rect', {}, { x: KX - 18, y: 596, w: 236, h: 92, rx: 14, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, o: 0, z: -1 });

    // state outline, drawn at round boundaries
    S.add('stateBox', 'rect', {}, { x: 398, y: 30, w: 562, h: 460, rx: 18, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, o: 0, z: -1 });
    S.add('stateTab', 'rect', {}, { x: 398, y: 8, w: 160, h: 44, rx: 10, fill: GOLD, sw: 0, o: 0, z: 1 });
    S.add('stateTxt', 'text', { size: 23, weight: 700, anchor: 'middle', ls: 1.5 }, { x: 478, y: 38, content: 'STATE 1', o: 0, z: 2 });

    // cards, plus a ghost copy of each turn's card that flies to the keystream and becomes its value
    // Each deck starts as a stack in its row's top slot, top card in front and the cards beneath it peeking
    // out up and to the right, so the audience can see it is a pile of four before it is fanned out.
    const STACK = 10, stackAt = (k, row) => ({ x: sx(0) + k * STACK, y: Y[row] - k * STACK });
    START_DRIVE.forEach((id, i) => S.add(id, 'card', { suit: 'S', v: C.val(id), w: CARD_W, h: CARD_H }, { x: stackAt(i, 'drive').x, y: stackAt(i, 'drive').y - 40, o: 0, z: 20 - i }));
    START_SEARCH.forEach((id, i) => S.add(id, 'card', { suit: 'H', v: C.val(id), w: CARD_W, h: CARD_H }, { x: stackAt(i, 'search').x, y: stackAt(i, 'search').y - 40, o: 0, z: 20 - i }));
    outputs.forEach((id, i) => S.add('ks' + i, 'card', { suit: id[0], v: C.val(id), w: CARD_W, h: CARD_H }, { x: sx(0), y: Y.search, o: 0, z: 40 }));
    const ksPos = (i) => ({ x: KX + i * KP + (CARD_W * KS) / 2 - CARD_W / 2, y: KY + (CARD_H * KS) / 2 - CARD_H / 2 });

    // the final section: the four values encrypt and decrypt a word, as on the stream-cipher slide
    const WORD = 'HACK';
    const shiftL = (ch, k) => String.fromCharCode(65 + ((((ch.charCodeAt(0) - 65 + k) % 26) + 26) % 26));
    const CIPH = WORD.split('').map((ch, i) => shiftL(ch, KV[i]));                     // I C D N
    // the letter tiles sit 30 px right of the card columns, so the words beside Agent Alice and Agent Bob clear them
    const EY = { a: 64, b: 268, c: 472 }, ET = 116, EDGE = '#CFCFCF', ex = (i) => sx(i) + 30;
    const erow = (key, y, title, sub, indent) => {
      S.add(key + 'T', 'text', { size: 27, weight: 700, ls: 1.5 }, { x: 72 + (indent || 0), y: y + 54, content: title, o: 0 });
      S.add(key + 'S', 'text', { size: 21 }, { x: 72 + (indent || 0), y: y + 86, content: sub, fill: GREY, o: 0 });
    };
    erow('eA', EY.a, 'MESSAGE', 'what Agent Alice wants to say', BADGE.indent);
    // Agent Alice beside her message, then Agent Bob beside what reaches him, as on the stream-cipher slide
    const EV_A = agentBadge(S, 'evA', 'A', EY.a + 91), EV_B = agentBadge(S, 'evB', 'B', EY.a + 91);
    erow('eB', EY.b, '+ KEYSTREAM', 'the four card values');
    erow('eC', EY.c, '= WHAT IS SENT', 'each letter shifted forward');
    const ELET = { size: 58, weight: 700, anchor: 'middle', family: root.Anim.SERIF };
    for (let i = 0; i < 4; i++) {
      const cx = ex(i) + ET / 2;
      S.add('wT' + i, 'rect', {}, { x: ex(i), y: EY.a, w: ET, h: ET, rx: 12, fill: '#FFFFFF', stroke: EDGE, sw: 2, o: 0, z: 50 });
      S.add('wL' + i, 'text', ELET, { x: cx, y: EY.a + 79, content: WORD[i], o: 0, z: 51 });
      S.add('vT' + i, 'rect', {}, { x: ex(i), y: EY.b, w: ET, h: ET, rx: 12, fill: '#F3F3F3', stroke: EDGE, sw: 2, o: 0, z: 50 });
      S.add('vN' + i, 'text', { size: 52, weight: 700, anchor: 'middle', family: root.Anim.SERIF },
        { x: KX + i * KP + (CARD_W * KS) / 2, y: KY + 68, content: String(KV[i]), fill: RED, o: 0, z: 52 });
      S.add('xT' + i, 'rect', {}, { x: ex(i), y: EY.c, w: ET, h: ET, rx: 12, fill: '#FFFFFF', stroke: GOLD, sw: 4, o: 0, z: 50 });
      S.add('xL' + i, 'text', ELET, { x: cx, y: EY.c + 79, content: WORD[i], o: 0, z: 51 });
      S.add('yT' + i, 'rect', {}, { x: ex(i), y: EY.c, w: ET, h: ET, rx: 12, fill: '#FFFFFF', stroke: GOLD, sw: 4, o: 0, z: 50 });
      S.add('yL' + i, 'text', ELET, { x: cx, y: EY.c + 79, content: CIPH[i], o: 0, z: 51 });
    }
    S.add('eOk', 'text', { size: 27, weight: 700 }, { x: ex(4) + 14, y: EY.c + 68, content: '✓ the message, exactly', fill: RED, o: 0 });
    // the packet on the wire: the same picture as on the stream-cipher slide, because this is that stream cipher
    const net = wire(S, 'tw', CIPH.join(''), 'Eve’s copy: unreadable without the keystream', 'received: the same four letters');

    // the states slide (Scott's father, 2026-10-06: a slide on reaching State 1 and State 2): the starting decks, State 1
    // and State 2 as tiles, one round apart, each round with the two values it gave; then the way back to State 1
    const TS = { x: [72, 552, 1032], y: 214 }, TW = 336, TH = 176, TMID = TS.y + TH / 2;
    const ST_IDS = [];
    [[START_DRIVE, START_SEARCH, 'Start'], [rounds[0].fr.drive, rounds[0].fr.search, 'State 1'], [rounds[1].fr.drive, rounds[1].fr.search, 'State 2']]
      .forEach(([dr, se, label], i) => { ST_IDS.push('tsT' + i); S.add('tsT' + i, 'tile', { drive: dr, search: se, label }, { x: TS.x[i], y: TS.y, o: 0, z: 20 }); });
    [1, 2].forEach((f) => {
      const x0 = TS.x[f - 1] + TW + 14, x1 = TS.x[f] - 14, cx = (x0 + x1) / 2;
      S.add('tsA' + f, 'arrow', {}, { x: x0, y: TMID, x2: x1, y2: TMID, draw: 0, stroke: INK, sw: 5, head: 20, z: 19 });
      S.add('tsL' + f, 'text', { size: 25, anchor: 'middle', italic: true }, { x: cx, y: TMID - 22, content: `round ${f}`, fill: GREY, o: 0 });
      S.add('tsV' + f, 'text', { size: 40, weight: 700, anchor: 'middle', family: root.Anim.SERIF }, { x: cx, y: TMID + 62, content: KV.slice(2 * f - 2, 2 * f).join(' '), fill: RED, o: 0 });
      S.add('tsW' + f, 'text', { size: 20, anchor: 'middle' }, { x: cx, y: TMID + 90, content: 'values', fill: GREY, o: 0 });
      ST_IDS.push('tsA' + f, 'tsL' + f, 'tsV' + f, 'tsW' + f);
    });
    // the way back, dashed: from under State 2 round to State 1
    const BK = { x: TS.x[2] + TW / 2, x2: TS.x[1] + TW / 2, y: TS.y + TH + 14 };
    S.add('tsBack', 'path', { d: `M 0 0 C 0 150 ${BK.x2 - BK.x} 150 ${BK.x2 - BK.x} 10`, dash: '12 9' }, { x: BK.x, y: BK.y, stroke: GREY, sw: 4, o: 0, z: 18 });
    S.add('tsBackH', 'path', { d: 'M -11 -9 L 11 0 L -11 9 Z' }, { x: BK.x2, y: BK.y + 4, rot: -90, fill: GREY, sw: 0, o: 0, z: 18 });
    S.add('tsBackL', 'text', { size: 25, anchor: 'middle', italic: true }, { x: (BK.x + BK.x2) / 2, y: BK.y + 160, content: '380 more rounds: State 1 again', fill: GREY, o: 0 });
    ST_IDS.push('tsBack', 'tsBackH', 'tsBackL');

    // ---- helpers that append beats
    const place = (s, deck, row) => deck.forEach((id, i) => { s[id].x = sx(i); s[id].y = Y[row]; });
    // Lift the top c cards and carry them to the bottom. With frame, they are first framed in gold with
    // their number, and the frame travels with them; the caller fades it out (cutDone) afterwards.
    function cutRow(deck, c, row, frame) {
      const moving = deck.slice(0, c), nd = deck.slice(c).concat(moving);
      const bx = sx(0) - 9, by = Y[row] - 9, bw = (c - 1) * P + CARD_W + 18, dx = (N - c) * P;
      const box = (s, x, y) => { if (!frame) return; s.cutBox.x = x; s.cutBox.y = y; s.cutBadge.x = x + bw - 4; s.cutBadge.y = y + 4; s.cutNum.x = x + bw - 4; s.cutNum.y = y + 15; };
      if (frame) {
        S.beat(0.02, (s) => { box(s, bx, by); s.cutBox.w = bw; s.cutNum.content = String(c); });   // placed while still hidden
        S.beat(0.45, (s) => { s.cutBox.o = 1; s.cutBadge.o = 1; s.cutNum.o = 1; });
        S.hold(0.25);
      }
      S.beat(0.35, (s) => { moving.forEach((id) => { s[id].y = Y[row] - 46; s[id].z = 30; }); box(s, bx, by - 46); });
      S.beat(0.85, (s) => { nd.forEach((id, i) => { s[id].x = sx(i); }); box(s, bx + dx, by - 46); });
      S.beat(0.35, (s) => { moving.forEach((id) => { s[id].y = Y[row]; s[id].z = 10; }); box(s, bx + dx, by); });
      return nd;
    }
    const cutDone = (s) => { s.cutBox.o = 0; s.cutBadge.o = 0; s.cutNum.o = 0; };
    const status = (s, a, b) => { s.stat1.content = a; s.stat2.content = b; };

    let ksN = 0;
    const list = (ids) => ids.map(nm).join(' ');

    // A Count Cut, one click per movement: the drive card that sets the count, then the cut.
    function countSteps(op, f, k) {
      const c = op.card, n = op.count, idx = op.discard.length - 1, first = f === 0 && k === 0;
      const opener = f === 1 && k === 0 ? 'Round two runs exactly the same way, starting from the decks we just recorded. ' : '';   // it opens a slide
      S.step({ say: first
        ? 'First move, the Count Cut. Take the bottom card of the Drive Deck, the four of spades. Its value is three, so the Count Cut value is three, and the card goes onto the Discard Pile.'
        : opener + (n === 0 ? `Bottom card of the Drive Deck: the ${nm(c)}. An ace has the value zero, so the Count Cut value is zero.` : `Bottom card: the ${nm(c)}, so the Count Cut value is ${n}.`) });
      // the card's row of the value table lights while its value is used (Scott's father, 2026-10-06), one row at a time
      S.beat(0.45, (s) => {
        cap(s, 'Count Cut: the bottom card of the Drive Deck',
          `${nm(c)} is the bottom card of the Drive Deck, so the Count Cut value is ${n}.\nIt ${idx === 0 ? 'starts the Discard Pile' : 'goes to the bottom of the Discard Pile'}.`);
        status(s, `ROUND ${f + 1}`, `turn ${k + 1} of 2`); legOff(s); s['legBox' + n].o = 1;
        s.stateBox.o = 0; s.stateTab.o = 0; s.stateTxt.o = 0;
        s[c].glow = 1; s[c].badge = 1; s[c].z = 35;
      });
      S.beat(0.75, (s) => { s[c].x = sx(idx); s[c].y = Y.discard; }, (id) => (id === c ? { arc: 30 } : null));
      S.beat(0.3, (s) => { s.opSearch.content = n === 0 ? 'COUNT CUT · 0 (no move)' : `COUNT CUT · ${n}`; s[c].z = 12; });

      S.step({ say: first
        ? 'So cut three cards from the top of the Search Deck to the bottom, in order. That is all a Count Cut is: cutting the deck.'
        : n === 0 ? 'So this Count Cut moves nothing at all. Low cards weaken the shuffle, and that is one of the ways short cycles can happen.' : `Cut ${n}.` });
      S.beat(0.45, (s) => { cap(s,
        n === 0 ? 'Count Cut: a value of 0 moves nothing' : `Count Cut: the top ${n === 1 ? 'card moves' : n + ' search cards move'} to the bottom`,
        n === 0 ? `The Search Deck stays ${list(op.after)}.\nLow cards weaken this step, which is one way short cycles can arise.`
          : `${list(op.before.slice(0, n))} ${n === 1 ? 'lifts off the top and goes' : 'lift off the top and go'} to the bottom, in order.\nThe Search Deck is now ${list(op.after)}.`); legOff(s); });
      if (n > 0) { cutRow(op.before, n, 'search', true); S.hold(0.25); } else S.hold(1.0);
      S.beat(0.35, (s) => { s[c].glow = 0; s[c].badge = 0; s.opSearch.content = ''; cutDone(s); });
    }

    // A Search Cut, one click per movement: the drive card that sets the target, the deal,
    // the rebuild, and the card's value.
    function searchSteps(op, f, k) {
      const t = op.card, idx = op.discard.length - 1, first = f === 0 && k === 0, quick = op.deals.length === 1;
      const found = op.deals[op.deals.length - 1].card;
      const findPile = op.piles[op.foundPile].slice().reverse(), otherPile = op.piles[1 - op.foundPile].slice().reverse();

      S.step({ say: first
        ? 'Second move, the Search Cut. Now the top card of the Drive Deck: the ace of spades. Its value, zero, becomes the target value of the Search Cut: we deal until a card of the same value shows up.'
        : `Top card of the Drive Deck: the ${nm(t)}. Its value, ${op.target}, is the target value.` });
      S.beat(0.45, (s) => {
        cap(s, 'Search Cut: the top card of the Drive Deck',
          `${nm(t)} is the top card of the Drive Deck, and its value, ${op.target}, becomes the target value of the Search Cut.\nIt goes to the bottom of the Discard Pile.`);
        legOff(s); s['legBox' + op.target].o = 1;
        s[t].glow = 1; s[t].badge = 1; s[t].z = 35;
      });
      S.beat(0.75, (s) => { s[t].x = sx(idx); s[t].y = Y.discard; }, (id) => (id === t ? { arc: 30 } : null));
      S.beat(0.35, (s) => { s[t].z = 12; s.opSearch.content = `SEARCH CUT · find ${op.target}`; });

      S.step({ say: first
        ? 'Deal the Search Deck from the top onto two piles, alternating, and check each card’s value. The four of hearts has the value three, not zero: pile one. The ace of hearts has the value zero, the same as the target, so the deal stops.'
        : quick ? `The top card, the ${nm(found)}, already has the target value, ${op.target}, so the deal stops at once.`
          : `Deal ${op.deals.map((d) => nm(d.card)).join(', ')}. The ${nm(found)} has the target value, ${op.target}: stop.` });
      S.beat(0.45, (s) => {
        cap(s, quick ? 'Deal: the very first card has the same value' : 'Deal onto two piles until a card of the same value appears',
          quick ? `${nm(found)} already has the target value, ${op.target}, so the deal stops at once and pile 2 stays empty.`
            : `Deal from the top, alternating piles: ${op.deals.map((d) => `${nm(d.card)} to pile ${d.pile + 1}`).join(', ')}.\n${nm(found)} has the target value, ${op.target}, so the deal stops.`);
        s.pile0.o = 1; s.pile1.o = 1;
      });
      // each card dealt shows its value in its corner, and its row of the value table lights (Scott's father, 2026-10-06);
      // the rebuild clears them all, the target card's too, and says what it is doing (his next round, 2026-10-07)
      const cnt = [0, 0];
      op.deals.forEach((d, j) => {
        const h = cnt[d.pile]++, v = C.val(d.card);
        S.beat(0.55, (s) => {
          s[d.card].x = PILE_X[d.pile]; s[d.card].y = Y.search + h * 36; s[d.card].z = 20 + j;
          s[d.card].badge = 1; legOff(s); s['legBox' + v].o = 1;
          if (d.target) s[d.card].glow = 1;
        }, (id) => (id === d.card ? { arc: 34 } : null));
        if (d.target) S.hold(0.5);
      });

      const parts = [op.undealt.length ? `Cards never dealt shift over to the top: ${list(op.undealt)}` : 'Every card was dealt',
        `then the pile holding the find, one card at a time: ${list(findPile)}`].concat(otherPile.length ? [`then the other pile: ${list(otherPile)}`] : []);
      S.step({ say: first
        ? 'Rebuild: the cards that were never dealt shift over to the top. Then the pile holding the ace comes back one card at a time, and then the other pile.'
        : quick ? 'Rebuild: the undealt cards shift over, then the find.' : 'Rebuild.' });
      S.beat(0.45, (s) => {
        cap(s, 'Rebuild the Search Deck', `${parts.join('; ')}.\nThe Search Deck is now ${list(op.after)}.`);
        op.deals.forEach((d) => { s[d.card].badge = 0; }); legOff(s);
        s[t].glow = 0; s[t].badge = 0; s.opSearch.content = 'REBUILD SEARCH DECK';
      });
      // One card at a time, in the cipher's own order: the undealt cards shift over to the top, then the
      // pile holding the find (the last card dealt onto it comes back first), then the other pile.
      const u = op.undealt.length;
      if (u) S.beat(0.6, (s) => op.undealt.forEach((id, i) => { s[id].x = sx(i); }));
      findPile.concat(otherPile).forEach((id, j) => {
        if (j === findPile.length) S.hold(0.15);                 // a breath between the two piles
        S.beat(0.5, (s) => { s[id].x = sx(u + j); s[id].y = Y.search; s[id].z = 30; s[id].glow = 0; }, (q) => (q === id ? { arc: 40 } : null));
      });
      S.beat(0.3, (s) => { op.after.forEach((id, i) => { s[id].z = 10 + i; }); s.pile0.o = 0; s.pile1.o = 0; });

      // The new top card moves over to the keystream and becomes its value (Scott, 2026-10-05): its row of the value
      // table is framed in gold, and the card turns into the number.
      const g = 'ks' + ksN, slot = ksPos(ksN), out = op.output, vi = ksN, v = C.val(out);
      S.step({ say: first
        ? 'The new top card, the two of hearts, moves over to the keystream and becomes its value. Cards count from zero, so a two is worth one: the keystream starts with 1. That is one turn: one Count Cut, one Search Cut, one value.'
        : `The new top card, the ${nm(out)}, becomes the value ${v}.` });
      S.beat(0.45, (s) => {
        cap(s, `The new top card, ${nm(out)}, becomes the value ${v}`,
          `${nm(out)} is the new top card of the Search Deck. It moves to the keystream and becomes its value: ${VNAME[v]} of a suit = ${v}.\n`
          + `${first ? 'Every turn adds one value to the keystream this way. ' : ''}The keystream so far: ${KV.slice(0, vi + 1).join(' ')}.`);
        s[out].glow = 1; s[t].glow = 0; s[t].badge = 0; s.opSearch.content = ''; s[g].x = sx(0); s[g].y = Y.search;
      });
      S.beat(0.15, (s) => { s[g].o = 1; });
      S.beat(0.85, (s) => { s[g].x = slot.x; s[g].y = slot.y; s[g].s = KS; }, (id) => (id === g ? { arc: 60 } : null));
      S.beat(0.4, (s) => { s['legBox' + v].o = 1; });
      S.beat(0.6, (s) => { s[g].o = 0; s[g].s = KS * 0.6; s['ksTile' + vi].o = 1; s['ksN' + vi].o = 1; s['ksN' + vi].s = 1; s[out].glow = 0; });
      S.hold(0.3);
      ksN++;
    }

    function boundarySteps(r, f) {
      const fr = r.fr;
      S.step({ say: f === 0
        ? 'The Drive Deck is empty, so that is one round: with four cards per deck, two turns and two values. Now the Discard Pile is cut by a fixed amount called the rotation setting. Here it is three. Remember this setting. It turns out to matter more than anything else in the study.'
        : 'Drive Deck empty again: end of round two. Rotate the Discard Pile by three, same as before.' });
      S.beat(0.45, (s) => {
        cap(s, `End of round ${f + 1}: rotate the Discard Pile`,
          f === 0 ? 'The Drive Deck is empty: for a 4-card deck, two turns make one round. The spent cards are cut by the rotation setting:\nthe top 3 move to the bottom. This rotation setting is the variable the study turns out to care most about.'
            : 'The Drive Deck is empty again. The spent cards are cut by the rotation setting, 3, exactly as before.');
        status(s, `END OF ROUND ${f + 1}`, 'rotate, then the decks move up'); legOff(s);
        s.opDiscard.content = `ROTATE · ${ROT}`; s.rotBox.o = 1;
      });
      S.hold(0.3);
      cutRow(fr.discard, ROT % N, 'discard', true);
      S.hold(0.25);
      S.beat(0.3, (s) => { s.opDiscard.content = ''; cutDone(s); s.rotBox.o = 0; });

      S.step({ say: f === 0
        ? 'Now everything moves up. The hearts become the Drive Deck and the spades become the Search Deck. The suits have completely traded places, which is the mixing you want. And this snapshot of both decks is what the paper calls a state. That word carries the rest of the talk.'
        : 'Everything moves up again, and the suits cross back. This is state two.' });
      S.beat(0.45, (s) => {
        cap(s, 'The decks move up',
          f === 0 ? 'The Search Deck becomes the new Drive Deck; the rotated discard becomes the new Search Deck.\nThe suits have traded places. This exact pair of decks is the cipher’s state after round 1.'
            : 'Same exchange: the Search Deck moves up to drive, the rotated discard moves up to search, and the suits cross back.\nThis pair of decks is the state after round 2.');
      });
      S.beat(1.0, (s) => { place(s, fr.drive, 'drive'); place(s, fr.search, 'search'); });
      S.beat(0.55, (s) => {
        s.stateBox.o = 1; s.stateTab.o = 1; s.stateTxt.o = 1; s.stateTxt.content = `STATE ${f + 1}`;
        status(s, `STATE ${f + 1} RECORDED`, `after round ${f + 1}`);
      });
    }

    // ---- timeline
    const ALL = [...START_DRIVE, ...START_SEARCH];
