    S.step({ say: 'Here is the cipher at its smallest: two decks of just four cards each, the spades and the hearts. Each deck is simply a stack, with a top card and a bottom card.' });
    S.beat(0.45, (s) => cap(s, 'Setup: two decks of four cards, stacked',
      'Spades and hearts, four cards each, face up. Each deck is a stack, and the card you can see is its top card.\nThe spades will initially be the Drive Deck and the hearts initially the Search Deck; the Discard Pile starts empty.'));
    // Each deck builds one card at a time, bottom card first, still slow enough to see all four land (a little quicker
    // since 2026-10-05, Scott): the Drive Deck first, then the Search Deck.
    [START_DRIVE, START_SEARCH].forEach((deck, d) => {
      for (let k = N - 1; k >= 0; k--) {
        const id = deck[k], p = stackAt(k, d ? 'search' : 'drive');
        S.beat(0.34, (s) => { s[id].x = p.x; s[id].y = p.y; s[id].o = 1; });
        S.hold(0.07);
      }
      if (!d) S.hold(0.2);
    });
    S.hold(0.3);

    S.step({ say: 'To follow every card, each deck is fanned out face up, with its top card on the left. The spades start as the Drive Deck: they supply the numbers. The hearts start as the Search Deck: that is the deck that gets shuffled, and its top card is what the cipher puts out. One detail to keep in mind: every card value is one less than its face, so an ace is worth zero. That is zero indexing, and the card-value table on the right keeps it in view.' });
    S.beat(0.45, (s) => cap(s, 'Setup: each deck is a stack, fanned out with its top card on the left',
      'Four cards per deck: spades start as the Drive Deck and hearts as the Search Deck; the Discard Pile starts empty.\nEach card value is one less than its face (the table on the right): Ace = 0, Two = 1, Three = 2, Four = 3.'));
    // the top card stays put; the cards beneath slide out from under it to the right
    S.beat(1.1, (s) => { place(s, START_DRIVE, 'drive'); place(s, START_SEARCH, 'search'); status(s, 'ROUND 1', 'turn 1 of 2'); },
      (id) => { const i = ALL.indexOf(id); return i < 0 ? null : { w: [(i % N) * 0.08, (i % N) * 0.08 + 0.6] }; });
    S.beat(0.05, (s) => ALL.forEach((id) => { s[id].z = 10; }));   // fanned out, nothing overlaps: back to the usual layer
    S.hold(0.3);

    rounds.forEach((r, f) => {
      const ops = r.fr.ops;
      if (f) S.cuts.push(S.steps.length);                      // the second round starts the second slide
      for (let k = 0; k < N / 2; k++) { countSteps(ops[2 * k], f, k); searchSteps(ops[2 * k + 1], f, k); }
      boundarySteps(r, f);
    });

    // ---- the states slide (Scott's father, 2026-10-06): the two states those rounds reached, side by side. State 2's
    // cards shrink onto its tile; the starting decks and State 1 join it, one round apart, each round with the two values
    // it gave; then the dashed way back to State 1, the cycle the rest of the talk measures.
    S.cuts.push(S.steps.length);                            // the two states start the third slide
    const st2 = rounds[1].fr, onTile = (id) => {
      const r = st2.drive.includes(id) ? 0 : 1, i = (r ? st2.search : st2.drive).indexOf(id);   // the tile's layout is KINDS.tile in engine.js
      return { x: TS.x[2] + 133 + 54 * i - CARD_W / 2, y: TS.y + (r ? 127 : 49) - CARD_H / 2, s: 46 / CARD_W };
    };
    const ROWS_OFF = ['lblDriveT', 'lblDriveS', 'lblSearchT', 'lblSearchS', 'lblDiscardT', 'lblDiscardS', 'opSearch', 'opDiscard', 'pile0', 'pile1', 'stateTab', 'stateTxt'];
    ['drive', 'search', 'discard'].forEach((row) => { for (let i = 0; i < N; i++) ROWS_OFF.push(`slot_${row}${i}`); ROWS_OFF.push(`end_${row}0`, `end_${row}1`); });
    S.step({ say: 'Step back and look at what the two rounds did. Each round ended the same way: the Discard Pile was rotated, the decks moved up, and that pair of decks became the next state. Round one took the starting decks to State one and gave the values one and two. Round two took State one to State two and gave one and three. Two rounds, two states, four values. And what happens next depends only on the state the decks are in.' });
    S.beat(0.45, (s) => {
      cap(s, `Two rounds, two states, four values: ${KV.join(' ')}`,
        'Each round ends the same way: rotate the Discard Pile, move the decks up, and that pair of decks is the next state.\n'
        + `Round 1 took the starting decks to State 1 and gave ${KV.slice(0, 2).join(' ')}; round 2 took State 1 to State 2 and gave ${KV.slice(2).join(' ')}.`);
      status(s, 'TWO ROUNDS', 'two states, four values'); legOff(s);
    });
    S.beat(0.6, (s) => { ROWS_OFF.forEach((k) => { s[k].o = 0; }); });
    S.beat(1.3, (s) => {
      ALL.forEach((id) => Object.assign(s[id], onTile(id)));
      Object.assign(s.stateBox, { x: TS.x[2], y: TS.y, w: TW, h: TH, rx: 14 });          // the gold box closes in around it
    });
    S.beat(0.5, (s) => { s.tsT2.o = 1; ALL.forEach((id) => { s[id].o = 0; }); s.stateBox.o = 0; });   // the tile takes over
    S.beat(0.8, (s) => { s.tsT0.o = 1; s.tsT1.o = 1; }, (id) => (id === 'tsT1' ? { w: [0.3, 1] } : null));
    [1, 2].forEach((f) => {
      S.beat(0.6, (s) => { s['tsA' + f].draw = 1; s['tsL' + f].o = 1; });
      S.beat(0.45, (s) => { s['tsV' + f].o = 1; s['tsW' + f].o = 1; });
    });
    S.hold(0.4);

    S.step({ say: 'And if you keep going, 380 more rounds bring the decks back to exactly State one, 381 rounds after it, and from there everything repeats. The states run in a cycle, and measuring those cycles is the rest of this work. But first, let’s put those four values to use.' });
    S.beat(0.45, (s) => {
      cap(s, 'Keep going, and the decks come back to State 1',
        'After 380 more rounds the decks are exactly where State 1 had them: 381 rounds, and then everything repeats.\nThe states run in a cycle, and measuring those cycles is the rest of this work. First, the four values put to use.');
      status(s, 'KEEP GOING', 'State 1 again after 381 rounds');
    });
    S.beat(1.0, (s) => { s.tsBack.o = 1; s.tsBackH.o = 1; });
    S.beat(0.5, (s) => { s.tsBackL.o = 1; });
    for (let i = 0; i < 4; i++) S.beat(0.2, (s) => { s['ksTile' + i].stroke = GOLD; s['ksTile' + i].sw = 5; });   // the four values, used next
    S.hold(0.4);

    // ---- final section: use the keystream. Shift column i forward (dir 1, into row c) or back
    // (dir -1, into the recovered row), one alphabet step per hop, as on the stream-cipher slide.
    function eshift(i, dir, hop) {
      const enc = dir > 0, src = (enc ? 'wT' : 'xT') + i, from = enc ? WORD[i] : CIPH[i];
      const T = (enc ? 'xT' : 'yT') + i, Lb = (enc ? 'xL' : 'yL') + i;
      S.beat(0.25, (s) => {
        s[src].stroke = GOLD; s[src].sw = 5; s['vT' + i].stroke = GOLD; s['vT' + i].sw = 5;
        s[T].o = 1; s[Lb].o = 1; s[Lb].content = from;
      });
      for (let k = 1; k <= KV[i]; k++) S.beat(hop, (s) => { s[Lb].content = shiftL(from, dir * k); });
      if (!KV[i]) S.hold(0.4);
      S.beat(0.3, (s) => {
        if (enc) { s[T].fill = INK; s[T].stroke = INK; s[T].sw = 2; s[Lb].fill = '#FFFFFF'; s[src].stroke = EDGE; s[src].sw = 2; }
        else { s[T].stroke = EDGE; s[T].sw = 2; s[src].stroke = INK; s[src].sw = 2; }
        s['vT' + i].stroke = EDGE; s['vT' + i].sw = 2;
      });
    }
    const DECK_IDS = [...START_DRIVE, ...START_SEARCH].concat(['lblDriveT', 'lblDriveS', 'lblSearchT', 'lblSearchS', 'lblDiscardT', 'lblDiscardS',
      'stateBox', 'stateTab', 'stateTxt', 'rotT', 'rotV', 'pile0', 'pile1'], ST_IDS);
    ['drive', 'search', 'discard'].forEach((row) => { for (let i = 0; i < N; i++) DECK_IDS.push(`slot_${row}${i}`); DECK_IDS.push(`end_${row}0`, `end_${row}1`); });
    // the keystream panel, cleared while the packet crosses the wire (Agent Bob stands where it is); the cards have
    // become their values, so the values come back, not the cards
    const RIGHT = ['ksT', 'ksS', 'legT', 'stat1', 'stat2'];
    for (let i = 0; i < 4; i++) RIGHT.push('ksSlot' + i, 'ksTile' + i, 'ksN' + i, 'legRow' + i);
    // the four values fly from their keystream tiles down to the keystream row
    const vnFly = (id) => { const m = id.match(/^vN(\d)$/); if (!m) return null; const a = +m[1] * 0.15; return { w: [a, a + 0.45], arc: 70 }; };

    S.cuts.push(S.steps.length);                            // using the keystream starts the fourth slide
    S.step({ say: 'Now let us actually use that keystream, the same way as the stream-cipher slide. Agent Alice wants to send Agent Bob a four-letter word: HACK. The keystream gives one value per letter: 1, 2, 1, 3.' });
    S.beat(0.45, (s) => {
      cap(s, 'Agent Alice uses the keystream on a message',
        'Agent Alice’s message is HACK, and the keystream gives one value per letter: 1 2 1 3.\nWith 4 cards per deck the values only run 0 to 3; at full size, 26 cards per deck, they run 0 to 25, one for every letter.');
      status(s, 'USING THE KEYSTREAM', 'one value per letter');
    });
    S.beat(0.7, (s) => { DECK_IDS.forEach((k) => { s[k].o = 0; }); });
    S.beat(0.8, (s) => { ['eAT', 'eAS', 'eBT', 'eBS'].concat(EV_A).forEach((k) => { s[k].o = 1; }); for (let i = 0; i < 4; i++) { s['wT' + i].o = 1; s['wL' + i].o = 1; s['vT' + i].o = 1; } },
      (id) => { const m = id.match(/^w[TL](\d)$/); return m ? { w: [+m[1] * 0.12, +m[1] * 0.12 + 0.5] } : null; });
    S.beat(1.8, (s) => { for (let i = 0; i < 4; i++) { s['vN' + i].x = ex(i) + ET / 2; s['vN' + i].y = EY.b + 77; s['vN' + i].o = 1; } }, vnFly);
    S.hold(0.3);

    S.step({ say: 'Agent Alice encrypts exactly as before: shift each letter forward by its value. H plus 1 is I, A plus 2 is C, C plus 1 is D, and K plus 3 is N. What gets sent is I, C, D, N. Notice the C that gets sent stands for an A, while the C in HACK became a D.' });
    S.beat(0.45, (s) => {
      cap(s, 'Agent Alice encrypts: shift each letter forward by its value',
        'H + 1 = I, A + 2 = C, C + 1 = D, K + 3 = N, so what is sent is ICDN.\nThe C that is sent stands for an A, while the C in HACK became a D: the letters give nothing away.');
      s.eCT.o = 1; s.eCS.o = 1; status(s, 'ENCRYPT', 'shift forward by each value');
    });
    for (let i = 0; i < 4; i++) eshift(i, 1, 0.32);
    S.hold(0.3);

    S.step({ say: 'And this is the same picture as the stream-cipher slide, because the Daniels’ Cipher is a stream cipher. Agent Alice sends only I, C, D, N across the wire. Eve, tapping the line, can copy all four letters, but without the keystream they say nothing. Agent Bob receives exactly the same four letters. The two decks of cards are simply the machine that makes the stream.' });
    S.beat(0.45, (s) => {
      cap(s, 'The packet crosses the wire from Agent Alice to Agent Bob',
        'The same picture as the stream cipher slide: only ICDN travels, and Eve’s copy says nothing meaningful.\nThe Daniels’ Cipher is a stream cipher; its two decks of cards are the machine that makes the keystream.');
      // the panel keeps ENCRYPT until the wire clears it (Scott, 2026-10-05: ON THE WIRE showed for only a second)
    });
    net.play((s) => {
      RIGHT.concat(['eAT', 'eAS', 'eBT', 'eBS', 'eCT', 'eCS'], EV_A).forEach((k) => { s[k].o = 0; });
      for (let i = 0; i < 4; i++) ['wT', 'wL', 'vT', 'vN', 'xT', 'xL'].forEach((p) => { s[p + i].o = 0; });
    });
    S.hold(0.3);

    S.step({ say: 'Agent Bob starts from the same key, so the same two rounds give the same four values: 1, 2, 1, 3. Shift each letter back, and the message returns: HACK. That is the whole process: a key, two decks of cards, a keystream, and a message encrypted, sent and decrypted.' });
    S.beat(0.45, (s) => {
      cap(s, 'Agent Bob decrypts: the same key gives the same keystream, so shift back',
        'Agent Bob’s two rounds give the same four values, 1 2 1 3: I − 1 = H, C − 2 = A, D − 1 = C, N − 3 = K.\nThat is the whole process: key, decks, keystream, then encrypt, send and decrypt.');
      status(s, 'DECRYPT', 'same key, same keystream');
    });
    S.beat(0.6, (s) => {
      net.ids.forEach((k) => { s[k].o = 0; });
      RIGHT.forEach((k) => { s[k].o = 1; });
      for (let i = 0; i < 4; i++) { s['ksTile' + i].stroke = '#CFCFCF'; s['ksTile' + i].sw = 2; s['vN' + i].x = KX + i * KP + (CARD_W * KS) / 2; s['vN' + i].y = KY + 68; }   // unseen, back on their tiles
    });
    S.beat(0.9, (s) => {                                        // what arrives takes the top row
      for (let i = 0; i < 4; i++) { s['xT' + i].y = EY.a; s['xL' + i].y = EY.a + 79; s['xT' + i].o = 1; s['xL' + i].o = 1; s['vT' + i].o = 1; }
      s.eAT.content = 'RECEIVED'; s.eAS.content = 'what reaches Agent Bob'; s.eAT.o = 1; s.eAS.o = 1;
      EV_B.forEach((k) => { s[k].o = 1; });
      s.eBT.content = '− SAME KEYSTREAM'; s.eBS.content = 'same key, same four values'; s.eBT.o = 1; s.eBS.o = 1;
    });
    for (let i = 0; i < 4; i++) S.beat(0.2, (s) => { s['ksTile' + i].stroke = GOLD; s['ksTile' + i].sw = 5; });  // the same four values, again
    S.beat(1.8, (s) => { for (let i = 0; i < 4; i++) { s['vN' + i].x = ex(i) + ET / 2; s['vN' + i].y = EY.b + 77; s['vN' + i].o = 1; } }, vnFly);
    S.beat(0.4, (s) => { s.eCT.content = '= MESSAGE'; s.eCS.content = 'each letter shifted back'; s.eCT.o = 1; s.eCS.o = 1; });
    for (let i = 0; i < 4; i++) eshift(i, -1, 0.3);
    S.beat(0.5, (s) => { s.eOk.o = 1; });
    S.hold(0.4);
    return S;
  }

  // ---- the zoom-out grid: every configuration studied, each a ring of cycle shares (largest cycle red, the second
  // charcoal, the rest gold) with its number of cycles inside. The cycles animation builds it up; the giant-cycles and
  // rotation slides open on it, so all three show the same picture. Shares (largest, 2nd, 3rd, all others) for 4 and
  // 6 cards are from Table 3 of the paper, for 8 cards from Tables 4-5 and Appendix Tables 8-11.
  const ZROTS = ['r = 0', 'r = 1', 'r = 3', 'r = 5'], ZX = [615, 967, 1319, 1671], ZY = [180, 395, 610], ZR = 62, ZSEG = [RED, CHAR, GOLD_D, GOLD_D];
  const ZDUP = ['#BDBDBD', '#CFCFCF', '#E0E0E0', '#E0E0E0'];      // the duplicate cell's greys
  const ZHI = 0, ZHJ = 2;                                   // the cycles animation's own cell: 4 cards, rotation 3
  const zArc = (share) => Math.max(0, share - 0.006);       // each segment leaves a hairline gap
  function zoomConfigs() {
    const L = loopData(), here = L.cyc.map((c) => c.length / L.nxt.length);
    return [
      { lab: '4 cards per deck', states: '576 states', cells: [[0.7153, 0.2326, 0.0486, 0.0035, 4], [0.5799, 0.3021, 0.0729, 0.0451, 4], here.concat([L.cyc.length]), Object.assign([0.5799, 0.3021, 0.0729, 0.0451, 4], { note: 'a duplicate of r = 1 (5 mod 4 = 1)' })] },
      { lab: '6 cards per deck', states: '518,400 states', cells: [[0.8028, 0.1876, 0.0068, 0.0028, 8], [0.4244, 0.2473, 0.2209, 0.1074, 8], [0.7220, 0.1863, 0.0545, 0.0373, 6], [0.8539, 0.1185, 0.0271, 0.0006, 8]] },
      { lab: '8 cards per deck', states: '1,625,702,400 states', cells: [[0.4483, 0.4383, 0.0730, 0.0405, 26], [0.4802, 0.2160, 0.1809, 0.1228, 18], [0.6572, 0.1690, 0.0939, 0.0798, 26], [0.7840, 0.1498, 0.0232, 0.0430, 28]] },
    ];
  }
  // Where the keys land, by configuration: the share of keys whose first state is on the largest cycle, the second, the
  // third and all others (4 and 6 cards from Final Report/Misc/decompose_deck4_6.py's decomposition, 8 cards from the
  // Appendix's deck8kc_rot*.txt). The example's own cell is counted from the scene's keys.
  function keyConfigs() {
    const L = loopData(), counts = [0, 0, 0, 0];
    L.keys.forEach((k) => { counts[L.where[k.code].ci]++; });
    return [
      { lab: '4 cards per deck', states: '576 states', cells: [[0.7188, 0.2305, 0.0508, 0], [0.5820, 0.3086, 0.0508, 0.0586], counts.map((c) => c / L.keys.length),
        Object.assign([0.5820, 0.3086, 0.0508, 0.0586], { note: 'a duplicate of r = 1 (5 mod 4 = 1)' })] },
      { lab: '6 cards per deck', states: '518,400 states', cells: [[0.8036, 0.1867, 0.0068, 0.0029], [0.4266, 0.2440, 0.2212, 0.1082], [0.7228, 0.1870, 0.0536, 0.0367], [0.8557, 0.1172, 0.0266, 0.0005]] },
      { lab: '8 cards per deck', states: '1,625,702,400 states', cells: [[0.4483, 0.4383, 0.0729, 0.0404], [0.4803, 0.2159, 0.1809, 0.1229], [0.6573, 0.1688, 0.0940, 0.0799], [0.7840, 0.1498, 0.0232, 0.0430]] },
    ];
  }
  // What a grid shows: each configuration's cycles (the cycles animation) or its keys (the key-landing animation).
  const STATE_GRID = { configs: zoomConfigs, num: (cell) => String(cell[4]), size: () => 36, unit: 'cycles', label: (cell) => `largest ${Math.round(cell[0] * 100)}%` };
  const KEY_GRID = { configs: keyConfigs, num: (cell, i) => ['256', '46,656', '16.8M'][i], size: (i) => (i ? 29 : 36), unit: 'keys', label: (cell) => `largest catches ${Math.round(cell[0] * 100)}%`, box: 210 };
  // Adds the grid: hidden, for the cycles animation to reveal cell by cell, or shown, for a slide that opens on it.
  function zoomGrid(S, shown, spec) {
    const G = spec || STATE_GRID, CONFIGS = G.configs(), on = shown ? 1 : 0;
    const cellIds = (i, j) => [0, 1, 2, 3].map((k) => `z${i}${j}a${k}`).concat([`z${i}${j}n`, `z${i}${j}c`, `z${i}${j}l`]);
    ZROTS.forEach((t, j) => S.add('zCol' + j, 'text', { size: 27, weight: 700, anchor: 'middle' }, { x: ZX[j], y: 62, content: t, o: on }));
    CONFIGS.forEach((row, i) => {
      S.add('zRow' + i, 'text', { size: 27, weight: 700 }, { x: 72, y: ZY[i] - 4, content: row.lab, o: on });
      S.add('zSts' + i, 'text', { size: 22 }, { x: 72, y: ZY[i] + 28, content: row.states, fill: GREY, o: on });
      row.cells.forEach((cell, j) => {
        const cx = ZX[j], cy = ZY[i], isHere = !shown && i === ZHI && j === ZHJ;
        // the mirrored configuration (4 cards, rotation 5) is greyed out, with a note saying it duplicates rotation 1
        // (Scott's father, 2026-10-06), so the grid's 12 cells show 11 configurations
        const dup = !!cell.note, seg = dup ? ZDUP : ZSEG;
        if (dup) S.add(`z${i}${j}m`, 'text', { size: 17, italic: true, anchor: 'middle' }, { x: cx, y: cy + 129, content: cell.note, fill: GREY, o: on, z: 4 });
        let cum = 0;
        for (let k = 0; k < 4; k++) {
          S.add(`z${i}${j}a${k}`, 'ring', { cap: 'butt' }, { x: cx, y: cy, r: ZR, stroke: seg[k], sw: 22, start: cum, draw: shown || isHere ? zArc(cell[k]) : 0, o: shown || !isHere ? 1 : 0, z: 3 });
          cum += cell[k];
        }
        S.add(`z${i}${j}n`, 'text', { size: G.size(i), weight: 700, anchor: 'middle' }, { x: cx, y: cy + Math.round(G.size(i) * 0.28), content: G.num(cell, i, j), fill: dup ? MID : INK, o: on, z: 4 });
        S.add(`z${i}${j}c`, 'text', { size: 18, anchor: 'middle' }, { x: cx, y: cy + 34, content: G.unit, fill: dup ? MID : GREY, o: on, z: 4 });
        S.add(`z${i}${j}l`, 'text', { size: 21, anchor: 'middle' }, { x: cx, y: cy + 104, content: G.label(cell), fill: dup ? MID : GREY, o: on, z: 4 });
      });
    });
    const bw = G.box || 176;     // wide enough for the cell's label
    S.add('zHere', 'rect', {}, { x: ZX[ZHJ] - bw / 2, y: ZY[ZHI] - 88, w: bw, h: 222, rx: 18, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, o: 0, z: 2 });
    // under each row's label, how many of its possible rotations were analyzed (Scott's father, 2026-10-06: 11 of 18)
    S.add('zNote0', 'text', { size: 19, italic: true }, { x: 72, y: ZY[0] + 62, content: '3 of the 4 possible rotations\n(2 not analyzed)', fill: GREY, o: on });
    S.add('zNote1', 'text', { size: 19, italic: true }, { x: 72, y: ZY[1] + 62, content: '4 of the 6 possible rotations\n(2 and 4 not analyzed)', fill: GREY, o: on });
    S.add('zNote', 'text', { size: 19, italic: true }, { x: 72, y: ZY[2] + 62, content: '4 of the 8 possible rotations\n(2, 4, 6 and 7 not analyzed)', fill: GREY, o: on });
    const showCell = (s, i, j) => { cellIds(i, j).forEach((id, q) => { if (q < 4) s[id].draw = zArc(CONFIGS[i].cells[j][q]); s[id].o = 1; }); };
    const rowTiming = (i) => (id) => { const m = id.match(/^z(\d)(\d)[anlcm]/); if (!m || +m[1] !== i) return null; const a = +m[2] * 0.14; return { w: [a, a + 0.55] }; };
    return { CONFIGS, cellIds, showCell, rowTiming };
  }
  // The scope slide's last click: the whole grid framed in gold, with the total. The giant-cycles slide opens on it.
  function scopeFrame(S, on, total, left) {
    const x0 = left || 528;       // the keys' grid has wider labels under its rings
    S.add('zAll', 'rect', {}, { x: x0, y: 26, w: 1802 - x0, h: 718, rx: 18, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, o: on, z: 2 });
    S.add('zTot', 'text', { size: 27, weight: 700 }, { x: 72, y: 56, content: '11 configurations analyzed', o: on });
    S.add('zTotS', 'text', { size: 24, weight: 700 }, { x: 72, y: 92, content: total || '6,504,884,928 states', fill: RED, o: on });
  }
  // Stacked bars of cycle shares, one per cell, in the rings' colours. Each segment starts empty (w 0); its share is
  // printed inside it when the segment is wide enough. Returns the segments, for unrollBars.
  function shareBars(S, pre, cells, ys, bx, bw, bh) {
    const segs = [];
    cells.forEach((cell, i) => {
      let cum = 0;
      for (let k = 0; k < 4; k++) {
        const id = `${pre}${i}${k}`, x = bx + cum * bw, w = Math.max(0, cell[k] * bw - 3);
        S.add(id, 'rect', {}, { x, y: ys[i] - bh / 2, w: 0, h: bh, rx: 4, fill: ZSEG[k], sw: 0, z: 5 });
        if (cell[k] >= 0.06) S.add(id + 't', 'text', { size: 24, weight: 700, anchor: 'middle' }, { x: x + w / 2, y: ys[i] + 9, content: `${(cell[k] * 100).toFixed(1)}%`, fill: k < 2 ? '#FFFFFF' : INK, o: 0, z: 6 });
        segs.push({ id, i, k, w, start: cum, share: cell[k], label: cell[k] >= 0.06 });
        cum += cell[k];
      }
    });
    return segs;
  }
  // Unroll rings into their bars: each arc peels off from 12 o'clock while its segment fills from the left, segment
  // by segment and row after row. ringOf(i, k) names the arc that bar segment (i, k) comes from.
  function unrollBars(S, segs, ringOf, rows, dur, extra) {
    const span = 1 - 0.12 * (rows - 1), win = {};
    segs.forEach((g) => {
      const a = 0.12 * g.i + g.start * span, b = 0.12 * g.i + (g.start + g.share) * span;
      win[g.id] = { w: [a, Math.max(a + 0.02, b)] };
      win[ringOf(g.i, g.k)] = win[g.id];
    });
    S.beat(dur, (s) => {
      segs.forEach((g) => { s[g.id].w = g.w; const r = s[ringOf(g.i, g.k)]; r.start += zArc(g.share); r.draw = 0; });
      if (extra) extra(s);
    }, (id) => win[id] || null);
  }
  // The reverse, so a slide can hand the grid back: each bar empties into its ring's arc, last row and last segment first.
  function rollBars(S, segs, ringOf, rows, dur, extra) {
    const span = 1 - 0.12 * (rows - 1), win = {};
    segs.forEach((g) => {
      const lag = 0.12 * (rows - 1 - g.i), a = lag + (1 - g.start - g.share) * span, b = lag + (1 - g.start) * span;
      win[g.id] = { w: [a, Math.max(a + 0.02, b)] };
      win[ringOf(g.i, g.k)] = win[g.id];
    });
    S.beat(dur, (s) => {
      segs.forEach((g) => { s[g.id].w = 0; const r = s[ringOf(g.i, g.k)]; r.start = g.start; r.draw = zArc(g.share); });
      if (extra) extra(s);
    }, (id) => win[id] || null);
  }

  // ================================================================ cycles: Part 3's five animation slides
  // One animation shown as five slides, each starting exactly where the one before it stopped (Scott, 2026-10-05):
  //   loops    : every state lands in a cycle, the 4-card example (deck 4, rotation 3), opening on the breakdown's State 1
  //   scope    : zoom out: the example's four cycles collapse into their cell of the grid of all 12 configurations
  //   growth   : the example's ring opens back into its 576 states, a 24 x 24 grid that shrinks into each larger square
  //   shares   : the growth rows slide back into the grid; one column (rotation 0) unrolls into bars and rolls back
  //   rotation : the 8-card row unrolls into bars
  // Each part adds its objects (the engine needs every object before the first step) and returns its steps.
  function buildLoops(S) {
    const L = loopData(), geo = ringGeo(L.cyc), total = L.nxt.length;

    // the worked example's two states, as tiles
    const fr1 = C.fullRound(START_DRIVE.slice(), START_SEARCH.slice(), ROT), fr2 = C.fullRound(fr1.drive, fr1.search, ROT);
    const TILE = { x1: 150, x2: 1230, y: 250, s: 1.6 };
    S.add('tile1', 'tile', { drive: fr1.drive, search: fr1.search, label: 'State 1' }, { x: TILE.x1, y: TILE.y, s: TILE.s, o: 0, z: 20 });
    S.add('tile2', 'tile', { drive: fr2.drive, search: fr2.search, label: 'State 2' }, { x: TILE.x2, y: TILE.y, s: TILE.s, o: 0, z: 20 });
    S.add('arr12', 'arrow', {}, { x: 730, y: 391, x2: 1190, y2: 391, draw: 0, stroke: INK, sw: 5, head: 22, z: 19 });
    S.add('arrLbl', 'text', { size: 28, anchor: 'middle', italic: true }, { x: 960, y: 366, content: 'one round', fill: GREY, o: 0 });
    // Which configuration this is, on every step: later slides change the deck size and the rotation.
    cfgTag(S);

    // The opening picture is the breakdown's State 1 as round 1 left it (the same rows, cards and gold box), so the
    // tiles are visibly the states worked out by hand: the decks shrink onto the State 1 tile, then the same cards
    // travel along the arrow and rearrange into State 2.
    const BX = 420, BP = 136, BY = { Drive: 50, Search: 292, Discard: 530 }, bsx = (i) => BX + i * BP, OPEN = [];
    [['Drive', 'DRIVE DECK', 'spends two cards each turn'], ['Search', 'SEARCH DECK', 'gets shuffled; gives the values'],
      ['Discard', 'DISCARD PILE', 'spent cards, first one on top']].forEach(([k, t, sub]) => {
      OPEN.push(S.add('bl' + k + 'T', 'text', { size: 27, weight: 700, ls: 1.5 }, { x: 72, y: BY[k] + 70, content: t }));
      OPEN.push(S.add('bl' + k + 'S', 'text', { size: 21 }, { x: 72, y: BY[k] + 102, content: sub, fill: GREY }));
      for (let i = 0; i < N; i++) {
        OPEN.push(S.add(`bSlot${k}${i}`, 'rect', { dash: '9 7' }, { x: bsx(i), y: BY[k], w: CARD_W, h: CARD_H, rx: 12, fill: '#FFFFFF', fo: 0, stroke: LIGHT, sw: 2, z: -2 }));
      }
    });
    OPEN.push(S.add('bTab', 'rect', {}, { x: 398, y: 8, w: 160, h: 44, rx: 10, fill: GOLD, sw: 0, z: 1 }));
    OPEN.push(S.add('bTabT', 'text', { size: 23, weight: 700, anchor: 'middle', ls: 1.5 }, { x: 478, y: 38, content: 'STATE 1', z: 2 }));
    OPEN.push(S.add('bStat1', 'text', { size: 32, weight: 700, ls: 1 }, { x: 1440, y: 330, content: 'STATE 1 RECORDED' }));
    OPEN.push(S.add('bStat2', 'text', { size: 25 }, { x: 1440, y: 368, content: 'after round 1', fill: GREY }));
    S.add('bBox', 'rect', {}, { x: 398, y: 30, w: 562, h: 460, rx: 18, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, z: -1 });
    const slotOf = (st, id) => { const r = st.drive.includes(id) ? 0 : 1; return { r, i: (r ? st.search : st.drive).indexOf(id) }; };
    // a full card drawn exactly over a tile's miniature of it (the tile's layout is KINDS.tile in engine.js)
    const onTile = (tx, st, id) => {
      const p = slotOf(st, id), k = TILE.s, cx = tx + k * (133 + 54 * p.i), cy = TILE.y + k * (p.r ? 127 : 49);
      return { x: cx - CARD_W / 2, y: cy - CARD_H / 2, s: (k * 46) / CARD_W };
    };
    const CARDS = fr1.drive.concat(fr1.search);
    CARDS.forEach((id) => {
      const p = slotOf(fr1, id);
      S.add('b' + id, 'card', { suit: id[0], v: C.val(id), w: CARD_W, h: CARD_H }, { x: bsx(p.i), y: p.r ? BY.Search : BY.Drive, z: 25 });
    });

    // ring guides, labels, centre counters
    geo.forEach((g, i) => {
      S.add('guide' + i, 'ring', {}, { x: g.cx, y: g.cy, r: g.r, stroke: LIGHT, sw: 2, draw: 0, z: -1 });
    });
    S.add('counter', 'text', { size: 44, weight: 700, anchor: 'middle', fmt: '{n}' }, { x: 560, y: 392, num: 1, o: 0 });
    S.add('counterLbl', 'text', { size: 26, anchor: 'middle' }, { x: 560, y: 432, content: 'states in this cycle', fill: GREY, o: 0 });
    // each cycle numbered by size, largest first, over the number of states it holds
    const CYC = [{ x: 560, y: 384, a: 'middle', s: 40, s2: 28 }, { x: 1180, y: 392, a: 'middle', s: 34, s2: 24 },
      { x: 1462, y: 296, a: 'start', s: 30, s2: 22 }, { x: 1462, y: 478, a: 'start', s: 30, s2: 22 }];
    CYC.forEach((p, i) => {
      S.add('ringLbl' + i, 'text', { size: p.s, weight: 700, anchor: p.a }, { x: p.x, y: p.y, content: `Cycle #${i + 1}`, fill: LOOP_COL[i], o: 0 });
      S.add('ringSub' + i, 'text', { size: p.s2, anchor: p.a }, { x: p.x, y: p.y + p.s2 + 12, content: `${L.cyc[i].length} States`, fill: GREY, o: 0 });
    });
    // State 1 and State 2, one round apart, so neighbours on Cycle #1 (Scott, 2026-10-05): one ring holds both dots, with
    // each name on its own side, so the two states worked out in the breakdown visibly sit side by side on this cycle.
    const S12 = { x: (geo[0].at(0).x + geo[0].at(1).x) / 2, y: (geo[0].at(0).y + geo[0].at(1).y) / 2 };
    S.add('s1Mark', 'ring', {}, { x: S12.x, y: S12.y, r: 15, stroke: INK, sw: 3, o: 0, z: 30 });
    S.add('s1Lbl', 'text', { size: 23, weight: 700, anchor: 'end' }, { x: S12.x - 26, y: S12.y - 14, content: 'State 1', o: 0, z: 30 });
    S.add('s2Lbl', 'text', { size: 23, weight: 700, anchor: 'start' }, { x: S12.x + 26, y: S12.y - 14, content: 'State 2', o: 0, z: 30 });

    // the 576 states as dots: start hidden at their grid cell
    const G0x = 447, G0y = 128, GS = 22;
    const grid = (code) => ({ x: G0x + (code % 24) * GS, y: G0y + Math.floor(code / 24) * GS });
    for (let code = 0; code < total; code++) {
      const w = L.where[code], p = w.ci === 0 ? geo[0].at(w.k) : grid(code);
      S.add('d' + code, 'dot', {}, { x: p.x, y: p.y, r: 3.6, fill: w.ci === 0 ? RED : MID, o: 0, z: 2 });
    }
    S.add('gridX', 'text', { size: 24, anchor: 'middle' }, { x: G0x + 253, y: G0y - 34, content: 'Drive Deck: 4! = 24 orders →', fill: GREY, o: 0 });
    S.add('gridY', 'text', { size: 24, anchor: 'middle' }, { x: G0x - 40, y: G0y + 253, content: 'Search Deck: 4! = 24 orders →', fill: GREY, o: 0, rot: 90 });
    // how 576 comes about: (n!)^2, then the numbers for n = 4
    S.add('gridEq', 'text', { size: 46, weight: 700 }, { x: 1110, y: 318, content: 'states = (n!)²', o: 0 });
    S.add('gridEq2', 'text', { size: 40, weight: 700 }, { x: 1110, y: 380, content: '(4!)² = 24 × 24 = 576', fill: RED, o: 0 });
    S.add('gridEq3', 'text', { size: 26 }, { x: 1110, y: 428, content: 'n = 4 cards per deck, so each deck has 4! = 24 orders', fill: GREY, o: 0 });
    // where the 576 are, before the sort: State 1's cycle (red) and the rest (grey)
    S.add('talD1', 'dot', {}, { x: 1124, y: 522, r: 10, fill: RED, o: 0 });
    S.add('talT1', 'text', { size: 30, weight: 700 }, { x: 1148, y: 533, content: '381 on State 1’s cycle', fill: RED, o: 0 });
    S.add('talD2', 'dot', {}, { x: 1124, y: 574, r: 10, fill: MID, o: 0 });
    S.add('talT2', 'text', { size: 30, weight: 700 }, { x: 1148, y: 585, content: '195 on other cycles', fill: CHAR, o: 0 });

    // contrast panels: a clean cycle versus Solitaire's merging on-ramp
    const PA = { cx: 1190, cy: 340, r: 105 }, PB = { cx: 1650, cy: 300, r: 78 };
    S.add('paT', 'text', { size: 27, weight: 700, anchor: 'middle' }, { x: PA.cx, y: 150, content: 'This cipher', o: 0 });
    S.add('paS', 'text', { size: 22, anchor: 'middle' }, { x: PA.cx, y: 182, content: 'every step can be undone', fill: GREY, o: 0 });
    S.add('paB', 'text', { size: 23, anchor: 'middle', weight: 700 }, { x: PA.cx, y: 500, content: 'one way in, one way out', fill: RED, o: 0 });
    S.add('pbT', 'text', { size: 27, weight: 700, anchor: 'middle' }, { x: PB.cx, y: 150, content: 'Solitaire, for contrast', o: 0 });
    S.add('pbS', 'text', { size: 22, anchor: 'middle' }, { x: PB.cx, y: 182, content: 'some steps cannot be undone', fill: GREY, o: 0 });
    S.add('pbB', 'text', { size: 23, anchor: 'middle', weight: 700 }, { x: PB.cx, y: 640, content: 'on-ramps merge into cycles', fill: CHAR, o: 0 });
    S.add('paRing', 'ring', {}, { x: PA.cx, y: PA.cy, r: PA.r, stroke: LIGHT, sw: 3, draw: 0 });
    S.add('pbRing', 'ring', {}, { x: PB.cx, y: PB.cy, r: PB.r, stroke: LIGHT, sw: 3, draw: 0 });
    const CHEV = 'M -9 -8 L 9 0 L -9 8 Z';
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (2 * Math.PI * i) / 10, am = a + Math.PI / 10;
      S.add('pa' + i, 'dot', {}, { x: PA.cx + PA.r * Math.cos(a), y: PA.cy + PA.r * Math.sin(a), r: 10, fill: RED, o: 0 });
      S.add('pac' + i, 'path', { d: CHEV }, { x: PA.cx + PA.r * Math.cos(am), y: PA.cy + PA.r * Math.sin(am), rot: (am * 180) / Math.PI + 90, fill: GREY, sw: 0, o: 0 });
    }
    const merge = { x: PB.cx, y: PB.cy + PB.r };
    for (let i = 0; i < 8; i++) {
      const a = -Math.PI / 2 + (2 * Math.PI * i) / 8, am = a + Math.PI / 8;
      S.add('pb' + i, 'dot', {}, { x: PB.cx + PB.r * Math.cos(a), y: PB.cy + PB.r * Math.sin(a), r: 10, fill: CHAR, o: 0 });
      S.add('pbc' + i, 'path', { d: CHEV }, { x: PB.cx + PB.r * Math.cos(am), y: PB.cy + PB.r * Math.sin(am), rot: (am * 180) / Math.PI + 90, fill: GREY, sw: 0, o: 0 });
    }
    const tail = [1, 2, 3, 4].map((k) => ({ x: merge.x - 38 * k, y: merge.y + 44 * k }));
    tail.forEach((p, i) => {
      S.add('tl' + i, 'dot', {}, { x: p.x, y: p.y, r: 10, fill: CHAR, o: 0 });
      const q = i === 0 ? merge : tail[i - 1];
      S.add('tlc' + i, 'path', { d: CHEV }, { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, rot: (Math.atan2(q.y - p.y, q.x - p.x) * 180) / Math.PI, fill: GREY, sw: 0, o: 0 });
    });
    S.add('mergeRing', 'ring', {}, { x: merge.x, y: merge.y, r: 20, stroke: GOLD, sw: 6, o: 0 });
    S.add('mergeLbl', 'text', { size: 21, anchor: 'start' }, { x: merge.x + 30, y: merge.y + 40, content: 'two different states\nlead to the same one', fill: INK, o: 0 });

    S.add('eq1', 'text', { size: 40, weight: 700, anchor: 'end' }, { x: 1840, y: 640, content: '381 + 173 + 11 + 11', o: 0 });
    S.add('eq2', 'text', { size: 40, weight: 700, anchor: 'end' }, { x: 1840, y: 694, content: '= 576 = (4!)²  ✓', fill: RED, o: 0 });

    const ring0 = L.cyc[0];
    const dotsOf = (ci) => L.cyc[ci].map((c) => 'd' + c);

    return () => {
      // ---- step 0: the breakdown's State 1, by itself, so the talk can tie back to part 2 before anything moves
      S.step({ say: 'Remember the breakdown? This is State one, the decks exactly as round one left them: four cards per deck, rotation three. Each snapshot of both decks, like this one, is called a state.' });
      S.beat(0.45, (s) => cap(s, 'Remember the breakdown? This is State 1',
        'The decks exactly as round 1 left them: 4 cards per deck, rotation r = 3.\nEach snapshot of both decks, like this one, is called a state.'));
      S.hold(0.3);

      // ---- step 1: State 1 shrinks onto a tile; one round later, the same cards are State 2
      S.step({ say: 'Shrink it down to a tile. One more round, the round we worked through by hand, rearranges the same cards into State two. That arrow is the whole cipher, seen from a distance: one round takes one state to the next. This is still the same small setup; later slides change the deck size and the rotation.' });
      S.beat(0.45, (s) => cap(s, 'One round moves the decks from State 1 to State 2',
        'Each snapshot becomes a tile. One round later, the same cards have moved into State 2.\nThe question is what happens if you keep following the rounds.'));
      // the rows fade, the decks shrink onto the State 1 tile, and the gold box closes in to frame it
      S.beat(1.3, (s) => {
        OPEN.forEach((k) => { s[k].o = 0; });
        CARDS.forEach((id) => Object.assign(s['b' + id], onTile(TILE.x1, fr1, id)));
        Object.assign(s.bBox, { x: TILE.x1, y: TILE.y, w: 336 * TILE.s, h: 176 * TILE.s, rx: 22 });
      });
      S.beat(0.8, (s) => { s.arr12.draw = 1; s.arrLbl.o = 1; });
      // the same cards travel along the arrow and rearrange into State 2 (the suits cross back) as the State 1 tile
      // appears behind them: hearts arc over the arrow, spades under it
      S.beat(1.6, (s) => {
        CARDS.forEach((id) => Object.assign(s['b' + id], onTile(TILE.x2, fr2, id)));
        s.tile1.o = 1; s.bBox.o = 0;
      }, (id) => {
        if (id === 'tile1' || id === 'bBox') return { w: [0, 0.3] };
        const k = id[0] === 'b' ? CARDS.indexOf(id.slice(1)) : -1;
        return k < 0 ? null : { w: [k * 0.035, k * 0.035 + 0.75], arc: slotOf(fr1, id.slice(1)).r ? -50 : 50 };
      });
      S.beat(0.5, (s) => { s.tile2.o = 1; CARDS.forEach((id) => { s['b' + id].o = 0; }); });
      S.hold(0.3);

      // ---- step 2: follow the arrows all the way round
      S.step({ say: 'So keep following them. Every dot is one state, one round apart. After 381 rounds, you land back on state one, exactly. So this cycle holds 381 states, and its length is how long the cipher runs before its secret stream repeats.' });
      S.beat(0.45, (s) => cap(s, 'Keep going, and you come back to State 1',
        'Each dot is one state, one round apart. After 381 rounds the decks are back exactly where State 1 had them.\nSo this cycle holds 381 states, and its length is how long the secret stream runs before it repeats.'));
      S.beat(0.8, (s) => {
        s.tile1.x = geo[0].at(0).x - 30; s.tile1.y = geo[0].at(0).y - 20; s.tile1.s = 0.12; s.tile1.o = 0;
        s.tile2.x = geo[0].at(1).x - 30; s.tile2.y = geo[0].at(1).y - 20; s.tile2.s = 0.12; s.tile2.o = 0;
        s.arr12.o = 0; s.arrLbl.o = 0;
        s.d254.o = 1; s['d' + ring0[1]].o = 1; s.s1Mark.o = 1; s.s1Lbl.o = 1; s.s2Lbl.o = 1;
      });
      S.beat(5.2, (s) => {
        ring0.forEach((c) => { s['d' + c].o = 1; });
        s.guide0.draw = 1; s.counter.o = 1; s.counterLbl.o = 1; s.counter.num = 381;
      }, (id) => {
        if (id === 'guide0' || id === 'counter') return { w: [0, 1] };
        if (id[0] === 'd') { const w = L.where[+id.slice(1)]; if (w && w.ci === 0 && w.k > 1) { const a = w.k / ring0.length; return { w: [a * 0.97, a * 0.97 + 0.03] }; } }
        return null;
      });
      S.beat(0.5, (s) => { s.s1Mark.r = 21; s.s1Mark.stroke = GOLD; s.s1Mark.sw = 6; });
      S.beat(0.5, (s) => { s.s1Mark.r = 15; s.s1Mark.stroke = INK; s.s1Mark.sw = 3; });

      // ---- step 3: why it is always a clean cycle
      S.step({ say: 'Why does it have to come back? Because every step of this cipher can be undone. So no two states ever lead to the same next state: each state has exactly one way in and one way out. That forces clean, separate cycles. Solitaire is different. Its steps cannot all be undone, so two states can lead to the same one, and you get on-ramps feeding into cycles, which makes it much harder to measure.' });
      S.beat(0.45, (s) => cap(s, 'Why it always comes back: every step can be undone',
        'Each state has exactly one way in and one way out, so nothing merges and every state sits on exactly one cycle.\nSolitaire’s steps cannot all be undone, so its states can merge onto on-ramps, which is much harder to measure.'));
      S.beat(0.6, (s) => { s.paT.o = 1; s.paS.o = 1; s.paRing.draw = 1; });
      S.beat(0.9, (s) => { for (let i = 0; i < 10; i++) { s['pa' + i].o = 1; s['pac' + i].o = 1; } s.paB.o = 1; },
        (id) => { const m = id.match(/^pac?(\d+)$/); return m ? { w: [+m[1] * 0.07, +m[1] * 0.07 + 0.3] } : null; });
      S.beat(0.6, (s) => { s.pbT.o = 1; s.pbS.o = 1; s.pbRing.draw = 1; });
      S.beat(0.9, (s) => {
        for (let i = 0; i < 8; i++) { s['pb' + i].o = 1; s['pbc' + i].o = 1; }
        for (let i = 0; i < 4; i++) { s['tl' + i].o = 1; s['tlc' + i].o = 1; }
      });
      S.beat(0.6, (s) => { s.mergeRing.o = 1; s.mergeLbl.o = 1; s.pbB.o = 1; });
      S.hold(0.3);

      // ---- step 4: all 576 states
      const panelIds = ['paT', 'paS', 'paB', 'pbT', 'pbS', 'pbB', 'paRing', 'pbRing', 'mergeRing', 'mergeLbl'];
      S.step({ say: 'Now the whole picture. A deck of n cards can be put in n-factorial orders, so the pair of decks has n-factorial squared states: with four cards, 24 times 24, or 576. Here is every one of them. The 381 in red are State one’s cycle. The other 195, in grey, are not on it, so they have to sit on other cycles.' });
      S.beat(0.45, (s) => cap(s, 'Every possible state: (n!)², here 576',
        'Each deck of n cards can be ordered n! ways, so the pair of decks has (n!)² states: (4!)² = 24 × 24 = 576.\nRed: the 381 states on State 1’s cycle. Grey: the other 195, which must sit on other cycles.'));
      S.beat(0.6, (s) => {
        panelIds.forEach((k) => { s[k].o = 0; });
        for (let i = 0; i < 10; i++) { s['pa' + i].o = 0; s['pac' + i].o = 0; }
        for (let i = 0; i < 8; i++) { s['pb' + i].o = 0; s['pbc' + i].o = 0; }
        for (let i = 0; i < 4; i++) { s['tl' + i].o = 0; s['tlc' + i].o = 0; }
        s.counter.o = 0; s.counterLbl.o = 0; s.guide0.o = 0; s.s1Mark.o = 0; s.s1Lbl.o = 0; s.s2Lbl.o = 0;
      });
      // State 1's 381 red states spread out to their places in the grid first; then the other 195 fill the gaps in grey
      S.beat(2.4, (s) => {
        for (let code = 0; code < total; code++) { const p = grid(code), k = 'd' + code; s[k].x = p.x; s[k].y = p.y; s[k].o = 1; s[k].fill = L.where[code].ci === 0 ? RED : MID; s[k].r = 5; }
        s.gridX.o = 1; s.gridY.o = 1;
      }, (id) => {
        if (!/^d\d+$/.test(id)) return null;
        const c = +id.slice(1), a = (c / total) * 0.2;
        return L.where[c].ci === 0 ? { w: [a, a + 0.4] } : { w: [0.6 + a, 0.8 + a] };
      });
      S.beat(0.6, (s) => { s.gridEq.o = 1; });
      S.beat(0.6, (s) => { s.gridEq2.o = 1; s.gridEq3.o = 1; });
      S.beat(0.6, (s) => { s.talD1.o = 1; s.talT1.o = 1; });
      S.beat(0.6, (s) => { s.talD2.o = 1; s.talT2.o = 1; });
      S.hold(0.3);

      // ---- step 5: sort them into cycles
      S.step({ say: 'Then I ran the cipher from every single state and sorted them by cycle, numbered by size. The red ones are cycle number one, State one’s cycle, with 381 states. The 195 grey ones split into three more: cycle two with 173, and cycles three and four with just 11 each. Four cycles, all 576 states.' });
      S.beat(0.45, (s) => cap(s, 'Running the cipher from every state sorts them into cycles',
        'Numbered by size: the 381 red states are Cycle #1, State 1’s cycle; the 195 grey ones are Cycles #2 to #4: 173 + 11 + 11 = 195.\nAll 576 states, in exactly four separate cycles.'));
      S.beat(0.5, (s) => { ['gridX', 'gridY', 'gridEq', 'gridEq2', 'gridEq3', 'talD1', 'talT1', 'talD2', 'talT2'].forEach((k) => { s[k].o = 0; }); });
      S.beat(3.2, (s) => {
        L.cyc.forEach((c, ci) => c.forEach((code, k) => {
          const p = geo[ci].at(k), id = 'd' + code;
          s[id].x = p.x; s[id].y = p.y; s[id].fill = LOOP_COL[ci]; s[id].r = ci < 2 ? 3.6 : 4.2;
        }));
        geo.forEach((g, i) => { s['guide' + i].draw = 1; s['guide' + i].o = 1; });
      }, (id) => {
        if (id[0] !== 'd') return null;
        const w = L.where[+id.slice(1)]; if (!w) return null;
        const base = [0, 0.25, 0.45, 0.5][w.ci], a = base + (w.k / L.cyc[w.ci].length) * 0.25;
        return { w: [a, a + 0.5] };
      });
      S.beat(0.7, (s) => { for (let i = 0; i < 4; i++) { s['ringLbl' + i].o = 1; s['ringSub' + i].o = 1; } s.s1Mark.o = 1; s.s1Lbl.o = 1; s.s2Lbl.o = 1; });
      S.hold(0.3);

      // ---- step 6: the self-check
      S.step({ say: 'And here is the self-check that runs through the whole project. Because every state sits on exactly one cycle, the cycle lengths have to add up to the total, n-factorial squared, exactly. 381 plus 173 plus 11 plus 11 is 576, which is four-factorial squared. That check passed in all eleven configurations I studied.' });
      S.beat(0.45, (s) => cap(s, 'The self-check: cycle lengths must add up to (n!)²',
        'Every state is on exactly one cycle, so the cycle lengths must sum to (n!)² exactly: 576 = (4!)² here. They do, in all 11 configurations studied.\nAt 8 cards per deck: (8!)² = 1,625,702,400 states, sorted into 18 to 28 cycles depending on the rotation setting.'));
      S.beat(0.7, (s) => { s.eq1.o = 1; });
      S.beat(0.7, (s) => { s.eq2.o = 1; });
      S.hold(0.4);
    };
  }

  // ---- growth
  // How fast the state space grows. The 4-card states fill a 24 × 24 grid (a Drive Deck order across, a Search Deck
  // order down), and each larger deck's square holds the one before as a single block. Every step multiplies by a
  // perfect square: (6!/4!)² = 30², (8!/6!)² = 56², (10!/8!)² = 90².
  function buildGrowth(S) {
    const X0 = 150, Y0 = 96, L = 600, WHITE = '#FFFFFF';
    // k × k filled blocks in a 0..L box, as one path, so a whole level scales about its top-left corner
    const blocks = (k, gap) => {
      const c = L / k, w = (c - gap).toFixed(2);
      let d = '';
      for (let r = 0; r < k; r++) for (let q = 0; q < k; q++) d += `M${(q * c + gap / 2).toFixed(2)} ${(r * c + gap / 2).toFixed(2)}h${w}v${w}h-${w}z`;
      return d;
    };
    const mesh = (k) => { const c = L / k; let d = ''; for (let i = 0; i <= k; i++) { const v = (i * c).toFixed(2); d += `M${v} 0V${L}M0 ${v}H${L}`; } return d; };
    let dots = '';
    for (let r = 0; r < 24; r++) for (let q = 0; q < 24; q++) dots += `M${q * 25 + 4.5} ${r * 25 + 12.5}a8 8 0 1 0 16 0a8 8 0 1 0 -16 0z`;
    // level 0: the 576 states; levels 1 and 2: 900 and 3,136 blocks; level 3, not done: only an outline and a mesh
    S.add('lv0', 'path', { d: dots }, { x: X0, y: Y0, fill: CHAR, sw: 0, o: 0, z: 4 });
    S.add('lv1', 'path', { d: blocks(30, 2) }, { x: X0, y: Y0, fill: CHAR, sw: 0, o: 0, z: 3 });
    S.add('lv2', 'path', { d: blocks(56, 1.4) }, { x: X0, y: Y0, fill: CHAR, sw: 0, o: 0, z: 2 });
    S.add('lv3', 'path', { d: mesh(90) }, { x: X0, y: Y0, stroke: MID, sw: 0.6, o: 0, z: 1 });
    S.add('lv3b', 'rect', { dash: '12 8' }, { x: X0, y: Y0, w: L, h: L, rx: 0, fill: WHITE, fo: 0, stroke: CHAR, sw: 3, o: 0, z: 1 });
    S.add('axX', 'text', { size: 24, anchor: 'middle' }, { x: X0 + L / 2, y: Y0 - 26, content: 'Drive Deck: 4! = 24 orders →', fill: GREY, o: 0 });
    S.add('axY', 'text', { size: 24, anchor: 'middle' }, { x: X0 - 32, y: Y0 + L / 2, content: 'Search Deck: 4! = 24 orders →', fill: GREY, o: 0, rot: 90 });
    // the gold frame follows the square drawn so far as it shrinks into one block; the callout names that block
    S.add('frame', 'rect', {}, { x: X0 - 6, y: Y0 - 6, w: L + 12, h: L + 12, rx: 6, fill: WHITE, fo: 0, stroke: GOLD, sw: 5, o: 0, z: 6 });
    S.add('callA', 'arrow', {}, { x: X0 + 112, y: Y0 + 126, x2: X0 + 30, y2: Y0 + 30, draw: 0, stroke: GOLD_D, sw: 3, head: 14, z: 7 });
    S.add('callP', 'rect', {}, { x: X0 + 112, y: Y0 + 100, w: 340, h: 52, rx: 26, fill: WHITE, stroke: GOLD, sw: 3, o: 0, z: 8 });
    S.add('callT', 'text', { size: 22, weight: 700, anchor: 'middle' }, { x: X0 + 282, y: Y0 + 134, content: '', o: 0, z: 9 });

    // one row per deck size: cardinal when counted completely, white and dashed when not done yet (10 cards). Each row
    // gives the time per rotation on one computer (Scott's father, 2026-10-07): 8 cards from the run logs, 601-1,037 s
    // (the paper's "roughly fifteen minutes"); 6 cards about 0.3 s at that rate (the Python port: 9 s); 4 cards 3 ms
    // even in Python
    const RX = 822, RW = 1026, RH = 124, RYS = [96, 238, 380, 522];
    const ROWS = [
      ['4 cards per deck · 24 × 24 orders', '576 states', '', '256 keys · milliseconds per rotation'],
      ['6 cards per deck · 720 × 720 orders', '518,400 states', '× 900', '46,656 keys · under a second per rotation'],
      ['8 cards per deck · 40,320 × 40,320 orders', '1,625,702,400 states', '× 3,136', '16,777,216 keys · about 15 minutes per rotation'],
      ['10 cards per deck · 3,628,800 × 3,628,800 orders', '13.2 trillion states', '× 8,100', 'about 3 TB · about 3 months per rotation'],
    ];
    ROWS.forEach(([lab, big, mult, keys], i) => {
      const y = RYS[i], next = i === 3, ink = next ? INK : WHITE, mute = next ? GREY : WHITE;
      S.add('rw' + i, 'rect', next ? { dash: '12 8' } : {}, { x: RX, y, w: RW, h: RH, rx: 14, fill: next ? WHITE : RED, stroke: next ? CHAR : RED, sw: next ? 3 : 0, o: 0 });
      S.add('rl' + i, 'text', { size: 21, weight: 700 }, { x: RX + 28, y: y + 40, content: lab, fill: mute, o: 0 });
      S.add('rb' + i, 'text', { size: 44, weight: 700 }, { x: RX + 28, y: y + 96, content: big, fill: ink, o: 0 });
      S.add('rm' + i, 'text', { size: 34, weight: 700, anchor: 'end' }, { x: RX + RW - 28, y: y + 56, content: mult, fill: ink, o: 0 });
      S.add('rk' + i, 'text', { size: 21, anchor: 'end' }, { x: RX + RW - 28, y: y + 96, content: keys, fill: mute, o: 0 });
    });
    S.add('fwP', 'rect', {}, { x: RX + RW - 360, y: RYS[3] + 26, w: 168, h: 36, rx: 8, fill: INK, sw: 0, o: 0 });
    S.add('fwT', 'text', { size: 16, weight: 700, anchor: 'middle', ls: 1 }, { x: RX + RW - 276, y: RYS[3] + 50, content: 'FUTURE WORK', fill: WHITE, o: 0 });
    S.add('fnP', 'rect', {}, { x: RX, y: 664, w: RW, h: 72, rx: 14, fill: '#F3F3F3', sw: 0, o: 0 });
    S.add('fnT', 'text', { size: 22 }, { x: RX + 28, y: 708, content: 'Full size, 26 cards per deck: about 1.6 × 10⁵³ states. Far beyond counting.', fill: CHAR, o: 0 });
    const showRow = (s, i) => { ['rw', 'rl', 'rb', 'rm', 'rk'].forEach((p) => { s[p + i].o = 1; }); if (i === 3) { s.fwP.o = 1; s.fwT.o = 1; } };
    // what the scope slide leaves on screen: all of the grid but the example's cell and the 4-card row's label fades
    const { cellIds } = S.grid, HERE = cellIds(ZHI, ZHJ);
    const GRID_FADE = ['zAll', 'zTot', 'zTotS', 'zNote', 'zNote0', 'zNote1', 'z03m', 'zHere', 'zRow1', 'zSts1', 'zRow2', 'zSts2'];
    for (let j = 0; j < 4; j++) GRID_FADE.push('zCol' + j);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) if (i !== ZHI || j !== ZHJ) GRID_FADE.push(...cellIds(i, j));

    return () => {
      // One zoom-out step: frame the square drawn so far, shrink it by k into the top-left block of the next level as
      // that level appears, then point the callout at the block and add the deck size's row.
      const scale = { lv0: 1 };
      function zoom(k, lv, extras, row, text, axis) {
        Object.keys(scale).forEach((id) => { scale[id] /= k; });
        const shrunk = Object.assign({}, scale), appear = [lv].concat(extras);
        scale[lv] = 1;
        if (k !== 30) S.beat(0.4, (s) => { s.callA.draw = 0; s.callP.o = 0; s.callT.o = 0; s.frame.o = 0; });   // clear the last callout
        S.beat(0.02, (s) => { s.frame.w = L + 12; s.frame.h = L + 12; });            // back around the whole square, unseen
        S.beat(0.45, (s) => { s.frame.o = 1; });
        S.beat(1.9, (s) => {
          Object.keys(shrunk).forEach((id) => { s[id].s = shrunk[id]; });
          s.frame.w = L / k + 12; s.frame.h = L / k + 12;
          appear.forEach((id) => { s[id].o = 1; });
          s.axX.content = `Drive Deck: ${axis} orders →`; s.axY.content = `Search Deck: ${axis} orders →`;
        }, (id) => (appear.includes(id) ? { w: [0.45, 1] } : null));
        S.beat(0.5, (s) => { s.callA.x2 = X0 + L / k + 8; s.callA.y2 = Y0 + L / k + 8; s.callA.draw = 1; s.callP.o = 1; s.callT.o = 1; s.callT.content = text; });
        S.beat(0.6, (s) => showRow(s, row));
        S.hold(0.3);
      }

      // ---- step 0: the example's ring opens back into its 576 states, which fill a 24 x 24 grid, and its row label
      // slides over to become the 4-card row
      S.step({ say: 'Now, how fast does the number of states grow with the deck size? Start from our example: its ring opens back into its 576 states, one dot each, in a grid with a Drive Deck order across and a Search Deck order down. 24 times 24 is 576, and a computer counts them in milliseconds.' });
      S.beat(0.45, (s) => cap(s, 'Every state at 4 cards per deck: 24 × 24 = 576',
        'The 4-card example again: one dot per state, a Drive Deck order across and a Search Deck order down.\nNow watch what happens to that number as the decks get bigger.'));
      S.beat(0.6, (s) => { GRID_FADE.forEach((k) => { s[k].o = 0; }); });
      // the example's ring turns back into its 576 dots (the scope slide left them on it, unseen)...
      S.beat(0.4, (s) => { HERE.forEach((k) => { s[k].o = 0; }); for (let c = 0; c < 576; c++) s['d' + c].o = 1; });
      // ...which fly into the grid, while the 4-card label slides over and grows into the 4-card row
      S.beat(2.0, (s) => {
        for (let c = 0; c < 576; c++) Object.assign(s['d' + c], { x: X0 + (c % 24) * 25 + 12.5, y: Y0 + Math.floor(c / 24) * 25 + 12.5, r: 8, fill: CHAR });
        Object.assign(s.zRow0, { x: RX + 28, y: RYS[0] + 40, s: 21 / 27, fill: WHITE, content: ROWS[0][0] });
        Object.assign(s.zSts0, { x: RX + 28, y: RYS[0] + 96, s: 2, fill: WHITE });
        s.rw0.o = 1;
      }, (id) => {
        if (/^d\d+$/.test(id)) { const a = (+id.slice(1) / 576) * 0.4; return { w: [a, a + 0.6] }; }
        return id === 'rw0' ? { w: [0.3, 1] } : null;
      });
      // the dots now sit on the grid's own dots and the label on the row's own words, so they take over unseen
      S.beat(0.35, (s) => {
        s.lv0.o = 1; s.axX.o = 1; s.axY.o = 1; for (let c = 0; c < 576; c++) s['d' + c].o = 0;
        s.zRow0.o = 0; s.zSts0.o = 0; ['rl0', 'rb0', 'rm0', 'rk0'].forEach((k) => { s[k].o = 1; });
      });
      S.hold(0.3);

      // ---- step 1: 6 cards
      S.step({ say: 'Now add two cards to each deck. Six cards have 720 orders, so there are 720 times 720 states: 518,400. That whole grid of 576 shrinks into one small block, and there are 900 blocks. Still small enough to count every state, in under a second for each rotation setting.' });
      S.beat(0.45, (s) => cap(s, '6 cards per deck: 720 × 720 = 518,400 states',
        'The whole 4-card grid shrinks into one block of a 30 × 30 grid: 900 times as many states.\nStill small enough to count every one, in under a second per rotation.'));
      zoom(30, 'lv1', [], 1, 'the whole 4-card grid', '6! = 720');

      // ---- step 2: 8 cards, the main result
      S.step({ say: 'Add two more. Eight cards per deck: 40,320 orders each, 1.6 billion states. The whole six-card square is now one block of a 56 by 56 grid. This is the main result of this work: every one of those 1.6 billion states counted, at four rotation settings, in about fifteen minutes each on one computer.' });
      S.beat(0.45, (s) => cap(s, '8 cards per deck: 1,625,702,400 states, the main result',
        'The whole 6-card square becomes one block of a 56 × 56 grid: 3,136 times more.\nEvery one of these states was counted, at four rotation settings: about 15 minutes per rotation on one computer.'));
      zoom(56, 'lv2', [], 2, 'the whole 6-card square', '8! = 40,320');

      // ---- step 3: 10 cards, future work
      // memory and time (Scott's father, 2026-10-06, asked why not servers): one machine would need about 3 TB and about
      // three months per rotation; servers could share it, given a method that splits one cycle's walk
      S.step({ say: 'So why stop at eight? Ten cards per deck is the next step, and it is future work: 13 trillion states, another 8,100 times more. Even stored as compactly as I could manage, that is about 3 terabytes of memory, and one computer walking the states one at a time would need about three months for each rotation setting. A bank of servers could do it, but only with a new method that splits that walk across many machines. That method, not more hardware, is the next contribution.' });
      S.beat(0.45, (s) => cap(s, '10 cards per deck: 13.2 trillion states, future work',
        'Another 90 × 90 = 8,100 times more: about 3 TB of memory, and about 3 months per rotation on one computer.\nServers could do it, but only with a new method that splits the work across many machines.'));
      zoom(90, 'lv3', ['lv3b'], 3, 'everything counted, at 8 cards', '10! = 3,628,800');

      // ---- step 4: keys, and the full-size deck
      S.step({ say: 'Keys grow differently: a key is a word as long as the deck, so 256 keys at four cards and 16.8 million at eight, about 97 states for every key. That comes back in the keys section. And the full-size deck, 26 cards, has about 10 to the 53rd states. Nobody is counting that.' });
      S.beat(0.45, (s) => cap(s, 'Keys grow more slowly; full size is far beyond counting',
        'A key is a word as long as the deck, so there are nⁿ keys: at 8 cards, about 97 states for every key.\nFull size, 26 cards per deck: (26!)² ≈ 1.6 × 10⁵³ states and about 6.2 × 10³⁶ keys.'));
      S.beat(0.6, (s) => { s.fnP.o = 1; s.fnT.o = 1; });
      S.hold(0.3);
    };
  }

  // ---- scope
  function buildScope(S) {
    const L = loopData(), total = L.nxt.length, here = L.cyc.map((c) => c.length / total), hereCum = [0];
    here.forEach((v, ci) => hereCum.push(hereCum[ci] + v));
    const grid = zoomGrid(S, false), { cellIds, showCell, rowTiming } = grid;
    S.grid = grid;                // the growth, giant-cycles and rotation parts work on this same grid
    scopeFrame(S, 0);
    return () => {
      // ---- step 0: zoom out, the example's four cycles collapse into their cell of the grid of every configuration
      S.step({ say: 'Here is what counting every state found. Remember the four cycles at four cards per deck, rotation three? That was one configuration: one deck size with one rotation setting. Zoom out, and it becomes one cell of a grid. Each ring is one configuration, split by cycle the same way: the largest cycle in red, the second in charcoal, the rest in gold, and the number inside is how many cycles it has. At four cards, rotation five is just rotation one again, because five mod four is one, so that cell is greyed out: a duplicate. Under each deck size is how many of its possible rotations I analyzed.' });
      S.beat(0.45, (s) => cap(s, 'Zoom out: this was one of the configurations analyzed',
        'A configuration is one deck size with one rotation setting. Each ring is one configuration: largest cycle red, second\ncharcoal, the rest gold; inside, how many cycles. Gold box: the 4-card example. Grey: a duplicate (5 mod 4 = 1).'));
      S.beat(0.6, (s) => {
        ['eq1', 'eq2', 'cfgTag', 'cfgTxt', 's1Mark', 's1Lbl', 's2Lbl'].forEach((k) => { s[k].o = 0; });
        for (let i = 0; i < 4; i++) { s['ringLbl' + i].o = 0; s['ringSub' + i].o = 0; s['guide' + i].o = 0; }
      });
      // every dot flies to its own place on the cell's ring, so the four cycles become the ring's four arcs
      S.beat(1.8, (s) => {
        for (let code = 0; code < total; code++) {
          const w = L.where[code], a = -Math.PI / 2 + 2 * Math.PI * (hereCum[w.ci] + (here[w.ci] * (w.k + 0.5)) / L.cyc[w.ci].length);
          Object.assign(s['d' + code], { x: ZX[ZHJ] + ZR * Math.cos(a), y: ZY[ZHI] + ZR * Math.sin(a), r: 3 });
        }
      }, (id) => { if (!/^d\d+$/.test(id)) return null; const ci = L.where[+id.slice(1)].ci; return { w: [ci * 0.07, ci * 0.07 + 0.78] }; });
      S.beat(0.6, (s) => {
        for (let code = 0; code < total; code++) s['d' + code].o = 0;
        cellIds(ZHI, ZHJ).forEach((id) => { s[id].o = 1; });
        s.zHere.o = 1; s['zCol' + ZHJ].o = 1; s.zRow0.o = 1; s.zSts0.o = 1;
      });
      S.beat(0.5, (s) => { ZROTS.forEach((t, j) => { s['zCol' + j].o = 1; }); });
      S.beat(1.3, (s) => { showCell(s, 0, 0); showCell(s, 0, 1); showCell(s, 0, 3); s.z03m.o = 1; s.zNote0.o = 1; }, rowTiming(0));
      S.hold(0.3);

      // ---- step 1: the 6-card row
      S.step({ say: 'Then the same complete count at six cards per deck, half a million states each. At six cards, all four rotation settings come out different.' });
      S.beat(0.45, (s) => cap(s, 'Then 6 cards per deck: 518,400 states each',
        'Every state counted again, at each of the four rotation settings.\nAt 6 cards, all four rotations come out different.'));
      S.beat(1.5, (s) => { s.zRow1.o = 1; s.zSts1.o = 1; s.zNote1.o = 1; for (let j = 0; j < 4; j++) showCell(s, 1, j); }, rowTiming(1));
      S.hold(0.3);

      // ---- step 2: the 8-card row, the main result
      S.step({ say: 'And at eight cards per deck, the main result: four complete counts of 1.6 billion states each, with 18 to 28 cycles apiece. These are four of the eight possible rotations at this size; rotations 2, 4, 6 and 7 are future work.' });
      S.beat(0.45, (s) => cap(s, 'And 8 cards per deck: 1,625,702,400 states each',
        'The main result: four complete counts of 1.6 billion states each, with 18 to 28 cycles apiece.\nThese are 4 of the 8 possible rotations at 8 cards; rotations 2, 4, 6 and 7 are future work.'));
      S.beat(1.5, (s) => { s.zRow2.o = 1; s.zSts2.o = 1; s.zNote.o = 1; for (let j = 0; j < 4; j++) showCell(s, 2, j); }, rowTiming(2));
      S.hold(0.3);

      // ---- step 3: the scope, with every row in full view (the growth slide opens on this frame)
      S.step({ say: 'That is the scope of this work: eleven configurations, eleven of the eighteen possible at these three deck sizes, about six and a half billion states, every one placed on exactly one cycle, with every configuration’s cycle lengths adding up exactly to n-factorial squared. The other seven are future work: rotation 2 at four cards, 2 and 4 at six, and 2, 4, 6 and 7 at eight. Next, how fast the number of states grows as the decks get bigger.' });
      S.beat(0.45, (s) => cap(s, 'The scope: 11 of 18 configurations, about 6.5 billion states',
        'Every state sits on exactly one cycle, and in every configuration the cycle lengths sum exactly to (n!)².\nFuture work, the other 7: rotation 2 at 4 cards; 2 and 4 at 6 cards; 2, 4, 6 and 7 at 8 cards.'));
      S.beat(0.6, (s) => { s.zHere.o = 0; s.zAll.o = 1; });
      S.beat(0.5, (s) => { s.zTot.o = 1; s.zTotS.o = 1; });
      S.hold(0.5);
    };
  }

  function cycles() {
    const S = new Scene('cycles', TITLES.loops);
    S.cuts = [];                  // where each slide after the first begins (see partsOf)
    chrome(S);
    // in slide order; scope makes the grid (S.grid) that the later parts use, so it is built before them
    const parts = [buildLoops(S), buildScope(S), buildGrowth(S), buildShares(S), buildRotation(S), buildAnalysis(S)];
    parts.forEach((steps, k) => { if (k) S.cuts.push(S.steps.length); steps(); });
    return S;
  }

  // ---- shares
  // The giant-cycles slide turns the growth slide's rows back into the grid of 12, then the rotation-0 column unrolls
  // into one bar per deck size; its last click rolls the bars back, where the rotation slide begins.
  function buildShares(S) {
    const { CONFIGS, cellIds } = S.grid, J = 0, BX = 760, BW = 1060, BH = 72;
    S.add('colBox', 'rect', {}, { x: ZX[J] - 92, y: 26, w: 184, h: 716, rx: 18, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, o: 0, z: 2 });
    const segs = shareBars(S, 'sb', CONFIGS.map((row) => row.cells[J]), ZY, BX, BW, BH);
    // after the unroll each ring is an empty outline around its number of cycles; above each bar, the tail
    const SMALLEST = [2, 26, 4];
    CONFIGS.forEach((row, i) => {
      const c = row.cells[J];
      S.add('sg' + i, 'ring', {}, { x: ZX[J], y: ZY[i], r: ZR, stroke: LIGHT, sw: 2, o: 0, z: 2 });
      S.add('st' + i, 'text', { size: 21, anchor: 'end' }, { x: BX + BW, y: ZY[i] - BH / 2 - 14, content: `the other ${c[4] - 2} cycles: ${((c[2] + c[3]) * 100).toFixed(1)}%`, fill: CHAR, o: 0 });
    });
    const others = ['zCol1', 'zCol2', 'zCol3', 'z03m'];
    for (let i = 0; i < 3; i++) for (let j = 1; j < 4; j++) others.push(...cellIds(i, j));
    // what the growth slide leaves on screen; its 4-, 6- and 8-card rows slide back into the grid's row labels
    const GROWTH_LEFT = ['lv0', 'lv1', 'lv2', 'lv3', 'lv3b', 'axX', 'axY', 'frame', 'callP', 'callT', 'fwP', 'fwT', 'fnP', 'fnT'];
    ['rw', 'rl', 'rb', 'rm', 'rk'].forEach((p) => GROWTH_LEFT.push(p + '3'));
    for (let i = 0; i < 3; i++) GROWTH_LEFT.push('rm' + i, 'rk' + i);
    const CELLS = ['zNote', 'zNote0', 'zNote1', 'z03m'];
    for (let j = 0; j < 4; j++) CELLS.push('zCol' + j);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 4; j++) CELLS.push(...cellIds(i, j));
    const rowIn = (id) => { const m = id.match(/^z(\d)(\d)[anlcm]/); if (!m) return null; const a = +m[1] * 0.15 + +m[2] * 0.04; return { w: [a, a + 0.5] }; };

    return () => {
      // ---- step 0: back to the grid of 12, then one column of it
      S.step({ say: 'Back to the grid of configurations, to see the shape of what came out. Take one column of the grid: no rotation, at all three deck sizes.' });
      S.beat(0.45, (s) => cap(s, 'Back to the grid: one column, rotation 0 at 4, 6 and 8 cards',
        'The same rings as before: largest cycle in red, the second in charcoal, the rest in gold.\nTo compare them, unroll each ring into a bar.'));
      S.beat(0.6, (s) => { GROWTH_LEFT.forEach((k) => { s[k].o = 0; }); s.callA.draw = 0; });
      S.beat(0.02, (s) => {         // the 4-card label, unseen where the growth slide left it, goes back home
        Object.assign(s.zRow0, { x: 72, y: ZY[0] - 4, s: 1, fill: INK, content: CONFIGS[0].lab });
        Object.assign(s.zSts0, { x: 72, y: ZY[0] + 28, s: 1, fill: GREY });
      });
      // each deck size's row slides over and shrinks into its row label; the label's words and the state count take over
      S.beat(1.1, (s) => {
        for (let i = 0; i < 3; i++) {
          Object.assign(s['rw' + i], { x: 56, y: ZY[i] - 44, w: 420, h: 96, o: 0 });
          Object.assign(s['rl' + i], { x: 72, y: ZY[i] - 4, s: 27 / 21, fill: INK, content: CONFIGS[i].lab });
          Object.assign(s['rb' + i], { x: 72, y: ZY[i] + 28, s: 0.5, fill: GREY });
        }
      });
      S.beat(0.35, (s) => { for (let i = 0; i < 3; i++) { s['rl' + i].o = 0; s['zRow' + i].o = 1; s['rb' + i].o = 0; s['zSts' + i].o = 1; } });
      S.beat(1.2, (s) => { CELLS.forEach((k) => { s[k].o = 1; }); }, rowIn);
      S.hold(0.4);
      S.beat(0.7, (s) => { others.forEach((k) => { s[k].o = 0.25; }); s.colBox.o = 1; });
      S.hold(0.3);

      // ---- step 1: unroll into bars
      S.step({ say: 'Unroll each ring into a bar: each bar is every state at that size, split by cycle. The pattern is the same every time: one or two enormous cycles hold nearly everything. At eight cards the two biggest hold 89 percent of all states.' });
      S.beat(0.45, (s) => cap(s, 'One or two giant cycles hold nearly every state',
        'Each bar is every state at that deck size, split by cycle, in the same colours as the rings.\nAt 8 cards the two largest cycles hold 89% of all 1.6 billion states.'));
      S.beat(0.6, (s) => { others.forEach((k) => { s[k].o = 0; }); s.colBox.o = 0; s.zNote.o = 0; s.zNote0.o = 0; s.zNote1.o = 0; for (let i = 0; i < 3; i++) s[`z${i}0l`].o = 0; });
      unrollBars(S, segs, (i, k) => `z${i}0a${k}`, 3, 2.4, (s) => { for (let i = 0; i < 3; i++) s['sg' + i].o = 1; });
      S.beat(0.5, (s) => { segs.forEach((g) => { if (g.label) s[g.id + 't'].o = 1; }); });
      S.hold(0.3);

      // ---- step 2: the tail
      S.step({ say: 'And then there is a tail of smaller cycles. At eight cards there are 26 cycles, and the smallest has just four states in it. Big cycles are what you want: a long cycle means a long stream before it repeats. The tail is the risk.' });
      S.beat(0.45, (s) => cap(s, 'Then a tail of smaller cycles: the risk',
        '4, 8 and 26 cycles in all; the smallest hold just 2, 26 and 4 states.\nA long cycle means a long stream before it repeats; a key that lands in the tail repeats early.'));
      S.beat(0.02, (s) => { for (let i = 0; i < 3; i++) { s[`z${i}0l`].content = `smallest: ${SMALLEST[i]} states`; s[`z${i}0l`].fill = RED; } });   // while hidden
      S.beat(0.6, (s) => { for (let i = 0; i < 3; i++) { s['st' + i].o = 1; s[`z${i}0l`].o = 1; } });
      S.hold(0.3);

      // ---- step 3: the bars roll back into the grid, where the rotation slide begins (Scott, 2026-10-05)
      S.step({ say: 'Back to the full grid. Next, hold the deck size at eight cards and change only the rotation setting.' });
      S.beat(0.45, (s) => cap(s, 'Back to all 11 configurations',
        'Next: the same 8-card cipher at each of its four rotation settings, the bottom row of the grid.'));
      S.beat(0.5, (s) => { segs.forEach((g) => { if (g.label) s[g.id + 't'].o = 0; }); for (let i = 0; i < 3; i++) { s['st' + i].o = 0; s[`z${i}0l`].o = 0; } });
      rollBars(S, segs, (i, k) => `z${i}0a${k}`, 3, 2.0, (s) => { for (let i = 0; i < 3; i++) s['sg' + i].o = 0; });
      S.beat(0.02, (s) => { for (let i = 0; i < 3; i++) { s[`z${i}0l`].content = `largest ${Math.round(CONFIGS[i].cells[J][0] * 100)}%`; s[`z${i}0l`].fill = GREY; } });   // while hidden
      S.beat(0.7, (s) => { others.forEach((k) => { s[k].o = 1; }); s.zNote.o = 1; s.zNote0.o = 1; s.zNote1.o = 1; for (let i = 0; i < 3; i++) s[`z${i}0l`].o = 1; });
      S.hold(0.3);
    };
  }

  // ---- rotation
  // The rotation slide opens on the grid of 12. Its first click replays the breakdown's rotation (Scott, 2026-10-06): the
  // Discard Pile at the end of round 1, 4♠ A♠ 3♠ 2♠, cut by r = 3 exactly as on slide 10 (same cards, gold frame, count
  // badge and boxed "Rotation setting"), so the room sees what the setting does before seeing what it does to the cycles.
  // Then the 8-card row is framed and unrolls into one bar per rotation setting.
  function buildRotation(S) {
    const { CONFIGS, cellIds } = S.grid, I = 2, BY = [150, 300, 450, 600], RC = 300, BX = 430, BW = 1020, BH = 72;
    S.add('rowBox', 'rect', {}, { x: 44, y: ZY[I] - 92, w: 1800, h: 226, rx: 18, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, o: 0, z: 2 });
    S.add('rHead', 'text', { size: 27, weight: 700 }, { x: 72, y: 62, content: '8 cards per deck: 1,625,702,400 states at each of the 4 rotations tested', o: 0 });
    const segs = shareBars(S, 'rr', CONFIGS[I].cells, BY, BX, BW, BH);   // 'rr', not the growth rows' 'rb'
    BY.forEach((y, j) => S.add('rg' + j, 'ring', {}, { x: RC, y, r: ZR, stroke: LIGHT, sw: 2, o: 0, z: 2 }));
    // the shortest cycle a real key can reach at each rotation
    S.add('kH', 'text', { size: 22, weight: 700, lh: 1.2 }, { x: 1500, y: 78, content: 'Shortest cycle a\nreal key reaches', o: 0 });
    [['4 rounds', true], ['225 rounds', false], ['4 rounds', true], ['289 rounds', false]].forEach(([t, bad], j) =>
      S.add('kV' + j, 'text', { size: 32, weight: 700 }, { x: 1500, y: BY[j] + 12, content: t, fill: bad ? RED : INK, o: 0 }));
    // the open question: the rotation labels framed in gold, the only thing that changed
    S.add('rotBx', 'rect', {}, { x: 60, y: BY[0] - 50, w: 128, h: BY[3] - BY[0] + 100, rx: 14, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, o: 0, z: 2 });
    S.add('why', 'text', { size: 24, weight: 700 }, { x: BX, y: 712, content: 'Why does one cut of the Discard Pile do this? Not yet known: observed, not derived.', fill: RED, o: 0 });
    const others = ['zRow0', 'zSts0', 'zRow1', 'zSts1', 'z03m', 'zNote0', 'zNote1'];
    for (let i = 0; i < 2; i++) for (let j = 0; j < 4; j++) others.push(...cellIds(i, j));
    // the 8-card row and the rotation labels, dimmed while the replay plays above them
    const ROW8 = ['zRow2', 'zSts2', 'zNote', 'zCol0', 'zCol1', 'zCol2', 'zCol3'];
    for (let j = 0; j < 4; j++) ROW8.push(...cellIds(I, j));

    // The replay of the breakdown's rotation, in the space the grid's top two rows leave: the Discard Pile row as slide
    // 10 draws it (label, card positions, top and bottom, ROTATE · 3) and its "Rotation setting r = 3" box beside it.
    const RD = { y: 150, x0: 420, p: 136 }, rdx = (i) => RD.x0 + i * RD.p, RD_IDS = [];
    const rd = (id, kind, cfg, st) => { RD_IDS.push(id); S.add(id, kind, cfg, Object.assign({ o: 0 }, st)); };
    const pile = C.fullRound(START_DRIVE.slice(), START_SEARCH.slice(), ROT).discard;   // 4♠ A♠ 3♠ 2♠, top to bottom
    const cut = ROT % N, moving = pile.slice(0, cut), after = pile.slice(cut).concat(moving);
    const fw = (cut - 1) * RD.p + CARD_W + 18, fx = rdx(0) - 9, fy = RD.y - 9, dx = (N - cut) * RD.p;
    rd('rdT', 'text', { size: 27, weight: 700, ls: 1.5 }, { x: 72, y: RD.y + 70, content: 'DISCARD PILE' });
    rd('rdS', 'text', { size: 21 }, { x: 72, y: RD.y + 102, content: 'spent cards, first one on top', fill: GREY });
    rd('rdOp', 'text', { size: 24, weight: 700, ls: 1 }, { x: 72, y: RD.y + 140, content: `ROTATE · ${cut}`, fill: RED });
    for (let i = 0; i < N; i++) rd('rdSlot' + i, 'rect', { dash: '9 7' }, { x: rdx(i), y: RD.y, w: CARD_W, h: CARD_H, rx: 12, fill: '#FFFFFF', fo: 0, stroke: LIGHT, sw: 2, z: 1 });
    rd('rdTop', 'text', { size: 19, anchor: 'middle' }, { x: rdx(0) + CARD_W / 2, y: RD.y + CARD_H + 22, content: 'top', fill: MID });
    rd('rdBot', 'text', { size: 19, anchor: 'middle' }, { x: rdx(N - 1) + CARD_W / 2, y: RD.y + CARD_H + 22, content: 'bottom', fill: MID });
    pile.forEach((id, i) => rd('rdC' + id, 'card', { suit: id[0], v: C.val(id), w: CARD_W, h: CARD_H }, { x: rdx(i), y: RD.y, z: 10 }));
    rd('rdRT', 'text', { size: 22, weight: 700 }, { x: 1040, y: RD.y + 55, content: 'Rotation setting' });
    rd('rdRV', 'text', { size: 24 }, { x: 1040, y: RD.y + 91, content: `r = ${ROT}` });
    rd('rdRB', 'rect', {}, { x: 1022, y: RD.y + 21, w: 236, h: 92, rx: 14, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, z: 1 });
    // the cut's gold frame and its count, which travel with the cards
    rd('rdBox', 'rect', {}, { x: fx, y: fy, w: fw, h: CARD_H + 18, rx: 18, fill: '#FFFFFF', fo: 0, stroke: GOLD, sw: 5, z: 41 });
    rd('rdBadge', 'dot', {}, { x: fx + fw - 4, y: fy + 4, r: 25, fill: GOLD, stroke: '#FFFFFF', sw: 3, z: 42 });
    rd('rdNum', 'text', { size: 30, weight: 700, anchor: 'middle' }, { x: fx + fw - 4, y: fy + 15, content: String(cut), z: 43 });
    const frameAt = (s, x, y) => { Object.assign(s.rdBox, { x, y }); Object.assign(s.rdBadge, { x: x + fw - 4, y: y + 4 }); Object.assign(s.rdNum, { x: x + fw - 4, y: y + 15 }); };
    const LIT = ['rdRB', 'rdBox', 'rdBadge', 'rdNum'], SETTING = ['rdRB', 'rdRT', 'rdRV'];
    // where the boxed setting lands: a frame around the grid's own r = 3 label (Scott, 2026-10-06)
    const HDR = { x: ZX[2] - 58, y: 22, w: 116, h: 54, rx: 12, sw: 4 };
    const rise = (id) => (id === 'rdRT' ? { w: [0, 0.35] } : id === 'zCol2' ? { w: [0.55, 1] } : null);

    return () => {
      // ---- step 0: what the rotation setting does, replayed from the breakdown (Scott, 2026-10-06)
      S.step({ say: 'Before the result, a reminder of what the rotation setting is. Remember the breakdown: at the end of every round, the Discard Pile is cut by the rotation setting. There it was three, so the top three cards moved to the bottom. That one cut is the only thing that changes in what comes next.' });
      S.beat(0.45, (s) => cap(s, 'Remember the rotation setting: one cut of the Discard Pile',
        'At the end of every round, the top r cards of the Discard Pile move to the bottom. In the breakdown r = 3, so three cards moved.\nThat one cut is the only thing that changes across the four settings that follow.'));
      S.beat(0.6, (s) => { others.forEach((k) => { s[k].o = 0; }); ROW8.forEach((k) => { s[k].o = 0.25; }); });
      S.beat(0.6, (s) => { RD_IDS.forEach((k) => { if (!LIT.includes(k)) s[k].o = 1; }); });
      S.hold(0.3);
      S.beat(0.45, (s) => { s.rdRB.o = 1; });                                   // the setting lights up...
      S.beat(0.45, (s) => { s.rdBox.o = 1; s.rdBadge.o = 1; s.rdNum.o = 1; });   // ...and frames the cards it moves
      S.hold(0.25);
      S.beat(0.35, (s) => { moving.forEach((id) => { s['rdC' + id].y = RD.y - 46; s['rdC' + id].z = 30; }); frameAt(s, fx, fy - 46); });
      S.beat(0.85, (s) => { after.forEach((id, i) => { s['rdC' + id].x = rdx(i); }); frameAt(s, fx + dx, fy - 46); });
      S.beat(0.35, (s) => { moving.forEach((id) => { s['rdC' + id].y = RD.y; s['rdC' + id].z = 10; }); frameAt(s, fx + dx, fy); });
      S.hold(0.25);
      S.beat(0.35, (s) => { s.rdBox.o = 0; s.rdBadge.o = 0; s.rdNum.o = 0; });
      S.hold(0.3);

      // ---- step 1: first the tie (Scott, 2026-10-06): the boxed r = 3 rises into the grid and frames its own column's
      // label, r = 3; then the frame hands over to the 8-card row, one highlight at a time
      S.step({ say: 'That rotation of three is this column of the grid: r equals 3. The study tried four settings, zero, one, three and five: the same cut, moving that many cards at the end of each round. And this is the surprise of the project. The bottom row is the same eight-card cipher at each setting, an implementation detail with no cryptographic reason behind it.' });
      S.beat(0.45, (s) => cap(s, 'Same 8-card cipher, four rotation settings',
        'The r = 3 just replayed is one column of the grid. The same cut moves 0, 1, 3 or 5 cards at the end of each round.\nThe bottom row is the 8-card cipher at each setting: an implementation detail with no cryptographic reason behind it.'));
      S.beat(0.45, (s) => { RD_IDS.forEach((k) => { if (!SETTING.includes(k)) s[k].o = 0; }); });
      S.beat(1.0, (s) => {
        Object.assign(s.rdRB, HDR);
        Object.assign(s.rdRT, { x: HDR.x + 18, y: HDR.y + 30, o: 0 });
        Object.assign(s.rdRV, { x: ZX[2] - 31, y: 62, o: 0 });
        s.zCol2.o = 1;
      }, rise);
      S.hold(0.7);
      S.beat(0.7, (s) => { s.rdRB.o = 0; others.forEach((k) => { s[k].o = 0.25; }); ROW8.forEach((k) => { s[k].o = 1; }); s.rowBox.o = 1; });
      S.hold(0.3);

      // ---- step 1: one bar per rotation
      S.step({ say: 'Unroll those four rings into bars. It changes everything. The largest cycle goes from 45 percent of all states at rotation 0 to 78 percent at rotation 5, and the number of cycles ranges from 18 to 28.' });
      S.beat(0.45, (s) => cap(s, 'The largest cycle grows from 45% to 78%',
        'Each bar is all 1.6 billion states at one rotation, split by cycle: largest red, second charcoal, the rest gold.\nThe largest cycle holds 44.8%, 48.0%, 65.7% and 78.4%; the number of cycles runs from 18 to 28.'));
      S.beat(0.6, (s) => {
        others.forEach((k) => { s[k].o = 0; });
        ['rowBox', 'zNote', 'zRow2', 'zSts2'].forEach((k) => { s[k].o = 0; });
        for (let j = 0; j < 4; j++) s[`z2${j}l`].o = 0;
        s.rHead.o = 1;
      });
      // each ring, with its number of cycles and its rotation label, moves to the start of its own bar
      S.beat(1.1, (s) => {
        for (let j = 0; j < 4; j++) {
          for (let k = 0; k < 4; k++) { s[`z2${j}a${k}`].x = RC; s[`z2${j}a${k}`].y = BY[j]; }
          s[`z2${j}n`].x = RC; s[`z2${j}n`].y = BY[j] + 10; s[`z2${j}c`].x = RC; s[`z2${j}c`].y = BY[j] + 34;
          s['zCol' + j].x = 124; s['zCol' + j].y = BY[j] + 10;
        }
      }, (id) => { const m = id.match(/^z2(\d)[anc]/) || id.match(/^zCol(\d)$/); if (!m) return null; const a = +m[1] * 0.1; return { w: [a, a + 0.7] }; });
      unrollBars(S, segs, (i, k) => `z2${i}a${k}`, 4, 2.6, (s) => { for (let j = 0; j < 4; j++) s['rg' + j].o = 1; });
      S.beat(0.5, (s) => { segs.forEach((g) => { if (g.label) s[g.id + 't'].o = 1; }); });
      S.hold(0.3);

      // ---- step 2: the shortest cycle a real key reaches
      S.step({ say: 'And look at the right column. At rotations 0 and 3, a real key lands on a cycle of just four rounds, so its stream would repeat after four rounds. At rotations 1 and 5, every cycle a key can reach is at least 225 rounds long.' });
      S.beat(0.45, (s) => cap(s, 'At rotations 0 and 3, a real key can land on a 4-round cycle',
        'The shortest cycle any real key reaches: 4 rounds at rotations 0 and 3; at least 225 at rotations 1 and 5.\nThe rotation decides how bad the worst key can be, not just the size of the big cycles.'));
      S.beat(0.5, (s) => { s.kH.o = 1; });
      S.beat(0.9, (s) => { for (let j = 0; j < 4; j++) s['kV' + j].o = 1; },
        (id) => { const m = id.match(/^kV(\d)$/); return m ? { w: [+m[1] * 0.15, +m[1] * 0.15 + 0.5] } : null; });
      S.hold(0.3);

      // ---- step 3: the open question
